<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0c0f">
<title>촬영자 화면</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0c0f;color:#eee;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:18px;margin:4px 0 10px}.sub{color:#8d95a1;font-size:13px;margin-bottom:14px}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.who button,.tk button{border:1px solid #2c2f36;background:#16181d;color:#eee;border-radius:12px;padding:16px 12px;font:inherit;font-size:17px;font-weight:800;text-align:left}
.who button small{display:block;color:#8d95a1;font-weight:600;font-size:12px;margin-top:3px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar button{border:0;background:#22252c;color:#eee;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;font-weight:700}
.bar b{margin-right:auto;font-size:16px}
.tk{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}.tk::-webkit-scrollbar{display:none}
.tk button{flex:none;padding:9px 13px;font-size:15px;border-radius:999px}.tk button.on{background:#f2c200;color:#111;border-color:#f2c200}
.card{background:#16181d;border:1px solid #2c2f36;border-radius:14px;overflow:hidden}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.cin{padding:12px 14px}.ttl{font-size:13px;color:#8d95a1}.cam{font-size:20px;font-weight:900;margin:2px 0 10px}
.ph{border-radius:10px;padding:12px;margin-top:8px;border:2px solid transparent;background:#1c1f26;opacity:.55;transition:.2s}
.ph .t{font-weight:900;font-size:15px}.ph .d{font-size:24px;font-weight:800;margin-top:4px;line-height:1.3}
.ph.r .t{color:#ff6b6b}.ph.b .t{color:#7fa8ff}
.ph.now{opacity:1}.ph.r.now{border-color:#ff6b6b;background:#2a1618}.ph.b.now{border-color:#7fa8ff;background:#141c2e}
.ph.solo{opacity:1}
.sh{display:inline-block;font-size:.8em;font-weight:800;padding:0 6px;border-radius:5px;background:#3a3110;color:#f2c200;border:1px solid #6b5a1a;vertical-align:2px}
.clock{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:0 -14px 10px;padding:6px 14px 8px;position:sticky;top:0;z-index:5;background:#0b0c0f;border-bottom:1px solid #22252c}
.ck .lab{font-size:12px;color:#8d95a1;font-weight:700}.ck .tm{font-variant-numeric:tabular-nums;font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.05}
.ck.rt{text-align:right}.ck.rt.r .tm{color:#ff6b6b}.ck.rt.b .tm{color:#7fa8ff}
.pg{grid-column:1/-1;height:8px;border-radius:4px;background:#22252c;overflow:hidden}.pg i{display:block;height:100%;transition:width .2s linear}.pg.r i{background:#ff6b6b}.pg.b i{background:#7fa8ff}
.clock .tm{font-variant-numeric:tabular-nums;font-size:42px;font-weight:900;letter-spacing:-1px}
.clock .left{color:#7fa8ff;font-size:30px;font-weight:900;margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.go{width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-size:18px;font-weight:900;background:#16a34a;color:#fff;margin-top:6px}
.go.stop{background:#3a3f47}
.row2{display:flex;gap:8px;margin-top:8px}.row2 button{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-size:15px;font-weight:800;background:#22252c;color:#eee}
.flash{position:fixed;inset:0;background:#7fa8ff;opacity:0;pointer-events:none;transition:opacity .25s}.flash.on{opacity:.55}
.note{color:#8d95a1;font-size:12.5px;line-height:1.6;margin-top:14px}
.none{color:#8d95a1;padding:20px 4px}
.live{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:#22252c;color:#8d95a1;margin-left:6px}.live.on{background:#12301f;color:#5ee08c}
</style></head><body>
<div id="app"><div class="none">불러오는 중…</div></div>
<div class="flash" id="flash"></div>
<script>
const END=257; // 곡 끝 4:17
const SW=98; // 곡 1:38 (넥서스·QLab 시간으로는 1:42.8)
const COUNTIN=4.83; // 촬영용 mp3 앞 카운트인 — 화면 시계는 넥서스 뮤직과 같은 mp3 시간으로 보여줌
const MANUAL=new URLSearchParams(location.search).has('manual'); // 연동이 안 될 때만 ?manual 로 직접 조작
const PEOPLE=[['윤관','레일 카메라 · T 5번'],['김창훈','레일 밀기 · T 1번 정면'],['박완준','2번 측면'],['문호준','3번 망원'],['최영민','4번 오케스트라'],['전체','모든 카메라 보기']];
let TAKES=[],me=localStorage.getItem('vf-cam-me')||'',cur=+localStorage.getItem('vf-cam-take')||0,t0=null,timer=null,offset=-4.83,flashed=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
 const h=await (await fetch('angles-web.html?v='+Date.now(),{cache:'no-store'})).text();
 const d=new DOMParser().parseFromString(h,'text/html');
 d.querySelectorAll('.row').forEach(r=>{const tk=r.querySelector('.tk');if(!tk)return;let id=tk.querySelector('b')?.textContent.trim(),desc=tk.querySelector('span')?.textContent.trim()||'';
  const cells=[...r.querySelectorAll('.c')].map(c=>{const cn=c.querySelector('.cn'),ln=c.querySelector('.ln');
   const lines=ln?ln.innerHTML.split(/<br\s*\/?>/i).map(x=>{const t=document.createElement('div');t.innerHTML=x;return t.textContent.trim()}):[];
   const red=(lines.find(l=>/^~?1:38/.test(l)&&l.startsWith('~'))||'').replace(/^~1:38\s*/,''),blue=(lines.find(l=>/^1:38~/.test(l))||'').replace(/^1:38~\s*/,'');
   const other=!red&&!blue?(ln?ln.textContent.trim():''):'';
   return {cam:cn?[...cn.childNodes].map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim():'',img:c.querySelector('img')?.getAttribute('src'),red,blue,other}});
  if(!id){const ks=cells.map(c=>c.cam.split(' ')[0]);id=ks[0]+'–'+ks[ks.length-1];desc='창의 앵글 · 인서트 (해당 구간만 · 감독 지시로 나눠 찍기)'}
  TAKES.push({id,desc,cells,shared:!tk.querySelector('b')})});
 if(cur>=TAKES.length)cur=0;render()}
function mine(c){if(me==='전체')return true;const s=c.cam;if(me==='윤관')return /윤관|레일/.test(s)&&!/밀기/.test(s);if(me==='김창훈')return /김창훈|레일/.test(s);return s.includes(me)}
function hlab(t){const s=esc(t);return s.replace(/(^|[^A-Za-z0-9])([A-Z][A-Z0-9\-\/]{1,7}|[1-3]S|OTS|POV)(?![A-Za-z0-9])/g,(m,a,k)=>a+'<span class="sh">'+k+'</span>')}
function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')}
function now(){return t0?(Date.now()-t0)/1000+offset:offset}
function render(){
 const A=$('#app');
 if(!me){A.innerHTML='<h1>🎥 촬영자 화면</h1><div class="sub">「교회를 사랑하는 건」 10/23 · 내 이름을 고르세요</div><div class="who">'+PEOPLE.map(([n,r])=>`<button data-me="${n}">${n}<small>${r}</small></button>`).join('')+'</div><div class="note">· 앵글표 최신 내용을 그대로 불러와요 (바뀌면 새로고침)<br>· 음악이 시작될 때 ▶ 시작을 누르면 1:38에 화면이 파랗게 바뀌어요</div>';return}
 const tk=TAKES[cur];if(!tk){A.innerHTML='<div class="none">앵글표를 못 불러왔어요</div>';return}
 const cs=tk.shared?tk.cells:tk.cells.filter(mine);const t=now();const phase=t<SW?'r':'b';
 A.innerHTML=`<div class="bar"><b>🎥 ${esc(me)}<span class="live ${LIVE.ok?'on':''}" id="liveB">${LIVE.ok?(LIVE.playing?'🔗 음악 연동 · 재생 중':'🔗 음악 연동 · 멈춤'):'🔗 연동 대기'}</span></b><button data-act="who">사람 바꾸기</button></div>
 <div class="clock" id="clock">${clockHtml(t)}</div>
 <div class="tk">${TAKES.map((x,i)=>`<button class="${i===cur?'on':''}" data-tk="${i}">${esc(x.id)}</button>`).join('')}</div>
 <div class="ttl" style="margin:0 2px 8px">${esc(tk.id)} · ${esc(tk.desc)}</div>
 ${cs.length?cs.map(c=>`<div class="card" style="margin-bottom:12px">${c.img?`<img src="${esc(c.img)}" alt="">`:''}<div class="cin"><div class="cam">${hlab(c.cam)}</div>
  ${c.red||c.blue?`<div class="ph r ${phase==='r'?'now':''}"><div class="t">🔴 처음 ~ 1:38 · 남자 보컬 혼자</div><div class="d">${hlab(c.red)||'—'}</div></div>
  <div class="ph b ${phase==='b'?'now':''}"><div class="t">🔵 1:38 ~ 끝 · 다 같이</div><div class="d">${hlab(c.blue)||'—'}</div></div>`:`<div class="ph solo"><div class="d">${hlab(c.other)}</div></div>`}
 </div></div>`).join(''):'<div class="none">이 테이크에는 내 카메라 지시가 없어요 (대기 또는 다른 테이크 준비)</div>'}
 ${MANUAL?`<button class="go ${t0?'stop':''}" data-act="go">${t0?'■ 멈춤':'▶ 시작 (음악 시작할 때)'}</button>
 <div class="row2"><button data-act="back">−5초</button><button data-act="fwd">+5초</button><button data-act="reset">처음으로</button></div>`:''}
 <div class="row2"><button data-act="next">다음 테이크 ›</button></div>
 <div class="note">· 시계는 연출석 넥서스 뮤직과 같은 시간이에요 (초록 🔗 표시)<br>· 곡의 1:38(넥서스 1:42.8)이 되면 화면이 한 번 반짝이고 🔵로 바뀌어요</div>`}
function clockHtml(t){const red=t<SW,a=red?0:SW,b=red?SW:END,rem=Math.max(0,b-t),pct=Math.min(100,Math.max(0,(t-a)/(b-a)*100));
 const end=t>=END;return `<div class="ck"><div class="lab">흘러간 시간</div><div class="tm">${fmt(t+COUNTIN)}</div></div>
 <div class="ck rt ${red?'r':'b'}"><div class="lab">${end?'곡 끝':(red?'🔴 지금 앵글':'🔵 지금 앵글')} 남은 시간</div><div class="tm">${end?'0:00':fmt(rem)}</div></div>
 <div class="pg ${red?'r':'b'}"><i style="width:${end?100:pct}%"></i></div>`}
function tick(){const t=now();const c=$('#clock');if(c)c.innerHTML=clockHtml(t);
 const r=document.querySelector('.ph.r'),b=document.querySelector('.ph.b');if(r){r.classList.toggle('now',t<SW);b.classList.toggle('now',t>=SW)}
 if(t>=SW&&!flashed){flashed=true;const f=$('#flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),450);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
 if(t<SW)flashed=false}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.me){me=b.dataset.me;localStorage.setItem('vf-cam-me',me);render();return}
 if(b.dataset.tk){cur=+b.dataset.tk;localStorage.setItem('vf-cam-take',cur);if(!LIVE.playing)stop(true);render();scrollTo(0,0);return}
 const a=b.dataset.act;
 if(a==='who'){me='';localStorage.removeItem('vf-cam-me');stop(true);render()}
 if(a==='go'){if(t0)stop(false);else{t0=Date.now();timer=setInterval(tick,200);requestWake()}render()}
 if(a==='back'){shift(-5)}if(a==='fwd'){shift(5)}
 if(a==='reset'){stop(true);render()}
 if(a==='next'){cur=Math.min(TAKES.length-1,cur+1);localStorage.setItem('vf-cam-take',cur);if(!LIVE.playing)stop(true);render();scrollTo(0,0)}});
function shift(d){if(t0){t0-=d*1000}else offset=Math.max(0,offset+d);tick()}
function stop(reset){if(t0){offset=now();t0=null}clearInterval(timer);timer=null;if(reset){offset=-COUNTIN;flashed=false}}
let wl=null;async function requestWake(){try{wl=await navigator.wakeLock?.request('screen')}catch(e){}}
const LIVE={ok:false,playing:false};
function liveBadge(){const b=document.getElementById('liveB');if(!b)return;b.className='live'+(LIVE.ok?' on':'');b.textContent=LIVE.ok?(LIVE.playing?'🔗 음악 연동 · 재생 중':'🔗 음악 연동 · 멈춤'):'🔗 연동 대기'}
try{firebase.initializeApp({apiKey:"AIzaSyAVJ6ZZ6L-3RtgoYe2dDSn_lCHXv3CeBGc",projectId:"vinfilm-studio-app"});
 firebase.firestore().doc('live/mv1023').onSnapshot(sn=>{const d=sn.data();if(!d)return;LIVE.ok=true;LIVE.playing=!!d.playing;
  const song=d.t-COUNTIN;
  if(d.playing){t0=d.at-song*1000;offset=0;if(!timer)timer=setInterval(tick,200);requestWake()}
  else{clearInterval(timer);timer=null;t0=null;offset=song}
  flashed=now()>=SW;const g=document.querySelector('[data-act=go]');if(g){g.textContent=t0?'■ 멈춤':'▶ 시작 (음악 시작할 때)';g.classList.toggle('stop',!!t0)}
  liveBadge();tick()},()=>{})}catch(e){}
load().catch(()=>{$('#app').innerHTML='<div class="none">앵글표를 못 불러왔어요. 인터넷 연결을 확인해 주세요.</div>'});
</script></body></html>
