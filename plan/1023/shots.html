<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ON SET · 구간별 샷</title>
<script src="shots-data.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--m:'SF Mono',ui-monospace,Menlo,monospace;--line:#232323}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#e6e6e6;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
body{padding:14px 14px 40px}
h1{font:600 30px Oswald,var(--m);letter-spacing:2px;margin:0;color:#fff}.sub{color:#888;font-size:13px;margin:4px 0 14px}
.sub a{color:#7fa8ff}
.tbl{display:grid;grid-template-columns:150px repeat(5,minmax(0,1fr));gap:4px;min-width:1100px}
.wrap{overflow-x:auto}
.hd{background:#0d0d0d;border:1px solid var(--line);padding:8px 10px;position:sticky;top:0;z-index:2}
.hd b{display:block;font:700 14px var(--m);color:#ffd60a}.hd span{display:block;font-size:13px;color:#fff;margin-top:2px}.hd i{display:block;font-style:normal;font-size:11.5px;color:#888;margin-top:2px}
.sec{background:#0a0a0a;border:1px solid var(--line);border-left:4px solid #ff3b30;padding:10px}
.sec b{display:block;font-size:18px;color:#fff}.sec .t{font:500 22px Oswald,var(--m);color:#fff;margin-top:4px}.sec .t small{font-size:13px;color:#777;display:block;font-family:var(--m)}.sec i{display:block;font-style:normal;font-size:12.5px;color:#aaa;margin-top:6px;line-height:1.35}
.cell{position:relative;background:#111;border:1px solid var(--line);min-height:150px;overflow:hidden}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.cell::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 85%)}
.cell span{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;font-size:16px;font-weight:800;color:#fff;line-height:1.25;text-shadow:0 2px 8px #000;word-break:keep-all}
.k{display:inline-block;font:700 .78em var(--m);border:1px solid #6b5a1a;color:#ffd60a;background:#1a1300;padding:0 4px;margin:0 2px}
.c1 .sec{border-left-color:#ff3b30}
</style></head><body>
<h1>SHOT PLAN · 구간별</h1>
<div class="sub">「교회를 사랑하는 건」 10/23 · 삼각대 풀 테이크 기준 · 시간은 곡 시간 (넥서스 +4.8초) · <a href="v1/angles-web.html">이전 앵글표 (1:38 전/후 버전)</a></div>
<div class="wrap"><div class="tbl" id="t"></div></div>
<script>
const D=window.SHOTS,esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const tag=t=>esc(t).replace(/(^|[^A-Za-z0-9])(WS|FS|MS|CU|CS|MFS|TWO|HAND|FULL|OTS)(?![A-Za-z0-9])/g,(m,a,k)=>a+'<span class="k">'+k+'</span>');
let h='<div class="hd"><b>구간</b><span>곡 시간</span></div>'+D.cams.map(c=>`<div class="hd"><b>CAM ${c.n}</b><span>${esc(c.op)}</span><i>${esc(c.lens)} · ${esc(c.pos)}</i></div>`).join('');
for(const s of D.secs){h+=`<div class="sec"><b>${esc(s.name)}</b><div class="t">${mm(s.a)} – ${mm(s.b)}<small>넥서스 ${mm(s.a+D.countIn)}</small></div><i>${esc(s.mood)}</i></div>`+s.s.map(([t,img])=>`<div class="cell"><img loading="lazy" src="angles/ref/${img}.jpg"><span>${tag(t)}</span></div>`).join('')}
document.getElementById('t').innerHTML=h;
</script></body></html>
