<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>촬영자 화면 · 구간별</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="shots-data.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--m:'SF Mono',ui-monospace,Menlo,monospace;--n:Oswald,var(--m);--red:#ff3b30;--blue:#0a84ff;--grn:#30d158;--ylw:#ffd60a;--line:#232323}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#e6e6e6;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding:calc(8px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
.lb{font:600 10.5px var(--m);letter-spacing:2px;color:#777;text-transform:uppercase}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.bar b{font:700 13px var(--m);letter-spacing:2px;color:#fff;margin-right:auto}
.bar button,.pv button{border:1px solid #333;background:#0a0a0a;color:#bbb;border-radius:0;padding:6px 10px;font:600 12px var(--m)}
.live{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--m);color:#777;margin-left:8px}.live i{width:8px;height:8px;border-radius:50%;background:#444}.live.on{color:var(--grn)}.live.on i{background:var(--grn);box-shadow:0 0 10px var(--grn)}.live.pause{color:var(--ylw)}.live.pause i{background:var(--ylw);box-shadow:none}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.who button{border:1px solid var(--line);background:#0a0a0a;color:#fff;padding:16px 12px;font:inherit;font-size:17px;font-weight:800;text-align:left;border-radius:0}.who button small{display:block;font:500 11px var(--m);color:#777;margin-top:4px}
.clock{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:end;background:#0a0a0a;border:1px solid var(--line);padding:10px 14px 12px;margin-bottom:8px}
.ck .tm{font:500 54px var(--n);color:#fff;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}.ck.rt{text-align:right}.ck.rt .tm{color:var(--red)}
.cur .nm{font-size:20px;font-weight:800;color:#fff;margin-top:3px}.cur .md{font-size:13px;color:#999;margin-top:2px}
.tl{grid-column:1/-1;display:flex;gap:2px;margin-top:4px}.tl span{flex:1;height:22px;background:#161616;position:relative;overflow:hidden;font:600 9.5px var(--m);color:#666;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.tl span.done{background:#2a1110;color:#7a3a36}.tl span.on{background:#2a1110;color:#fff}.tl span.on i{position:absolute;left:0;top:0;bottom:0;background:var(--red);z-index:0}.tl span em{position:relative;z-index:1;font-style:normal}
.pv{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px}.pv button.on{background:var(--ylw);color:#000;border-color:var(--ylw)}
.cards{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:900px){.cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.cards.one{grid-template-columns:minmax(0,560px)}}
.card{position:relative;border:3px solid var(--red);background:#0a0a0a;overflow:hidden;min-height:260px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.78) 60%,#000 95%)}
.card .tag{position:absolute;top:8px;left:8px;z-index:2;font:700 12px var(--m);background:var(--red);color:#000;padding:3px 7px}
.card .nmw{position:absolute;top:8px;right:8px;z-index:2;font:600 12px var(--m);background:#000c;color:#fff;padding:3px 7px}
.card .in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px}
.card .k2{font:700 11.5px var(--m);letter-spacing:1px;color:var(--red)}
.card .d{font-size:clamp(26px,4.4vw,40px);font-weight:900;line-height:1.15;color:#fff;text-shadow:0 2px 12px #000;word-break:keep-all;margin-top:3px}
.cards:not(.one) .card .d{font-size:22px}
.card .lens{font:600 11.5px var(--m);color:#aaa;margin-top:6px}
.card .nx{font-size:14px;color:#aaa;margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.18);word-break:keep-all}.card .nx b{font:700 11px var(--m);color:var(--blue);margin-right:6px}
.k{display:inline-block;font:700 .74em var(--m);border:1px solid #6b5a1a;color:var(--ylw);background:#1a1300;padding:0 4px;margin:0 2px;vertical-align:2px;text-shadow:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}.flash.on{opacity:.4}
.note{color:#666;font-size:12px;margin-top:10px}.note a{color:#7fa8ff}
/* 폰 가로: 왼쪽 샷 · 오른쪽 시간 */
@media (orientation:landscape) and (max-height:520px){
 body{padding:4px max(8px,calc(env(safe-area-inset-right)*.45)) 4px max(8px,calc(env(safe-area-inset-left)*.45))}
 #app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:10px}
 #app>*{grid-column:1;min-width:0}#app>.bar{grid-column:1/-1;margin-bottom:4px}
 #app>.clock{grid-column:2;grid-row:2/span 4;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;height:calc(100vh - 44px);margin:0;text-align:center}
 .clock .ck{text-align:center!important}.clock .ck .tm{font-size:clamp(40px,7vw,64px)}.clock .ck.rt .tm{font-size:clamp(80px,16vw,140px);line-height:.95}.clock .tl{width:100%;order:4}
 #app>.cards{grid-row:2}.card{height:calc(100vh - 50px);min-height:220px}.pv,.note{display:none}
}
@media (max-width:520px) and (orientation:portrait){.card{min-height:58vh}}
</style></head><body>
<div id="app"></div><div class="flash" id="flash"></div>
<script>
const D=window.SHOTS,Q=new URLSearchParams(location.search),ALL=Q.has('all');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag=t=>esc(t).replace(/(^|[^A-Za-z0-9])(WS|FS|MS|CU|CS|MFS|TWO|HAND|FULL|OTS)(?![A-Za-z0-9])/g,(m,a,k)=>a+'<span class="k">'+k+'</span>');
const mm=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
const PEOPLE=D.cams.map(c=>[c.op,`CAM ${c.n} · ${c.lens}`]);
let me=ALL?(localStorage.getItem('vf-cam2-pv')||'전체'):(localStorage.getItem('vf-cam2-me')||''),t0=null,off=-D.countIn,LIVE={ok:false,playing:false},LAST='';
const now=()=>t0?(Date.now()-t0)/1000+off:off; // 곡 시간
const secAt=t=>D.secs.findIndex(s=>t>=s.a&&t<s.b);
function render(){
 const A=$('#app'),t=now();
 if(!me){A.innerHTML='<div class="bar"><b>CAMERA CUE · 구간별</b></div><div class="who">'+PEOPLE.map(([n,r])=>`<button data-me="${n}">${n}<small>${r}</small></button>`).join('')+'</div><div class="note">· 곡이 흐르면 구간마다 지시가 자동으로 바뀌어요 · <a href="cam.html">이전 화면(1:38 전/후)</a></div>';return}
 const i=secAt(t),si=i<0?(t<0?0:D.secs.length-1):i,S=D.secs[si],N=D.secs[si+1];
 const cams=me==='전체'?D.cams:D.cams.filter(c=>c.op===me);
 LAST=si+'|'+me;
 A.innerHTML=`<div class="bar"><b>CAM · ${esc(me==='전체'?'ALL':me)}<span class="live" id="liveB"></span></b>${ALL?'':'<button data-act="who">사람 바꾸기</button>'}</div>
 <div class="clock" id="clock"></div>
 ${ALL?`<div class="pv">${['전체',...D.cams.map(c=>c.op)].map(n=>`<button class="${me===n?'on':''}" data-pv="${n}">${n==='전체'?'ALL':n}</button>`).join('')}</div>`:''}
 <div class="cards ${cams.length===1?'one':''}">${cams.map(c=>{const [sh,img]=S.s[c.n-1],nx=N?N.s[c.n-1][0]:'';
  return `<div class="card"><img src="angles/ref/${img}.jpg" alt=""><span class="tag">CAM ${c.n}</span><span class="nmw">${esc(c.op)}</span>
  <div class="in"><div class="k2">● ${esc(S.name)} · ${mm(S.a)}~${mm(S.b)}</div><div class="d">${tag(sh)}</div><div class="lens">${esc(c.lens)}</div>
  ${N?`<div class="nx"><b>NEXT ${mm(N.a)} ${esc(N.name)} ▸</b>${tag(nx)}</div>`:''}</div></div>`}).join('')}</div>
 ${ALL?'<div class="note">· 구간별 샷 · <a href="shots.html" target="_blank">전체 샷 표</a> · <a href="cam.html?all=1">이전 화면(1:38 전/후)</a></div>':''}`;
 tick();liveBadge()}
function tick(){const t=now(),c=$('#clock');if(!c)return;const i=secAt(t),si=i<0?(t<0?0:D.secs.length-1):i,S=D.secs[si];
 if(me&&LAST&&LAST!==si+'|'+me){const f=$('#flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),350);render();return}
 const rem=t<0?-t:S.b-t;
 c.innerHTML=`<div class="ck"><div class="lb">Elapsed · TC</div><div class="tm">${mm(t+D.countIn)}</div></div>
 <div class="cur"><div class="lb">지금 구간</div><div class="nm">${esc(S.name)}</div><div class="md">${esc(S.mood)}</div></div>
 <div class="ck rt"><div class="lb">${t<0?'시작까지':'다음 구간까지'}</div><div class="tm">${mm(rem)}</div></div>
 <div class="tl">${D.secs.map((s,j)=>`<span class="${j<si?'done':(j===si?'on':'')}">${j===si?`<i style="width:${Math.min(100,Math.max(0,(t-s.a)/(s.b-s.a)*100))}%"></i>`:''}<em>${esc(s.name.replace(' · 클라이맥스',''))}</em></span>`).join('')}</div>`}
function liveBadge(){const b=$('#liveB');if(!b)return;b.className='live'+(LIVE.ok?' on':'')+(LIVE.ok&&!LIVE.playing?' pause':'');b.innerHTML='<i></i>'+(LIVE.ok?(LIVE.playing?'LINKED · PLAYING':'LINKED · PAUSED'):'WAITING LINK')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.me){me=b.dataset.me;localStorage.setItem('vf-cam2-me',me);render()}
 if(b.dataset.pv){me=b.dataset.pv;try{localStorage.setItem('vf-cam2-pv',me)}catch(e){}render()}
 if(b.dataset.act==='who'){me='';localStorage.removeItem('vf-cam2-me');render()}});
let timer=setInterval(tick,250);
try{firebase.initializeApp({apiKey:"AIzaSyAVJ6ZZ6L-3RtgoYe2dDSn_lCHXv3CeBGc",projectId:"vinfilm-studio-app"});
 firebase.firestore().doc('live/mv1023').onSnapshot(sn=>{const d=sn.data();if(!d)return;LIVE.ok=true;LIVE.playing=!!d.playing;const song=d.t-D.countIn;
  if(d.playing){t0=d.at-song*1000;off=0;try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}}else{t0=null;off=song}
  liveBadge();tick()},()=>{})}catch(e){}
render();
// 아래로 당겨서 새로고침 · 새 버전 자동 반영
(function(){let y0=null,d=0;addEventListener('touchstart',e=>{y0=scrollY<=0&&e.touches.length===1?e.touches[0].clientY:null;d=0},{passive:true});addEventListener('touchmove',e=>{if(y0!==null)d=e.touches[0].clientY-y0},{passive:true});addEventListener('touchend',()=>{if(y0!==null&&d>110)location.reload();y0=null},{passive:true});
 let first=null;async function chk(){try{const x=await (await fetch('cam2.html?_='+Date.now(),{cache:'no-store'})).text();const h=x.length+':'+x.slice(-300);if(first===null){first=h;return}if(h!==first&&!LIVE.playing)location.reload()}catch(e){}}chk();setInterval(chk,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});})();
</script></body></html>
