<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes">
<title>촬영 앵글표</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:10px;align-items:center;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:rgba(17,17,17,.92)}
.top a{padding:6px 10px!important;font-size:13px!important}
.top a,.top button{border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;font-weight:800;background:#2a2a2a;color:#ddd;text-decoration:none}
.top button.on{background:#fff;color:#111}.top .pg{margin-left:auto;color:#aaa;font-size:14px;font-weight:700}
.deck{position:fixed;inset:0;top:calc(38px + env(safe-area-inset-top));display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.pg-wrap{flex:0 0 100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;overflow:auto;padding:2px 2px calc(16px + env(safe-area-inset-bottom))}
.pg-wrap img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:4px;touch-action:pan-x pinch-zoom}
.dots{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:5}
.dots i{width:9px;height:9px;border-radius:50%;background:#555}.dots i.on{background:#fff}
.nav{position:fixed;top:50%;z-index:4;width:44px;height:80px;margin-top:-40px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:28px;border-radius:8px}
.nav.l{left:4px}.nav.r{right:4px}
@media (hover:none){.nav{display:none}}
</style></head><body>
<div class="top"><a href="./">‹ 목록</a><b style="color:#fff;font-size:15px">촬영 앵글표</b><span class="pg" id="pg"></span></div>
<div class="deck" id="deck"></div>
<button class="nav l" id="prev">‹</button><button class="nav r" id="next">›</button>
<div class="dots" id="dots"></div>
<script>
const SETS={a:['a-1','a-2','a-3','a-4']};
const deck=document.getElementById('deck');let cur='a';
function load(k){cur=k;document.querySelectorAll('[data-set]').forEach(b=>b.classList.toggle('on',b.dataset.set===k));
 deck.innerHTML=SETS[k].map(n=>`<div class="pg-wrap"><img src="angles/${n}.jpg?v=3" alt=""></div>`).join('');deck.scrollLeft=0;upd()}
function idx(){return Math.round(deck.scrollLeft/deck.clientWidth)}
function upd(){const n=SETS[cur].length,i=idx();document.getElementById('pg').textContent=`${i+1} / ${n}`;document.getElementById('dots').innerHTML=SETS[cur].map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}
function go(d){deck.scrollTo({left:(idx()+d)*deck.clientWidth,behavior:'smooth'})}
deck.addEventListener('scroll',()=>requestAnimationFrame(upd));
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>load(b.dataset.set));
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
addEventListener('resize',()=>{const i=idx();deck.scrollLeft=i*deck.clientWidth});
if(self!==top){document.querySelector('.top').style.display='none';document.getElementById('deck').style.top='0'}
load('a');
</script></body></html>
