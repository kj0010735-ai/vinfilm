<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>촬영 진행 시안</title>
<style>
*{box-sizing:border-box}body{margin:0}
.ab{display:flex;align-items:center}
/* ---------- A. 방송 컨트롤룸 (멀티뷰) ---------- */
.A{background:#000;color:#e6e6e6;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;min-height:100vh;padding:18px 22px}
.A .top{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:end;border:1px solid #2a2a2a;padding:14px 18px;background:#0a0a0a}
.A .tc{font-family:'SF Mono',Menlo,monospace;font-size:64px;font-weight:600;letter-spacing:2px;color:#fff;line-height:1}
.A .lb{font-family:'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:#777;text-transform:uppercase;margin-bottom:6px}
.A .rem{font-family:'SF Mono',Menlo,monospace;font-size:64px;font-weight:600;color:#ff3b30;line-height:1;text-align:right}
.A .mid{align-self:center}.A .bar{height:6px;background:#1c1c1c;margin-top:12px}.A .bar i{display:block;height:100%;width:62%;background:#ff3b30}
.A .seg{display:flex;gap:2px;margin-top:10px}.A .seg span{flex:1;height:18px;background:#1c1c1c;font:10px 'SF Mono',Menlo,monospace;color:#666;display:flex;align-items:center;justify-content:center}.A .seg span.on{background:#ff3b30;color:#000}.A .seg span.nx{background:#0a84ff33;color:#0a84ff}
.A .live{font:12px 'SF Mono',Menlo,monospace;color:#30d158;letter-spacing:1px}.A .live b{display:inline-block;width:9px;height:9px;border-radius:50%;background:#30d158;margin-right:6px;box-shadow:0 0 10px #30d158}
.A .takes{display:flex;gap:2px;margin:14px 0}.A .takes span{font:600 13px 'SF Mono',Menlo,monospace;padding:8px 14px;background:#111;color:#888;border:1px solid #222}.A .takes span.on{background:#fff;color:#000}
.A .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.A .cell{background:#0a0a0a;border:2px solid #222;position:relative}.A .cell.tally{border-color:#ff3b30}
.A .cell img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;filter:grayscale(.2)}
.A .tag{position:absolute;top:8px;left:8px;font:700 12px 'SF Mono',Menlo,monospace;background:#ff3b30;color:#000;padding:3px 7px}
.A .nm{position:absolute;top:8px;right:8px;font:12px 'SF Mono',Menlo,monospace;background:#000c;padding:3px 7px}
.A .in{padding:12px}.A .now{font-size:21px;font-weight:800}.A .nxt{margin-top:10px;font-size:13px;color:#777}.A .nxt b{color:#0a84ff;font-family:'SF Mono',Menlo,monospace}
.A .k{font:700 .78em 'SF Mono',Menlo,monospace;border:1px solid #555;padding:0 4px;margin-left:4px;color:#ffd60a}

/* ---------- B. 시네마 슬레이트 (에디토리얼) ---------- */
.B{background:#f3f0ea;color:#141414;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;min-height:100vh;padding:28px 36px}
.B .hd{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid #141414;padding-bottom:10px}
.B .hd h1{font-size:15px;letter-spacing:3px;margin:0;font-weight:800}.B .hd span{font-size:13px;color:#6b665e}.B .hd .lv{margin-left:auto;font-size:12px;letter-spacing:2px;color:#1d7a46;font-weight:800}
.B .clk{display:grid;grid-template-columns:1fr 1fr 2fr;gap:0;border-bottom:1px solid #c9c2b6}
.B .clk>div{padding:18px 0 16px}.B .clk>div+div{border-left:1px solid #c9c2b6;padding-left:24px}
.B .l{font-size:11px;letter-spacing:2.5px;color:#6b665e;font-weight:700}
.B .v{font-size:58px;font-weight:300;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1.05}
.B .v.red{color:#c8361d;font-weight:500}
.B .tl{position:relative;height:10px;background:#e2ddd3;margin-top:18px}.B .tl i{position:absolute;left:0;top:0;bottom:0;width:31%;background:#141414}.B .tl em{position:absolute;left:38%;top:-6px;bottom:-6px;width:2px;background:#c8361d}.B .tl u{position:absolute;left:38%;top:-22px;font-size:11px;color:#c8361d;text-decoration:none;font-weight:700;transform:translateX(-50%)}
.B .tks{display:flex;gap:22px;margin:18px 0 20px;font-size:14px;color:#8b857b;font-weight:700}.B .tks span.on{color:#141414;border-bottom:3px solid #141414;padding-bottom:4px}
.B .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.B .cell img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.B .no{font-size:40px;font-weight:200;line-height:1;margin:12px 0 2px}.B .who{font-size:13px;letter-spacing:1px;color:#6b665e;font-weight:700}
.B .ph{border-top:1px solid #141414;margin-top:12px;padding-top:10px}.B .ph .t{font-size:11px;letter-spacing:2px;font-weight:800;color:#c8361d}.B .ph .d{font-size:19px;font-weight:700;margin-top:4px}
.B .ph.off{opacity:.38;border-top-color:#c9c2b6}.B .ph.off .t{color:#141414}
.B .k{font-size:.72em;font-weight:800;letter-spacing:1px;border:1.5px solid currentColor;padding:0 4px;margin-left:5px;vertical-align:2px}

/* ---------- C. 프로 툴 (그래파이트) ---------- */
.C{background:#17181b;color:#e8e9ec;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.C .side{background:#1e1f23;border-right:1px solid #2b2d33;padding:18px 12px}
.C .side h3{font-size:11px;letter-spacing:1.5px;color:#7c818c;margin:16px 8px 8px;font-weight:700}
.C .side a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:7px;font-size:14px;color:#b7bbc4;font-weight:600}.C .side a.on{background:#2f6fee;color:#fff}.C .side a small{color:inherit;opacity:.6;font-weight:500}
.C .main{padding:18px 22px}
.C .tbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.C .box{background:#1e1f23;border:1px solid #2b2d33;border-radius:12px;padding:14px 16px}
.C .l{font-size:12px;color:#7c818c;font-weight:600}.C .v{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.C .v.r{color:#ff6b5e}.C .st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#4ade80}.C .st i{width:8px;height:8px;border-radius:50%;background:#4ade80}
.C .wave{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:8px}.C .wave i{flex:1;background:#3a3d45;border-radius:1px}.C .wave i.p{background:#2f6fee}.C .wave i.m{background:#ff6b5e}
.C .hh{display:flex;align-items:center;gap:10px;margin:18px 0 12px}.C .hh b{font-size:18px}.C .hh span{color:#7c818c;font-size:13px}
.C .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.C .cell{background:#1e1f23;border:1px solid #2b2d33;border-radius:12px;overflow:hidden}
.C .cell img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.C .in{padding:12px 14px}.C .cm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.C .cm em{font-style:normal;background:#2b2d33;border-radius:5px;padding:2px 7px;font-size:12px}
.C .row{display:grid;grid-template-columns:62px 1fr;gap:8px;margin-top:10px;align-items:center;padding:8px 10px;border-radius:8px;background:#232429}
.C .row.on{background:#3a1d1b;outline:1px solid #ff6b5e66}.C .row .t{font-size:12px;color:#7c818c;font-variant-numeric:tabular-nums}.C .row.on .t{color:#ff6b5e;font-weight:700}
.C .row .d{font-size:15px;font-weight:600}.C .row:not(.on) .d{color:#9aa0ab}
.C .k{font-size:.75em;font-weight:700;background:#2f6fee33;color:#8fb0ff;border-radius:4px;padding:1px 5px;margin-left:4px}
</style></head><body>
<div id="v"></div>
<script>
const V=new URLSearchParams(location.search).get('v')||'A';
const D=[['🛤 레일','윤관 · 김창훈','angles/ref/v10-0025.jpg','남자 보컬 <k>MS</k> → <k>FULL</k>','밴드 전체 + 빔'],['2','박완준 · 측면','angles/ref/v10-0073.jpg','남자 보컬 측면 실루엣','멤버 <k>MS</k>'],['3','문호준 · 망원','angles/ref/v12-0013.jpg','남자 보컬 <k>CS</k>','남자 보컬 <k>CS</k> (곡 전체)'],['4','최영민 · 뒤','angles/ref/v03-0035.jpg','남자 보컬 뒷모습 <k>OTS</k>','오케스트라 <k>FULL</k>']];
const K=s=>s.replace(/<k>(.*?)<\/k>/g,'<span class="k">$1</span>');
const T=['R1','R2','R3','R4','R5','R6','T1','T2','T3','T4','T5','C1–C4','C5–C8','C9–END'];
let h='';
if(V==='A'){h=`<div class="A"><div class="top"><div><div class="lb">Elapsed · TC</div><div class="tc">00:01:06</div></div>
<div class="mid"><div class="ab" style="justify-content:space-between"><span class="live"><b></b>LINKED · NEXUS MUSIC</span><span class="lb" style="margin:0">R1 · FRONT RAIL · DOLLY OUT</span></div><div class="bar"><i></i></div>
<div class="seg"><span class="on">● SOLO 0:00–1:38</span><span class="nx">● ALL 1:38–4:17</span></div></div>
<div><div class="lb" style="text-align:right">Next change in</div><div class="rem">00:36</div></div></div>
<div class="takes">${T.map((t,i)=>`<span class="${i?'':'on'}">${t}</span>`).join('')}</div>
<div class="grid">${D.map(d=>`<div class="cell tally"><img src="${d[2]}"><span class="tag">CAM ${d[0].replace('🛤 레일','RAIL')}</span><span class="nm">${d[1]}</span><div class="in"><div class="now">${K(d[3])}</div><div class="nxt"><b>NEXT 1:38 ▸</b> ${K(d[4])}</div></div></div>`).join('')}</div></div>`}
if(V==='B'){h=`<div class="B"><div class="hd"><h1>BAND SHOOT — 교회를 사랑하는 건</h1><span>2026.10.23 · 톤앤무드 스튜디오</span><span class="lv">● 음악 연동</span></div>
<div class="clk"><div><div class="l">흘러간 시간</div><div class="v">1:06</div></div><div><div class="l">지금 앵글 남은 시간</div><div class="v red">0:36</div></div>
<div><div class="l">R1 · 정면 레일 · 앞→뒤 (달리 아웃)</div><div class="tl"><i></i><em></em><u>1:38 전환</u></div></div></div>
<div class="tks">${T.map((t,i)=>`<span class="${i?'':'on'}">${t}</span>`).join('')}</div>
<div class="grid">${D.map(d=>`<div class="cell"><img src="${d[2]}"><div class="no">${d[0].replace('🛤 레일','R')}</div><div class="who">${d[1]}</div>
<div class="ph"><div class="t">지금 · ~1:38 남자 보컬 혼자</div><div class="d">${K(d[3])}</div></div><div class="ph off"><div class="t">다음 · 1:38~ 다 같이</div><div class="d">${K(d[4])}</div></div></div>`).join('')}</div></div>`}
if(V==='C'){const w=Array.from({length:90},(_,i)=>`<i class="${i<23?'p':''}${i===34?' m':''}" style="height:${20+Math.round(Math.abs(Math.sin(i*.7)*60+Math.cos(i*.23)*25))}%"></i>`).join('');
h=`<div class="C"><div class="side"><div style="font-weight:800;font-size:15px;padding:0 8px">🎥 촬영 진행</div><h3>레일 테이크</h3>${['R1','R2','R3','R4','R5','R6'].map((t,i)=>`<a class="${i?'':'on'}">${t}<small>${['달리 아웃','달리 인','좌→우','우→좌','아크','클라이맥스'][i]}</small></a>`).join('')}<h3>삼각대 테이크</h3>${['T1','T2','T3','T4','T5'].map(t=>`<a>${t}<small>${{T1:'전체',T2:'보컬',T3:'악기 HAND',T4:'리듬·관악',T5:'리액션'}[t]}</small></a>`).join('')}<h3>창의 앵글</h3><a>C1–C10 · 인서트</a></div>
<div class="main"><div class="tbar"><div class="box"><div class="l">흘러간 시간</div><div class="v">1:06</div><span class="st"><i></i>넥서스 뮤직 연동</span></div><div class="box"><div class="l">지금 앵글 남은 시간</div><div class="v r">0:36</div><div class="l">1:38에 다 같이 부르는 구간으로 전환</div></div><div class="box"><div class="l">곡 진행</div><div class="wave">${w}</div></div></div>
<div class="hh"><b>R1 · 정면 레일 달리 아웃</b><span>레일 = 윤관(카메라) + 김창훈(밀기)</span></div>
<div class="grid">${D.map(d=>`<div class="cell"><img src="${d[2]}"><div class="in"><div class="cm"><em>${d[0].replace('🛤 레일','RAIL')}</em>${d[1]}</div><div class="row on"><div class="t">~1:38</div><div class="d">${K(d[3])}</div></div><div class="row"><div class="t">1:38~</div><div class="d">${K(d[4])}</div></div></div></div>`).join('')}</div></div></div>`}
document.getElementById('v').innerHTML=h;
</script></body></html>
