<script>
/* 앱처럼 쓰는 화면이라 손가락 확대(핀치 줌)를 막는다 — 아이폰 Safari는 viewport만으로는 안 막혀서 제스처 이벤트도 막음 */
(function () {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>

<style>
  /* 페이퍼로지(Paperozi) — 눈누(noonnu.cc) 배포 상업용 무료 폰트, OFL 라이선스.

     알맞은 두께가 자동으로 선택되게 함(Anton처럼 별도 이름을 신경 쓸 필요 없음). */
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2'); font-weight: 100; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2'); font-weight: 200; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: swap; }
  @font-face { font-family: 'Paperozi'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }
  :root {
    --sf-bg: #f2f4f8; --sf-card: #ffffff; --sf-border: #e5e8f0;
    --sf-navy: #142a4d; --sf-navy-text: #ffffff;
    --sf-blue: #2f6fee; --sf-blue-soft: rgba(47,111,238,0.09);
    --sf-text: #12161f; --sf-text-dim: #667085; --sf-text-faint: #9aa2b1;
    --sf-green: #1a9c53; --sf-green-soft: rgba(26,156,83,0.12);
    --sf-amber: #c8790a; --sf-amber-soft: rgba(200,121,10,0.13);
    --sf-red: #d33d3d; --sf-red-soft: rgba(211,61,61,0.1);
    --sf-gray-soft: rgba(102,112,133,0.1);
    --font-body: 'Paperozi', 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--sf-bg); }
  body { color: var(--sf-text); font-family: var(--font-body); }
  #root { min-height: 100vh; }

  .sf-shell { max-width: 1180px; margin: 0 auto; padding: 22px 24px 70px; }
  .sf-topline { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom: 14px; }
  .sf-logo { height:38px; width:auto; border-radius:5px; display:block; margin-right:auto; }
  .sf-login-logo { width:132px; height:auto; border-radius:6px; display:block; margin:0 auto 18px; }
  .sf-logout { background:none; border:1px solid var(--sf-border); color: var(--sf-text-dim); border-radius:999px; padding:6px 14px; font-family: var(--font-body); font-size:12px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  .sf-logout:hover { background: #eef0f5; }

  .sf-header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom: 22px; flex-wrap: wrap; }

  .sf-month-input:focus { border-color: var(--sf-blue); }
  .sf-btn-primary { background: var(--sf-blue); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-family: var(--font-body); font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; }

  .sf-summary-cards { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; margin-bottom: 22px; }
  .sf-card { background: var(--sf-card); border:1px solid var(--sf-border); border-radius:14px; }

  .sf-filing-pad > p { font-size:12.5px; color: var(--sf-text-faint); margin:0 0 18px; }
  .sf-filing-row { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--sf-border); }
  .sf-filing-row:first-of-type { border-top:none; }
  .sf-filing-row-title { font-weight:700; font-size:13.5px; }
  .sf-filing-row-sub { font-size:12px; color: var(--sf-text-faint); margin-top:4px; }
  .sf-filing-row-steps { font-size:12px; color: var(--sf-text-dim); margin-top:4px; }
  .sf-note { font-size:12.5px; color: var(--sf-text-faint); line-height:1.7; margin: 10px 0 0; }
  .sf-filing-link { display:inline-block; margin-top:14px; color: var(--sf-blue); font-size:13px; font-weight:700; text-decoration:none; }

  /* 디지털 월세 탭 */

  .sf-subs-head p { font-size:13.5px; color: var(--sf-text-dim); margin:0; }
  .sf-rate-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background: var(--sf-card); border:1px solid var(--sf-border); border-radius:10px; padding:10px 16px; margin-bottom: 18px; font-size: 13px; color: var(--sf-text-dim); }
  .sf-rate-bar b { color: var(--sf-text); font-family: var(--font-body); font-weight:700; }
  .sf-rate-edit { margin-left: auto; background:none; border:none; color: var(--sf-blue); cursor:pointer; font-family: var(--font-body); font-size:12.5px; font-weight:700; }
  .sf-quick-add { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom: 18px; font-size:13px; color: var(--sf-text-dim); }
  .sf-quick-add-btn { background: var(--sf-card); border:1px solid var(--sf-border); color: var(--sf-text); padding:8px 14px; border-radius:999px; font-family: var(--font-body); font-size:13px; font-weight:600; cursor:pointer; }
  .sf-quick-add-btn:hover { background: #eef0f5; }
  .sf-subs-list-head { display:flex; justify-content:space-between; align-items:center; padding:20px 24px 12px; }
  .sf-subs-list-head h2 { font-size:16px; font-weight:800; margin:0; }
  .sf-subs-list-head span { font-size:12px; color: var(--sf-text-faint); }

  /* 모달 */
  .sf-modal-overlay { position:fixed; inset:0; background:rgba(15,20,30,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; overflow-y:auto; }
  .sf-modal { background: var(--sf-card); border-radius:16px; padding:26px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; }
  .sf-modal h3 { margin:0 0 18px; font-size:17px; font-weight:800; }
  .sf-field { margin-bottom:14px; }
  .sf-field label { display:block; font-size:12.5px; color: var(--sf-text-dim); margin-bottom:6px; font-weight:600; }
  .sf-field input[type=text], .sf-field input[type=number], .sf-field input[type=date], .sf-field input[type=month], .sf-field textarea {
    width:100%; background: var(--sf-bg); border:1px solid var(--sf-border); border-radius:8px; padding:9px 11px; color: var(--sf-text); font-family: var(--font-body); font-size:13.5px; outline:none;
  }
  .sf-field input:focus, .sf-field textarea:focus { border-color: var(--sf-blue); }
  .sf-field textarea { resize: vertical; min-height:56px; }
  .sf-inline-row { display:flex; gap:8px; align-items:flex-end; }
  .sf-inline-row .sf-field { flex:1; margin-bottom:0; }
  .sf-mini-btn { background: var(--sf-blue-soft); border:1px solid transparent; color: var(--sf-blue); padding:9px 12px; border-radius:8px; font-family: var(--font-body); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; height:37px; }
  .sf-mini-btn:hover { filter: brightness(0.97); }
  .sf-radio-row { display:flex; gap:8px; }
  .sf-radio-option { flex:1; }
  .sf-radio-option input { display:none; }
  .sf-radio-option span { display:block; text-align:center; padding:9px 0; border-radius:8px; border:1px solid var(--sf-border); background: var(--sf-bg); color: var(--sf-text-dim); font-size:13px; cursor:pointer; }
  .sf-radio-option input:checked + span { border-color: var(--sf-blue); color: var(--sf-blue); background: var(--sf-blue-soft); font-weight:700; }
  .sf-fieldset { border:1px dashed var(--sf-border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .sf-fieldset-title { font-size:12.5px; font-weight:700; color: var(--sf-text-dim); margin-bottom:10px; }
  .sf-modal-actions { display:flex; gap:8px; margin-top: 20px; }
  .sf-btn { flex:1; padding:11px 0; border-radius:8px; border:none; font-family: var(--font-body); font-size:13.5px; font-weight:700; cursor:pointer; }
  .sf-btn-fill { background: var(--sf-blue); color:#fff; }
  .sf-btn-fill:hover { filter: brightness(1.08); }
  .sf-btn-flat { background: var(--sf-bg); color: var(--sf-text-dim); border:1px solid var(--sf-border); }

  .sf-btn-danger-text { background:none; border:none; color: var(--sf-red); font-family: var(--font-body); font-size:12.5px; font-weight:700; cursor:pointer; padding:11px 0; }
  .sf-btn-danger { background: var(--sf-red); color:#fff; }
  .sf-btn-danger:hover { filter: brightness(1.08); }

  .sf-login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background: var(--sf-bg); }
  .sf-login-box { width:300px; text-align:center; }
  .sf-login-box h1 { margin:10px 0 22px; font-size:22px; font-weight:900; }
  .sf-google-btn { width:100%; background:#fff; color:#12161f; border:1px solid var(--sf-border); border-radius:8px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
  .sf-login-error { color: var(--sf-red); font-size:12.5px; margin-top:12px; }

  @media (max-width: 760px) {
    .sf-summary-cards { grid-template-columns: 1fr; }
    .sf-table thead { display:none; }

    .sf-header-controls { width:100%; }
    .sf-month-input { flex:1; }
  }
  html { touch-action: manipulation; }

<div id="root"></div>

<script>
/* =========================================================================
   STUDIO FINANCE (ledger/index.html) — VINFILM STUDIO 소규모 사업자용 장부. 화면에 뜨는 큰 제목("스튜디오의 돈, 한눈에." 자리)은
   "수입·지출 관리"로 한글 표기하지만, 에이브로우/탭 제목은 원래대로 영문 "STUDIO FINANCE" 유지.
   매출/인건비(3.3% 원천세 자동계산)/지출을 한 장부에서 관리하고, 인건비는
   신고/납부/지급명세서 진행 상태를 별도로 체크한다. 구독료("디지털 월세")는
   원/달러 환산 없이 통화별로 따로 집계하는 별도 트래커.
   works/index.html과 동일한 바닐라 JS + Firebase(compat) 패턴을 그대로 따른다.
   재무 데이터라 guest 모드는 없음 — OWNER_EMAIL 계정만 접근 (UI 게이트일 뿐이고
   진짜 방어선은 firestore.rules의 isOwner()).
   ========================================================================= */

const OWNER_EMAIL = 'kj0010735@gmail.com';

/* 로컬(localhost/127.0.0.1/file://)로 열었을 때는 절대 실제 운영 Firestore를 건드리지 않는다.
   works/index.html에서 실제 데이터 삭제 사고가 있었던 뒤 도입된 안전장치 — 이 앱도 처음부터 동일하게 적용. */
const IS_LOCAL_DEV = ['localhost', '127.0.0.1', ''].includes(location.hostname) || location.protocol === 'file:';

const LS_ENTRIES = 'vinfilm-ledger-entries-v2';
const LS_SUBS = 'vinfilm-ledger-subs-v2';
const LS_SETTINGS = 'vinfilm-ledger-settings-v2';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,9)}`; }
function loadJSON(key, fallback) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
function daysUntil(dateStr) { return Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000); }
function formatWon(n) { return Math.round(n || 0).toLocaleString('ko-KR') + '원'; }
function formatKrwSymbol(n) { return '₩' + Math.round(n || 0).toLocaleString('ko-KR'); }
function formatUsd(n) { return 'US$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

const CATEGORY_META = {
  revenue: { label: '매출' },
  labor: { label: '인건비' },
  expense: { label: '지출' },
};
const PAYMENT_STATUS_META = {
  done: { label: '완료', cls: 'green' },
  in_progress: { label: '진행중', cls: 'amber' },
  scheduled: { label: '예정', cls: 'gray' },
};
const EVIDENCE_META = { done: { label: '완료' }, missing: { label: '미입력' } };
const FILING_STEP_META = {

/* ---- cloud sync bridge (works/index.html과 동일한 패턴) ---- */
async function pushToCloud(name, prevArr, nextArr) {
  if (!window.cloudSync || !window.cloudSyncReady) return;
  const prevIds = new Set(prevArr.map(x => x.id));
  const nextIds = new Set(nextArr.map(x => x.id));
  const toDelete = [...prevIds].filter(id => !nextIds.has(id));
  try {
    if (nextArr.length) await window.cloudSync.upsertMany(name, nextArr);
    if (toDelete.length) await window.cloudSync.deleteMany(name, toDelete);
  } catch (e) { console.warn('ledger cloud sync push failed for', name, e); }
}

function initCloudSync() {
  if (IS_LOCAL_DEV) {
    console.warn('로컬 환경이라 클라우드 동기화를 켜지 않았어요 — localStorage만으로 동작합니다. 실제 운영 데이터는 안전해요.');
    return;
  }
  if (typeof firebase === 'undefined') { console.warn('Firebase SDK를 불러오지 못했어요. 로컬 저장 모드로 계속 동작합니다.'); return; }
  try {
    const db = firebase.firestore();
    window.cloudSync = {
      async upsertMany(name, items) { await Promise.all(items.map(it => db.collection(name).doc(String(it.id)).set(it))); },
      async deleteMany(name, ids) { await Promise.all(ids.map(id => db.collection(name).doc(String(id)).delete())); },
      async setDoc(name, id, data) { await db.collection(name).doc(id).set(data); },
    };
    [['ledgerEntries', 'entries'], ['ledgerSubscriptions', 'subs']].forEach(([name, varName]) => {
      let initialized = false;
      db.collection(name).onSnapshot(async (snap) => {
        const items = snap.docs.map(d => d.data());
        const localArr = varName === 'entries' ? entries : subs;
        if (!initialized) {
          initialized = true;
          if (items.length === 0 && localArr.length > 0) { await window.cloudSync.upsertMany(name, localArr); return; }
        }
        if (varName === 'entries') { entries = items; try { localStorage.setItem(LS_ENTRIES, JSON.stringify(items)); } catch (e) {} }
        else { subs = items; try { localStorage.setItem(LS_SUBS, JSON.stringify(items)); } catch (e) {} }
        render();
      }, err => console.warn(name + ' sync error', err));
    });
    let settingsInitialized = false;
    db.collection('ledgerSettings').doc('main').onSnapshot(async (doc) => {
      if (doc.exists) {
        settings = doc.data();
        try { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); } catch (e) {}
        render();
      } else if (!settingsInitialized) {
        await window.cloudSync.setDoc('ledgerSettings', 'main', settings);
      }
      settingsInitialized = true;
    }, err => console.warn('ledgerSettings sync error', err));
    window.cloudSyncReady = true;
  } catch (e) { console.warn('initCloudSync failed', e); }
}

/* ================= computed helpers ================= */

function computeWithholding(totalAmount) { return Math.round((totalAmount || 0) * 0.033); }

function monthEntries(ym, tab) {
  return entries
    .filter(e => e.date && e.date.slice(0, 7) === ym)
    .filter(e => tab === 'all' || tab === 'filing' || e.category === tab)
    .filter(e => !S.search.trim() || (e.partner + ' ' + (e.project || '') + ' ' + (e.memo || '')).toLowerCase().includes(S.search.trim().toLowerCase()))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
}

function monthSummary(ym) {
  const list = entries.filter(e => e.date && e.date.slice(0, 7) === ym);
  const revenueTotal = list.filter(e => e.category === 'revenue').reduce((s, e) => s + (e.totalAmount || 0), 0);
  const revenueActual = list.filter(e => e.category === 'revenue').reduce((s, e) => s + (e.actualAmount || 0), 0);
  const expenseTotal = list.filter(e => e.category === 'expense' || e.category === 'labor').reduce((s, e) => s + (e.totalAmount || 0), 0);
  const taxPending = list.filter(e => e.category === 'labor' && e.taxPaymentStatus !== 'done').reduce((s, e) => s + (e.withholdingTax || 0), 0);
  return { revenueTotal, revenueActual, expenseTotal, taxPending };
}

function subsSummary() {
  const active = subs.filter(s => s.status === 'active');
  let krwMonthly = 0, usdMonthly = 0;
  active.forEach(s => {
    const monthly = s.billingCycle === 'yearly' ? (s.amount || 0) / 12 : (s.amount || 0);
    if (s.currency === 'USD') usdMonthly += monthly; else krwMonthly += monthly;
  });
  const rate = settings.usdKrwRate || 0;
  const krwMonthlyTotal = krwMonthly + usdMonthly * rate; // 원화 환산 합계 — 결제 시점 환율과는 다를 수 있음
  const dueSoon = active.filter(s => { const d = daysUntil(s.nextPaymentDate); return d >= 0 && d <= 7; }).length;
  const overdue = active.filter(s => daysUntil(s.nextPaymentDate) < 0).length;
  return {
    krwMonthly, usdMonthly, krwYearly: krwMonthly * 12, usdYearly: usdMonthly * 12,
    krwMonthlyTotal, krwYearlyTotal: krwMonthlyTotal * 12,
    activeCount: active.length, dueSoon, overdue,
  };
}

function subDday(dateStr) {
  const d = daysUntil(dateStr);
  if (d === 0) return { text: 'D-DAY', cls: 'amber' };
  if (d < 0) return { text: 'D+' + (-d), cls: 'red' };
  if (d <= 7) return { text: 'D-' + d, cls: 'amber' };
  return { text: 'D-' + d, cls: 'gray' };
}

function downloadCsv(rows, filename) {
  const header = ['거래일', '구분', '거래처', '프로젝트', '총액', '원천세', '실제입출금', '지급상태', '증빙', '메모'];
  const body = rows.map(e => [
    e.date, CATEGORY_META[e.category].label, e.partner, e.project || '',
    e.totalAmount, e.withholdingTax, e.actualAmount,
    PAYMENT_STATUS_META[e.paymentStatus].label, EVIDENCE_META[e.evidence].label, e.memo || '',
  ]);
  const csv = [header, ...body].map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ================= top-level render ================= */

function render() {
  let content;
  if (S.activeTab === 'filing') content = filingTabHtml();
  else if (S.activeTab === 'subs') content = subsTabHtml();
  else content = ledgerTableHtml();

  document.getElementById('root').innerHTML = `
    <div class="sf-shell">
      ${headerHtml()}
      ${summaryCardsHtml()}
      ${tabsHtml()}
      ${content}
      <div class="sf-footer-note">실제 은행 송금이나 세금 신고는 실행하지 않아. 여기서는 거래와 처리 상태를 기록해. · 과세 유형 미설정: 부가세 자동 계산 미적용</div>
    </div>
    ${entryModalHtml()}
    ${filingStatusModalHtml()}
    ${subModalHtml()}
    ${rateModalHtml()}
    ${confirmDeleteModalHtml()}
    ${confirmSubDeleteModalHtml()}
  `;
  wireLiveFormBehavior();

  const monthInput = document.getElementById('sfMonthInput');
  if (monthInput) monthInput.addEventListener('change', e => { S.month = e.target.value; render(); });

  const searchInput = document.getElementById('sfSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', e => { S.search = e.target.value; refreshLedgerTable(); });
    const pos = searchInput.value.length;
    searchInput.setSelectionRange(pos, pos);
    searchInput.focus();
  }
}

function wireLiveFormBehavior() {
  const form = document.getElementById('sfEntryForm');
  if (!form) return;
  const filingFieldset = document.getElementById('sfFilingFieldset');
  form.querySelectorAll('input[name="category"]').forEach(r => {
    r.addEventListener('change', () => { if (r.checked) filingFieldset.style.display = r.value === 'labor' ? 'block' : 'none'; });
  });
  const autoTaxBtn = document.getElementById('sfAutoTaxBtn');
  if (autoTaxBtn) {
    autoTaxBtn.addEventListener('click', () => {
      const total = parseFloat(document.getElementById('sfTotalAmount').value) || 0;
      const tax = computeWithholding(total);
      document.getElementById('sfWithholdingTax').value = tax;
      document.getElementById('sfActualAmount').value = Math.max(0, total - tax);
    });
  }
  const totalInput = document.getElementById('sfTotalAmount');
  const taxInput = document.getElementById('sfWithholdingTax');
  const actualInput = document.getElementById('sfActualAmount');
  if (totalInput && actualInput) {
    totalInput.addEventListener('input', () => {
      const total = parseFloat(totalInput.value) || 0;
      const tax = parseFloat(taxInput.value) || 0;
      actualInput.value = Math.max(0, total - tax);
    });
  }
}

/* ================= events ================= */

document.addEventListener('submit', e => {
  if (e.target.id === 'sfEntryForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    const totalAmount = parseFloat(fd.get('totalAmount')) || 0;
    const withholdingTax = parseFloat(fd.get('withholdingTax')) || 0;
    const payload = {
      category: fd.get('category'),
      date: fd.get('date'),
      partner: (fd.get('partner') || '').trim(),
      project: (fd.get('project') || '').trim(),
      totalAmount,
      withholdingTax,
      actualAmount: parseFloat(fd.get('actualAmount')) || Math.max(0, totalAmount - withholdingTax),
      paymentStatus: fd.get('paymentStatus'),
      evidence: fd.get('evidence'),
      filingStatus: fd.get('filingStatus') || 'before',
      taxPaymentStatus: fd.get('taxPaymentStatus') || 'before',
      docStatus: fd.get('docStatus') || 'before',
      memo: (fd.get('memo') || '').trim(),
    };
    if (!payload.partner || !payload.date) return;
    if (S.editingId) {
      saveEntries(entries.map(x => x.id === S.editingId ? { ...x, ...payload } : x));
    } else {
      saveEntries([{ id: uid(), createdAt: Date.now(), ...payload }, ...entries]);
    }
    S.modalOpen = false; S.editingId = null;
    render();
  } else if (e.target.id === 'sfFilingForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    saveEntries(entries.map(x => x.id === S.filingModalId ? { ...x, filingStatus: fd.get('filingStatus'), taxPaymentStatus: fd.get('taxPaymentStatus'), docStatus: fd.get('docStatus') } : x));
    S.filingModalId = null;
    render();
  } else if (e.target.id === 'sfSubForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      service: (fd.get('service') || '').trim(),
      plan: (fd.get('plan') || '').trim(),
      amount: parseFloat(fd.get('amount')) || 0,
      currency: fd.get('currency'),
      billingCycle: fd.get('billingCycle'),
      nextPaymentDate: fd.get('nextPaymentDate'),
      status: fd.get('status'),
      paymentMethod: (fd.get('paymentMethod') || '').trim(),
    };
    if (!payload.service) return;
    if (S.subEditingId) {
      saveSubs(subs.map(x => x.id === S.subEditingId ? { ...x, ...payload } : x));
    } else {
      saveSubs([{ id: uid(), createdAt: Date.now(), ...payload }, ...subs]);
    }
    S.subModalOpen = false; S.subEditingId = null; S.subPrefillService = '';
    render();
  } else if (e.target.id === 'sfRateForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    saveSettings({ usdKrwRate: parseFloat(fd.get('rate')) || settings.usdKrwRate, rateDate: fd.get('rateDate') });
    S.rateModalOpen = false;
    render();
  }
});

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  switch (action) {
    case 'sf-set-tab': S.activeTab = btn.dataset.tab; S.search = ''; render(); break;
    case 'sf-open-add': S.modalOpen = true; S.editingId = null; render(); break;
    case 'sf-open-edit': S.modalOpen = true; S.editingId = id; render(); break;
    case 'sf-close-modal': if (e.target === btn) { S.modalOpen = false; S.editingId = null; render(); } break;
    case 'sf-confirm-delete': S.confirmDeleteId = id; S.modalOpen = false; render(); break;
    case 'sf-cancel-delete': if (e.target === btn) { S.confirmDeleteId = null; render(); } break;
    case 'sf-delete': saveEntries(entries.filter(x => x.id !== id)); S.confirmDeleteId = null; render(); break;
    case 'sf-open-filing-status': S.filingModalId = id; render(); break;
    case 'sf-close-filing-status': if (e.target === btn) { S.filingModalId = null; render(); } break;
    case 'sf-download-csv': {
      const [y, m] = S.month.split('-').map(Number);
      const list = entries.filter(x => x.date && x.date.slice(0, 7) === S.month).sort((a, b) => a.date.localeCompare(b.date));
      downloadCsv(list, `studio-finance-${S.month}.csv`);
      break;
    }
    case 'sf-open-sub-add': S.subModalOpen = true; S.subEditingId = null; S.subPrefillService = ''; render(); break;
    case 'sf-quick-add-sub': S.subModalOpen = true; S.subEditingId = null; S.subPrefillService = btn.dataset.service; render(); break;
    case 'sf-open-sub-edit': S.subModalOpen = true; S.subEditingId = id; render(); break;
    case 'sf-close-sub-modal': if (e.target === btn) { S.subModalOpen = false; S.subEditingId = null; S.subPrefillService = ''; render(); } break;
    case 'sf-confirm-sub-delete': S.subConfirmDeleteId = id; S.subModalOpen = false; render(); break;
    case 'sf-cancel-sub-delete': if (e.target === btn) { S.subConfirmDeleteId = null; render(); } break;
    case 'sf-sub-delete': saveSubs(subs.filter(x => x.id !== id)); S.subConfirmDeleteId = null; render(); break;
    case 'sf-open-rate': S.rateModalOpen = true; render(); break;
    case 'sf-close-rate': if (e.target === btn) { S.rateModalOpen = false; render(); } break;
    case 'sf-logout': firebase.auth().signOut(); break;
  }
});

/* ================= auth gate ================= */

function bootApp() { initCloudSync(); render(); }

function showAccessDenied(email) {
  document.getElementById('root').innerHTML = `
    <div class="sf-login-wrap">
      <div class="sf-login-box">
        <img class="sf-login-logo" src="../assets/logo.png" alt="VINFILM STUDIO" width="132" height="67" />
        <div class="sf-eyebrow">STUDIO FINANCE</div>
        <h1>수입·지출 관리</h1>
        <p class="sf-denied-note">${esc(email)} 계정에는 접근 권한이 없어요.</p>
        <button class="sf-logout" style="margin-top:14px;" data-action="sf-logout">로그아웃</button>
      </div>
    </div>`;
}

function showLoginGate() {
  document.getElementById('root').innerHTML = `
    <div class="sf-login-wrap">
      <div class="sf-login-box">
        <img class="sf-login-logo" src="../assets/logo.png" alt="VINFILM STUDIO" width="132" height="67" />
        <div class="sf-eyebrow">STUDIO FINANCE</div>
        <h1>수입·지출 관리</h1>
        <button id="sfGoogleLoginBtn" class="sf-google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.4 26.8 36 24 36c-5.3 0-9.8-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.3 5.3C39.9 37.1 44 31.4 44 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
          Google로 로그인
        </button>
        <div id="sfLoginError" class="sf-login-error" style="display:none;"></div>
      </div>
    </div>`;
  document.getElementById('sfGoogleLoginBtn').addEventListener('click', () => {
    const errEl = document.getElementById('sfLoginError');
    errEl.style.display = 'none';
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
      errEl.textContent = '로그인 실패: ' + err.message;
      errEl.style.display = 'block';
    });
  });
}

if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') {
  bootApp();
} else {
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      if (user.email === OWNER_EMAIL) bootApp();
      else showAccessDenied(user.email);
    } else {
      showLoginGate();
    }
  });
}
</script>
</body>
</html>
