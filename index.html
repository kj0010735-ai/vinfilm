<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VINFILM STUDIO</title>
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root { --accent: #d98a3d; --bg: #0e0d0c; --fg: #f5f2ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { color: var(--fg); font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { opacity: 0.75; }
  ::selection { background: var(--accent); color: var(--bg); }
  img, video { max-width: 100%; }
  #root { opacity: 0; transition: opacity .35s ease; }

  .nav-link:hover { color: var(--fg) !important; }

  .grid-cell { position:relative; overflow:hidden; cursor:pointer; display:block; background-size:cover; background-position:center; }
  .grid-cell .cell-img { position:absolute; inset:0; transition: transform .5s ease; background-size:cover; background-position:center; }
  .grid-cell:hover .cell-img { transform: scale(1.06); }
  .grid-cell .cell-caption { position:absolute; left:0; right:0; bottom:0; padding:22px 24px; background:linear-gradient(180deg, transparent, rgba(0,0,0,0.82) 78%); opacity:0; transform:translateY(8px); transition: all .3s ease; }
  .grid-cell:hover .cell-caption { opacity:1; transform:translateY(0); }

  .acc-row { border-bottom:1px solid rgba(245,242,234,0.25); transition: background .2s ease; }
  .acc-row:hover { background: rgba(245,242,234,0.06); }
  .acc-row:hover .acc-plus { transform: rotate(45deg); border-color:#f5f2ea; }
  .acc-plus { transition: all .25s ease; }

  .reel-fab { transition: transform .2s ease; }
  .reel-fab:hover { transform: scale(1.08); }

  .subscribe-btn:hover { background:#f5f2ea; color:#0e0d0c; }

  @media (max-width: 720px) {
    .work-grid { grid-template-columns: 1fr !important; }
    .footer-row, .contact-row, .work-head-row { flex-direction: column !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAVJ6ZZ6L-3RtgoYe2dDSn_lCHXv3CeBGc",
  authDomain: "vinfilm-studio-app.firebaseapp.com",
  projectId: "vinfilm-studio-app",
  storageBucket: "vinfilm-studio-app.firebasestorage.app",
  messagingSenderId: "1072224922970",
  appId: "1:1072224922970:web:bb2cf2544b1c92a7211763",
};

const DEFAULT_CONTENT = {
  heroVideoUrl: '',
  heroEyebrow: 'VIDEO PRODUCTION STUDIO',
  heroHeadline: '[헤드라인 카피를 넣어주세요]',
  heroSub: '인터뷰와 내레이션을 중심으로, 사람의 목소리와 표정을 영상으로 옮기는 곳, VINFILM STUDIO입니다.',
  workIntro: '교육·브랜드 콘텐츠를 중심으로 진행한 최신 프로젝트입니다. 매 촬영이 새로운 이야기를 만드는 기회였습니다.',
  workItems: [
    { title: '삼둥이 인터뷰', client: '에나스쿨', year: '2026', thumbUrl: '', videoUrl: '' },
    { title: 'EF 영어능력지수 내레이션 시리즈', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
    { title: '대치동 학습 습관 인터뷰', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
    { title: '영어 말하기 유창성 다큐', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
  ],
  contactEmail: '',
  contactPhone: '',
  contactAddress: '',
  instagramUrl: '',
  vimeoUrl: '',
};

const PLACEHOLDER_GRADIENTS = [
  'linear-gradient(135deg, #3a2f22, #17130d)',
  'linear-gradient(135deg, #23292c, #121517)',
  'linear-gradient(135deg, #332822, #16110d)',
  'linear-gradient(135deg, #262b23, #131611)',
];

function workCellHtml(item, i) {
  const bg = item.thumbUrl ? `background-image:url('${esc(item.thumbUrl)}');` : `background:${PLACEHOLDER_GRADIENTS[i % PLACEHOLDER_GRADIENTS.length]};`;
  const tag = item.videoUrl ? 'a' : 'div';
  const hrefAttr = item.videoUrl ? `href="${esc(item.videoUrl)}" target="_blank" rel="noopener"` : '';
  return `
    <${tag} class="grid-cell" ${hrefAttr} style="aspect-ratio:16/11; border-radius:2px;">
      <div class="cell-img" style="${bg}"></div>
      <div class="cell-caption">
        <div style="font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:19px; color:#f5f2ea;">${esc(item.title)}</div>
        <div style="font-size:12.5px; color:#c7c2b6; margin-top:4px;">${esc(item.client)}${item.client && item.year ? ' · ' : ''}${esc(item.year)}</div>
      </div>
    </${tag}>`;
}

function parseVideoUrl(url) {
  if (!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  if (m) return { type: 'youtube', id: m[1] };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { type: 'vimeo', id: m[1] };
  return { type: 'file', url };
}
function heroMediaHtml(c) {
  const v = parseVideoUrl(c.heroVideoUrl);
  if (v && v.type === 'youtube') {
    return `<iframe src="https://www.youtube.com/embed/${esc(v.id)}?autoplay=1&mute=1&loop=1&playlist=${esc(v.id)}&controls=0&modestbranding=1&playsinline=1&rel=0" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.55; pointer-events:none; border:none;" allow="autoplay; encrypted-media"></iframe>`;
  }
  if (v && v.type === 'vimeo') {
    return `<iframe src="https://player.vimeo.com/video/${esc(v.id)}?autoplay=1&muted=1&loop=1&background=1" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.55; pointer-events:none; border:none;" allow="autoplay; encrypted-media"></iframe>`;
  }
  if (v && v.type === 'file') {
    return `<video autoplay muted loop playsinline style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.55;"><source src="${esc(v.url)}"></video>`;
  }
  return `<div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-46%); white-space:nowrap; font-family:'Anton',sans-serif; font-size:190px; line-height:1; color:transparent; -webkit-text-stroke:1.5px rgba(245,242,234,0.07); pointer-events:none; user-select:none;">VINFILM STUDIO VINFILM STUDIO</div>`;
}

function render(c) {
  document.getElementById('root').innerHTML = `
  <div style="width:100%; position:relative;">

    <!-- NAV -->
    <div style="position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:24px clamp(24px,4vw,56px); background:linear-gradient(180deg, rgba(14,13,12,0.8), rgba(14,13,12,0));">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="var(--accent)" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="var(--accent)"/></svg>
        <div style="font-family:'Anton',sans-serif; font-size:19px; letter-spacing:1px; color:#f5f2ea;">VINFILM STUDIO</div>
      </div>
      <div style="display:flex; align-items:center; gap:34px; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px;">
        <a href="#home" class="nav-link" style="color:#f5f2ea;">HOME</a>
        <a href="#work" class="nav-link" style="color:#8c887f;">WORK</a>
        <a href="#about" class="nav-link" style="color:#8c887f;">ABOUT</a>
        <a href="#contact" class="nav-link" style="color:#8c887f;">CONTACT</a>
      </div>
    </div>

    <!-- HERO -->
    <div id="home" style="position:relative; height:820px; overflow:hidden; border-bottom:1px solid #221f1c; background:
        radial-gradient(ellipse 900px 640px at 76% 22%, rgba(217,138,61,0.14), transparent 60%),
        linear-gradient(180deg, #17140f 0%, #0e0d0c 70%);">

      <div style="position:absolute; inset:0; opacity:0.45; pointer-events:none; background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 3px 3px;"></div>
      ${heroMediaHtml(c)}

      <div style="position:relative; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:0 clamp(24px,4vw,56px) 100px;">
        <div style="font-family:'Anton',sans-serif; font-size:14px; letter-spacing:5px; color:var(--accent); margin-bottom:24px;">${esc(c.heroEyebrow)}</div>
        <h1 style="margin:0; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(40px,5.6vw,72px); line-height:1.2; letter-spacing:-1px; color:#f5f2ea; max-width:760px;">${esc(c.heroHeadline)}</h1>
        <p style="margin:26px 0 0; font-size:17px; line-height:1.75; color:#bdb8ac; font-weight:400; max-width:560px;">${esc(c.heroSub)}</p>
      </div>
    </div>

    <!-- WORK -->
    <div id="work" style="padding:130px clamp(24px,4vw,56px) 110px; border-bottom:1px solid #201f1d;">
      <div class="work-head-row" style="display:flex; align-items:flex-start; justify-content:space-between; gap:40px; flex-wrap:wrap; margin-bottom:52px;">
        <div>
          <h2 style="margin:0 0 18px; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(32px,4vw,46px); color:#f5f2ea;">최근 작업</h2>
          <div style="width:64px; height:2px; background:#3a3733;"></div>
        </div>
        <div style="max-width:420px; display:flex; flex-direction:column; gap:14px;">
          <p style="margin:0; font-size:15px; line-height:1.75; color:#a8a49b;">${esc(c.workIntro)}</p>
        </div>
      </div>

      <div class="work-grid" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;">
        ${c.workItems.map(workCellHtml).join('')}
      </div>
    </div>

    <!-- WHAT WE DO -->
    <div id="about" style="position:relative; padding:120px clamp(24px,4vw,56px); overflow:hidden; background:linear-gradient(160deg, #b8511f 0%, #963f19 100%);">
      <div style="position:absolute; inset:0; opacity:0.5; pointer-events:none; background-image: radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 3px 3px;"></div>
      <div style="position:absolute; width:640px; height:640px; border-radius:50%; background:rgba(255,255,255,0.05); left:-180px; bottom:-260px;"></div>
      <div style="position:absolute; width:420px; height:420px; border-radius:50%; background:rgba(0,0,0,0.10); right:-120px; top:-160px;"></div>

      <div style="position:relative; display:flex; gap:60px; flex-wrap:wrap; justify-content:space-between;">
        <h2 style="margin:0; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(38px,5vw,58px); line-height:1.15; color:#f5f2ea; max-width:420px;">무엇을<br/>만드나요?</h2>

        <div style="flex:1 1 460px; max-width:560px; background:rgba(14,13,12,0.32); border:1px solid rgba(245,242,234,0.18); border-radius:4px; padding:8px 28px;">
          ${['인터뷰 촬영','내레이션 디렉팅','편집 · 후반작업','브랜디드 콘텐츠'].map((label, i, arr) => `
          <div class="acc-row" style="display:flex; align-items:center; justify-content:space-between; padding:22px 4px; ${i===arr.length-1 ? 'border-bottom:none;' : ''}">
            <span style="font-family:'Anton',sans-serif; font-size:15px; letter-spacing:1px; color:#f5f2ea;">${esc(label)}</span>
            <span class="acc-plus" style="width:16px; height:16px; position:relative; flex:0 0 auto;">
              <span style="position:absolute; left:0; top:50%; width:100%; height:2px; background:#f5f2ea; transform:translateY(-50%);"></span>
              <span style="position:absolute; top:0; left:50%; height:100%; width:2px; background:#f5f2ea; transform:translateX(-50%);"></span>
            </span>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- CONTACT -->
    <div class="contact-row" id="contact" style="padding:130px clamp(24px,4vw,56px); display:flex; gap:60px; flex-wrap:wrap; border-bottom:1px solid #201f1d;">
      <div style="flex:1 1 420px; max-width:520px;">
        <h2 style="margin:0 0 10px; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(30px,3.6vw,42px); line-height:1.2; color:#f5f2ea;">궁금한 게 있으신가요?</h2>
        <h2 style="margin:0 0 40px; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(30px,3.6vw,42px); line-height:1.2; color:var(--accent);">이야기해요.</h2>

        <div style="font-family:'Anton',sans-serif; font-size:12px; letter-spacing:2px; color:#79766f; margin-bottom:10px;">GENERAL</div>
        <div style="font-size:15px; color:#d8d4c9; margin-bottom:28px;">${esc(c.contactEmail) || '[CONTACT EMAIL]'}<br/>${esc(c.contactPhone) || '[CONTACT PHONE]'}</div>

        <div style="font-family:'Anton',sans-serif; font-size:12px; letter-spacing:2px; color:#79766f; margin-bottom:10px;">STUDIO</div>
        <div style="font-size:15px; color:#d8d4c9;">${esc(c.contactAddress) || '[STUDIO ADDRESS]'}</div>
      </div>

      <div style="flex:1 1 340px; display:flex; align-items:center; justify-content:center; position:relative; min-height:340px;">
        <div style="width:min(100%,380px); height:300px; border-radius:50%; transform:rotate(-8deg); overflow:hidden; background:linear-gradient(135deg, #2a2420 0%, #14120f 60%, #0e0d0c 100%); position:relative;">
          <div style="position:absolute; inset:0; opacity:0.4; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size:4px 4px;"></div>
        </div>
        <div style="position:absolute; right:14%; bottom:6%; width:56px; height:56px; border-radius:50%; background:#0e0d0c; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="var(--accent)" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="var(--accent)"/></svg>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div style="padding:96px clamp(24px,4vw,56px) 40px;">
      <div class="footer-row" style="display:flex; justify-content:space-between; align-items:flex-start; gap:40px; flex-wrap:wrap; padding-bottom:56px; border-bottom:1px solid #232120;">
        <div style="max-width:420px;">
          <h3 style="margin:0 0 18px; font-family:'Anton',sans-serif; font-size:clamp(26px,3vw,34px); letter-spacing:0.5px; color:#f5f2ea;">소식 받아볼래요?</h3>
          <div style="display:flex; gap:10px; max-width:380px;">
            <input type="text" placeholder="이메일 주소" style="flex:1; background:transparent; border:none; border-bottom:1px solid #4a4742; color:#f5f2ea; font-size:14px; padding:10px 4px; font-family:'Noto Sans KR',sans-serif;" />
            <button class="subscribe-btn" style="background:transparent; border:1px solid #f5f2ea; color:#f5f2ea; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:1.5px; padding:0 22px; border-radius:2px; cursor:pointer; transition:all .2s ease;">구독하기</button>
          </div>
        </div>
        <div style="display:flex; gap:28px; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px;">
          ${c.instagramUrl ? `<a href="${esc(c.instagramUrl)}" target="_blank" rel="noopener">INSTAGRAM</a>` : `<span style="color:#4a4742;">INSTAGRAM</span>`}
          ${c.vimeoUrl ? `<a href="${esc(c.vimeoUrl)}" target="_blank" rel="noopener">VIMEO</a>` : `<span style="color:#4a4742;">VIMEO</span>`}
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; padding-top:22px; font-size:12px; color:#6f6c65; letter-spacing:0.8px; flex-wrap:wrap; gap:8px;">
        <span>© 2026 VINFILM STUDIO</span>
        <span>SEOUL, KOREA</span>
      </div>
    </div>

    <!-- FLOATING REEL BUTTON -->
    <a href="${esc(c.vimeoUrl) || '#work'}" target="${c.vimeoUrl ? '_blank' : '_self'}" rel="noopener" class="reel-fab" style="position:fixed; right:32px; bottom:32px; width:64px; height:64px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:60; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 4L19 12L6 20V4Z" fill="#0e0d0c"/></svg>
    </a>

  </div>`;
}

/* Firestore 로딩 중엔 기본값(플레이스홀더)을 먼저 보여주지 않는다 —
   실제 콘텐츠가 준비되면(또는 타임아웃 시 기본값으로) 딱 한 번만 그린다. */
let rendered = false;
function renderOnce(c) {
  if (rendered) return;
  rendered = true;
  render(c);
  requestAnimationFrame(() => { document.getElementById('root').style.opacity = '1'; });
}
const fallbackTimer = setTimeout(() => renderOnce(DEFAULT_CONTENT), 1200);

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  db.collection('siteContent').doc('home').get().then(doc => {
    clearTimeout(fallbackTimer);
    if (doc.exists) {
      const data = doc.data();
      const merged = { ...DEFAULT_CONTENT, ...data };
      if (!Array.isArray(merged.workItems)) merged.workItems = DEFAULT_CONTENT.workItems;
      renderOnce(merged);
    } else {
      renderOnce(DEFAULT_CONTENT);
    }
  }).catch(err => { console.warn('site content load failed, showing defaults', err); renderOnce(DEFAULT_CONTENT); });
} catch (e) {
  console.warn('Firebase 초기화 실패, 기본 콘텐츠로 표시합니다.', e);
  renderOnce(DEFAULT_CONTENT);
}
</script>
</body>
</html>
