<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root { --accent: #d98a3d; --bg: #0e0d0c; --fg: #f5f2ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { color: var(--fg); font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { opacity: 0.75; }
  ::selection { background: var(--accent); color: var(--bg); }
  img, video { max-width: 100%; }
  html, body { touch-action: manipulation; }
  #root { opacity: 0; transition: opacity .35s ease; }
  @keyframes hero-ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .hero-ticker-track { animation: hero-ticker-scroll 240s linear infinite; }

  .nav-link { font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px; transition: all .2s ease; }
  .nav-link:hover { color: var(--fg) !important; background: rgba(255,255,255,0.14); }

  .glass-pill {
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 8px rgba(0,0,0,0.15), 0 6px 20px rgba(0,0,0,0.25);
  }
  .nav-hamburger { display: none; border-radius: 999px; }
  .mobile-nav-panel {
    display: none;
    position: fixed; top: 66px; right: 16px; left: auto; width: 85px; z-index: 49;
    max-height: 0; overflow: hidden;
    transition: max-height .35s ease, opacity .3s ease;
    opacity: 0;
    border-radius: 20px;
  }
  .mobile-nav-panel.open { max-height: 320px; opacity: 1; }
  .mobile-nav-panel .nav-link { font-size: 16px !important; padding: 14px 10px !important; text-align: center; }
  .mobile-nav-panel .nav-link:hover { background: rgba(255,255,255,0.1); }
  @media (max-width: 720px) {
    .mobile-nav-panel { display: block; }
  }
  .glass-text {
    color: #f5f2ea;
    background: linear-gradient(100deg, #9c988e 25%, #ffffff 47%, #ffffff 53%, #9c988e 75%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 1px 1px rgba(255,255,255,0.2);
    animation: glass-shine 5s ease-in-out infinite;
  }
  @keyframes glass-shine {
    0%, 15% { background-position: 200% 0; }
    85%, 100% { background-position: -200% 0; }
  }
  .glass-text-ticker {
    color: #f5f2ea;
    background: linear-gradient(180deg, #ffffff 0%, #d8d4c9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 1px 1px rgba(255,255,255,0.25);
  }

  .grid-cell { position:relative; overflow:hidden; cursor:pointer; display:block; background-size:cover; background-position:center; }
  .grid-cell .cell-img { position:absolute; inset:0; transition: transform .5s ease; background-size:cover; background-position:center; }
  .grid-cell:hover .cell-img { transform: scale(1.06); }
  .grid-cell .cell-caption { position:absolute; left:0; right:0; bottom:0; padding:22px 24px; background:linear-gradient(180deg, transparent, rgba(0,0,0,0.82) 78%); opacity:0; transform:translateY(8px); transition: all .3s ease; }
  .grid-cell:hover .cell-caption { opacity:1; transform:translateY(0); }
  .cell-play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:42px; height:42px; border-radius:50%; background:rgba(245,242,234,0.92); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .25s ease; pointer-events:none; }
  .grid-cell:hover .cell-play { opacity:1; }
  .work-category-row { scrollbar-width: thin; }
  .work-category-row::-webkit-scrollbar { height: 6px; }
  .work-category-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .work-lightbox { display:none; position:fixed; inset:0; background:rgba(6,5,4,0.94); z-index:200; align-items:center; justify-content:center; padding:40px; }
  .work-lightbox.open { display:flex; }
  .work-lightbox-inner { width:100%; max-width:1100px; aspect-ratio:16/9; background:#000; }
  .work-lightbox-close { position:absolute; top:24px; right:28px; background:none; border:none; color:#f5f2ea; font-size:28px; cursor:pointer; line-height:1; }

  .acc-row { border-bottom:1px solid rgba(245,242,234,0.25); transition: background .2s ease; }
  .acc-row:hover { background: rgba(245,242,234,0.06); }
  .acc-row:hover .acc-plus { transform: rotate(45deg); border-color:#f5f2ea; }
  .acc-plus { transition: all .25s ease; }

  .reel-fab { transition: transform .2s ease; }
  .reel-fab:hover { transform: scale(1.08); }

  .subscribe-btn:hover { background:#f5f2ea; color:#0e0d0c; }

  .hero-section { height: 820px; }

  @media (max-width: 720px) {
    .footer-row, .contact-row, .work-head-row { flex-direction: column !important; }

    .hero-section { height: 70vh; min-height: 420px; }
    .hero-foreground { padding-bottom: 190px !important; }
    .hero-ticker-band { height: 30% !important; min-height: 120px !important; }
    .hero-ticker-text { font-size: 56px !important; padding: 0 24px !important; }
    .hero-ticker-track { animation-duration: 110s !important; }

    .nav-bar { padding: 12px 16px !important; }
    .nav-logo-pill { padding: 7px 12px 7px 10px !important; gap: 6px !important; }
    .nav-logo-text { font-size: 13px !important; letter-spacing: 0.5px !important; }
    .nav-menu-pill { display: none !important; }
    .nav-hamburger { display: flex !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  projectId: "vinfilm-studio-app",
  storageBucket: "vinfilm-studio-app.firebasestorage.app",
  messagingSenderId: "1072224922970",
  appId: "1:1072224922970:web:bb2cf2544b1c92a7211763",

const DEFAULT_CONTENT = {
  heroVideoUrl: '',
  heroEyebrow: 'VIDEO PRODUCTION STUDIO',
  heroHeadline: '[헤드라인 카피를 넣어주세요]',
  heroSub: '인터뷰와 내레이션을 중심으로, 사람의 목소리와 표정을 영상으로 옮기는 곳, VINFILM STUDIO입니다.',
  workIntro: '교육·브랜드 콘텐츠를 중심으로 진행한 최신 프로젝트입니다. 매 촬영이 새로운 이야기를 만드는 기회였습니다.',
  workItems: [
    { category: '인터뷰 콘텐츠', title: '삼둥이 인터뷰', client: '에나스쿨', year: '2026', thumbUrl: '', videoUrl: '' },
    { category: '내레이션 콘텐츠', title: 'EF 영어능력지수 내레이션 시리즈', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
    { category: '인터뷰 콘텐츠', title: '대치동 학습 습관 인터뷰', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
    { category: '내레이션 콘텐츠', title: '영어 말하기 유창성 다큐', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
  ],
  contactEmail: '',
  contactPhone: '',
  contactAddress: '',
  instagramUrl: '',
  vimeoUrl: '',
};

const PLACEHOLDER_GRADIENTS = [
  'linear-gradient(135deg, #3a2f22, #17130d)',
  'linear-gradient(135deg, #23292c, #121517)',
  'linear-gradient(135deg, #332822, #16110d)',
  'linear-gradient(135deg, #262b23, #131611)',
];

function workCellHtml(item, i) {
  const bg = item.thumbUrl ? `background-image:url('${esc(item.thumbUrl)}');` : `background:${PLACEHOLDER_GRADIENTS[i % PLACEHOLDER_GRADIENTS.length]};`;
  const clickAttr = item.videoUrl ? `onclick='openWorkLightbox("${esc(item.videoUrl)}")'` : '';
  return `
    <div class="grid-cell" ${clickAttr} style="flex:0 0 280px; aspect-ratio:16/9; border-radius:2px;">
      <div class="cell-img" style="${bg}"></div>
      ${item.videoUrl ? `<div class="cell-play"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 4L19 12L6 20V4Z" fill="#0e0d0c"/></svg></div>` : ''}
      <div class="cell-caption">
        <div style="font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:15px; color:#f5f2ea;">${esc(item.title)}</div>
        <div style="font-size:11.5px; color:#c7c2b6; margin-top:4px;">${esc(item.client)}${item.client && item.year ? ' · ' : ''}${esc(item.year)}</div>
      </div>
    </div>`;
}
function groupWorkItems(items) {
  const order = []; const map = {};
  items.forEach(it => {
    const cat = (it.category || '').trim() || '작업';
    if (!map[cat]) { map[cat] = []; order.push(cat); }
    map[cat].push(it);
  });
  return order.map(cat => ({ category: cat, items: map[cat] }));
}
function workCategoryHtml(group) {
  return `
    <div style="margin-bottom:44px;">
      <h3 style="margin:0 0 18px; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:2px; color:var(--accent);">${esc(group.category.toUpperCase())}</h3>
      <div class="work-category-row" style="display:flex; gap:14px; overflow-x:auto;">
        ${group.items.map(workCellHtml).join('')}
      </div>
    </div>`;
}
function openWorkLightbox(url) {
  const v = parseVideoUrl(url);
  if (!v) return;
  let inner = '';
  if (v.type === 'youtube') inner = `<iframe src="https://www.youtube.com/embed/${esc(v.id)}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
  else if (v.type === 'vimeo') inner = `<iframe src="https://player.vimeo.com/video/${esc(v.id)}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
  else inner = `<video src="${esc(v.url)}" controls autoplay style="width:100%;height:100%;"></video>`;
  document.getElementById('workLightboxInner').innerHTML = inner;
  document.getElementById('workLightbox').classList.add('open');
}
function closeWorkLightbox() {
  document.getElementById('workLightbox').classList.remove('open');
  document.getElementById('workLightboxInner').innerHTML = '';
}

function parseVideoUrl(url) {
  if (!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  if (m) return { type: 'youtube', id: m[1] };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { type: 'vimeo', id: m[1] };
  return { type: 'file', url };
}
function heroMediaHtml(c) {
  const v = parseVideoUrl(c.heroVideoUrl);
  if (v && v.type === 'youtube') {
    return `<iframe src="https://www.youtube.com/embed/${esc(v.id)}?autoplay=1&mute=1&loop=1&playlist=${esc(v.id)}&controls=0&modestbranding=1&playsinline=1&rel=0" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.9; pointer-events:none; border:none;" allow="autoplay; encrypted-media"></iframe>`;
  }
  if (v && v.type === 'vimeo') {
    return `<iframe src="https://player.vimeo.com/video/${esc(v.id)}?autoplay=1&muted=1&loop=1&background=1" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.9; pointer-events:none; border:none;" allow="autoplay; encrypted-media"></iframe>`;
  }
  if (v && v.type === 'file') {
    return `<video autoplay muted loop playsinline preload="auto" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.9;"><source src="${esc(v.url)}"></video>`;
  }
  return '';
}

function render(c) {
  document.getElementById('root').innerHTML = `
  <div style="width:100%; position:relative;">

    <!-- NAV -->
    <div class="nav-bar" style="position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:16px clamp(24px,4vw,56px);">
      <div class="glass-pill nav-logo-pill" style="display:flex; align-items:center; gap:10px; padding:9px 18px 9px 14px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="var(--accent)" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="var(--accent)"/></svg>
        <div class="glass-text nav-logo-text" style="font-family:'Anton',sans-serif; font-size:19px; letter-spacing:1px; white-space:nowrap;">VINFILM STUDIO</div>
      </div>
      <div class="glass-pill nav-menu-pill" style="display:flex; align-items:center; gap:2px; padding:6px;">
        <a href="#home" class="nav-link glass-text" style="padding:9px 18px; border-radius:999px; white-space:nowrap;">HOME</a>
        <a href="#work" class="nav-link" style="padding:9px 18px; border-radius:999px; color:#d8d4c9; white-space:nowrap;">WORK</a>
        <a href="#about" class="nav-link" style="padding:9px 18px; border-radius:999px; color:#d8d4c9; white-space:nowrap;">ABOUT</a>
        <a href="#contact" class="nav-link" style="padding:9px 18px; border-radius:999px; color:#d8d4c9; white-space:nowrap;">CONTACT</a>
      </div>
      <button class="glass-pill nav-hamburger" onclick="toggleMobileNav()" aria-label="메뉴" style="width:42px; height:42px; border:none; cursor:pointer; align-items:center; justify-content:center; background-color:transparent;">
        <svg id="hamburgerIcon" width="18" height="14" viewBox="0 0 18 14" fill="none">
          <rect y="0" width="18" height="2" rx="1" fill="#f5f2ea"/>
          <rect y="6" width="18" height="2" rx="1" fill="#f5f2ea"/>
          <rect y="12" width="18" height="2" rx="1" fill="#f5f2ea"/>
        </svg>
      </button>
    </div>

    <!-- MOBILE NAV DROPDOWN -->
    <div id="mobileNavPanel" class="glass-pill mobile-nav-panel">
      <a href="#home" class="nav-link" onclick="toggleMobileNav()" style="display:block; padding:14px 20px; color:#f5f2ea;">HOME</a>
      <a href="#work" class="nav-link" onclick="toggleMobileNav()" style="display:block; padding:14px 20px; color:#d8d4c9;">WORK</a>
      <a href="#about" class="nav-link" onclick="toggleMobileNav()" style="display:block; padding:14px 20px; color:#d8d4c9;">ABOUT</a>
      <a href="#contact" class="nav-link" onclick="toggleMobileNav()" style="display:block; padding:14px 20px; color:#d8d4c9;">CONTACT</a>
    </div>

    <!-- HERO -->
    <div id="home" class="hero-section" style="position:relative; overflow:hidden; border-bottom:1px solid #221f1c; background:
        radial-gradient(ellipse 900px 640px at 76% 22%, rgba(217,138,61,0.14), transparent 60%),
        linear-gradient(180deg, #17140f 0%, #0e0d0c 70%);">

      <div style="position:absolute; inset:0; opacity:0.45; pointer-events:none; background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 3px 3px;"></div>
      ${heroMediaHtml(c)}
      <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(14,13,12,0.25) 0%, rgba(14,13,12,0.35) 55%, rgba(14,13,12,0.92) 100%); pointer-events:none;"></div>

      <div class="hero-ticker-band" style="position:absolute; left:0; right:0; bottom:0; height:34%; min-height:150px; overflow:hidden; pointer-events:none; display:flex; align-items:center; background:linear-gradient(180deg, transparent, rgba(14,13,12,0.55) 60%);">
        <div class="hero-ticker-track" style="display:flex; align-items:center; white-space:nowrap; will-change:transform;">
          ${Array(4).fill(`<span class="glass-text-ticker hero-ticker-text" style="font-family:'Anton',sans-serif; font-size:clamp(64px,13vw,220px); line-height:1; padding:0 40px;">VINFILM STUDIO CREATES FILMS, STORIES, AND VISUAL EXPERIENCES</span>`).join('')}
        </div>
      </div>

      <div class="hero-foreground" style="position:relative; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:0 clamp(24px,4vw,56px) 300px;">
        <div style="font-family:'Anton',sans-serif; font-size:14px; letter-spacing:5px; color:var(--accent); margin-bottom:24px;">${esc(c.heroEyebrow)}</div>
        <h1 style="margin:0; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(40px,5.6vw,72px); line-height:1.2; letter-spacing:-1px; color:#f5f2ea; max-width:760px;">${esc(c.heroHeadline)}</h1>
        <p style="margin:26px 0 0; font-size:17px; line-height:1.75; color:#bdb8ac; font-weight:400; max-width:560px;">${esc(c.heroSub)}</p>
      </div>
    </div>

    <!-- WORK -->
    <div id="work" style="padding:130px clamp(24px,4vw,56px) 110px; border-bottom:1px solid #201f1d;">
      <div class="work-head-row" style="display:flex; align-items:flex-start; justify-content:space-between; gap:40px; flex-wrap:wrap; margin-bottom:52px;">
        <div>
          <h2 style="margin:0 0 18px; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(32px,4vw,46px); color:#f5f2ea;">최근 작업</h2>
          <div style="width:64px; height:2px; background:#3a3733;"></div>
        </div>
        <div style="max-width:420px; display:flex; flex-direction:column; gap:14px;">
          <p style="margin:0; font-size:15px; line-height:1.75; color:#a8a49b;">${esc(c.workIntro)}</p>
        </div>
      </div>

      ${groupWorkItems(c.workItems).map(workCategoryHtml).join('')}
    </div>

    <!-- WORK LIGHTBOX -->
    <div id="workLightbox" class="work-lightbox" onclick="if(event.target===this) closeWorkLightbox()">
      <button class="work-lightbox-close" onclick="closeWorkLightbox()">✕</button>
      <div id="workLightboxInner" class="work-lightbox-inner"></div>
    </div>

    <!-- WHAT WE DO -->
    <div id="about" style="position:relative; padding:120px clamp(24px,4vw,56px); overflow:hidden; background:linear-gradient(160deg, #b8511f 0%, #963f19 100%);">
      <div style="position:absolute; inset:0; opacity:0.5; pointer-events:none; background-image: radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 3px 3px;"></div>
      <div style="position:absolute; width:640px; height:640px; border-radius:50%; background:rgba(255,255,255,0.05); left:-180px; bottom:-260px;"></div>
      <div style="position:absolute; width:420px; height:420px; border-radius:50%; background:rgba(0,0,0,0.10); right:-120px; top:-160px;"></div>

      <div style="position:relative; display:flex; gap:60px; flex-wrap:wrap; justify-content:space-between;">
        <h2 style="margin:0; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(38px,5vw,58px); line-height:1.15; color:#f5f2ea; max-width:420px;">무엇을<br/>만드나요?</h2>

        <div style="flex:1 1 460px; max-width:560px; background:rgba(14,13,12,0.32); border:1px solid rgba(245,242,234,0.18); border-radius:4px; padding:8px 28px;">
          ${['인터뷰 촬영','내레이션 디렉팅','편집 · 후반작업','브랜디드 콘텐츠'].map((label, i, arr) => `
          <div class="acc-row" style="display:flex; align-items:center; justify-content:space-between; padding:22px 4px; ${i===arr.length-1 ? 'border-bottom:none;' : ''}">
            <span style="font-family:'Anton',sans-serif; font-size:15px; letter-spacing:1px; color:#f5f2ea;">${esc(label)}</span>
            <span class="acc-plus" style="width:16px; height:16px; position:relative; flex:0 0 auto;">
              <span style="position:absolute; left:0; top:50%; width:100%; height:2px; background:#f5f2ea; transform:translateY(-50%);"></span>
              <span style="position:absolute; top:0; left:50%; height:100%; width:2px; background:#f5f2ea; transform:translateX(-50%);"></span>
            </span>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- CONTACT -->
    <div class="contact-row" id="contact" style="padding:130px clamp(24px,4vw,56px); display:flex; gap:60px; flex-wrap:wrap; border-bottom:1px solid #201f1d;">
      <div style="flex:1 1 420px; max-width:520px;">
        <h2 style="margin:0 0 10px; font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(30px,3.6vw,42px); line-height:1.2; color:#f5f2ea;">궁금한 게 있으신가요?</h2>

function toggleMobileNav() {
  document.getElementById('mobileNavPanel').classList.toggle('open');
}

/* Firestore 로딩 중엔 기본값(플레이스홀더)을 먼저 보여주지 않는다 —
   실제 콘텐츠가 준비되면(또는 타임아웃 시 기본값으로) 딱 한 번만 그린다. */
/* Firestore가 느릴 땐 기본값을 "임시로" 보여주되, 실제 데이터가
   나중에 도착하면 언제든 다시 그려서 기본값에 영구히 멈추지 않게 한다. */
let realDataLoaded = false;
function showFade() { requestAnimationFrame(() => { document.getElementById('root').style.opacity = '1'; }); }
function renderReal(c) {
  realDataLoaded = true;
  render(c);
  showFade();
}
const fallbackTimer = setTimeout(() => {
  if (!realDataLoaded) { render(DEFAULT_CONTENT); showFade(); }
}, 1800);

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  db.collection('siteContent').doc('home').get().then(doc => {
    clearTimeout(fallbackTimer);
    if (doc.exists) {
      const data = doc.data();
      const merged = { ...DEFAULT_CONTENT, ...data };
      if (!Array.isArray(merged.workItems)) merged.workItems = DEFAULT_CONTENT.workItems;
      renderReal(merged);
    } else {
      renderReal(DEFAULT_CONTENT);
    }
  }).catch(err => { console.warn('site content load failed, showing defaults', err); renderReal(DEFAULT_CONTENT); });
} catch (e) {
  console.warn('Firebase 초기화 실패, 기본 콘텐츠로 표시합니다.', e);
  renderReal(DEFAULT_CONTENT);
}
</script>
