<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VINFILM STUDIO</title>
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  :root { --accent: #d98a3d; --bg: #0e0d0c; --fg: #f5f2ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { color: var(--fg); font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { opacity: 0.75; }
  ::selection { background: var(--accent); color: var(--bg); }
  img, video { max-width: 100%; }
  html, body { touch-action: manipulation; }
  #root { opacity: 0; transition: opacity .35s ease; }
  @keyframes hero-ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .hero-ticker-track { animation: hero-ticker-scroll 240s linear infinite; }

  .nav-link { font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px; transition: all .2s ease; }
  .nav-link:hover { color: var(--fg) !important; background: rgba(255,255,255,0.14); }

  .glass-pill {
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 8px rgba(0,0,0,0.15), 0 6px 20px rgba(0,0,0,0.25);
  }
  .nav-hamburger { display: none; border-radius: 999px; }
  .mobile-nav-panel {
    display: none;
    position: fixed; top: 66px; right: 16px; left: auto; width: 85px; z-index: 49;
    max-height: 0; overflow: hidden;
    transition: max-height .35s ease, opacity .3s ease;
    opacity: 0;
    border-radius: 20px;
  }
  .mobile-nav-panel.open { max-height: 320px; opacity: 1; }
  .mobile-nav-panel .nav-link { font-size: 16px !important; padding: 14px 10px !important; text-align: center; }
  .mobile-nav-panel .nav-link:hover { background: rgba(255,255,255,0.1); }
  @media (max-width: 720px) {
    .mobile-nav-panel { display: block; }
  }
  .glass-text {
    color: #f5f2ea;
    background: linear-gradient(100deg, #9c988e 25%, #ffffff 47%, #ffffff 53%, #9c988e 75%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 1px 1px rgba(255,255,255,0.2);
    animation: glass-shine 5s ease-in-out infinite;
  }
  @keyframes glass-shine {
    0%, 15% { background-position: 200% 0; }
    85%, 100% { background-position: -200% 0; }
  }
  .glass-text-ticker {
    color: #f5f2ea;
    background: linear-gradient(180deg, #ffffff 0%, #d8d4c9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 1px 1px rgba(255,255,255,0.25);
  }

  .grid-cell { position:relative; overflow:hidden; cursor:pointer; display:block; background-size:cover; background-position:center; }
  .grid-cell .cell-img { position:absolute; inset:0; transition: transform .5s ease; background-size:cover; background-position:center; }
  .grid-cell:hover .cell-img { transform: scale(1.06); }
  .grid-cell .cell-caption { position:absolute; left:0; right:0; bottom:0; padding:22px 24px; background:linear-gradient(180deg, transparent, rgba(0,0,0,0.82) 78%); opacity:0; transform:translateY(8px); transition: all .3s ease; }
  .grid-cell:hover .cell-caption { opacity:1; transform:translateY(0); }
  .cell-play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:42px; height:42px; border-radius:50%; background:rgba(245,242,234,0.92); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .25s ease; pointer-events:none; }
  .grid-cell:hover .cell-play { opacity:1; }
  .work-category-row { scrollbar-width: thin; }
  .work-category-row::-webkit-scrollbar { height: 6px; }
  .work-category-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .work-lightbox { display:none; position:fixed; inset:0; background:rgba(6,5,4,0.94); z-index:200; align-items:center; justify-content:center; padding:16px; }
  .work-lightbox.open { display:flex; }
  .work-lightbox-inner { width:min(96vw, 96vh * 16 / 9); aspect-ratio:16/9; background:#000; }
  .work-lightbox-close { position:absolute; top:24px; right:28px; background:none; border:none; color:#f5f2ea; font-size:28px; cursor:pointer; line-height:1; }

  .acc-row { border-bottom:1px solid rgba(245,242,234,0.25); transition: background .2s ease; }
  .acc-row:hover { background: rgba(245,242,234,0.06); }
  .acc-arrow { transition: transform .25s ease; }
  .acc-row:hover .acc-arrow { transform: translate(3px,-3px); }

  .reel-fab { transition: transform .2s ease; }
  .reel-fab:hover { transform: scale(1.08); }

  .subscribe-btn:hover { background:#f5f2ea; color:#0e0d0c; }

  .hero-section { height: 820px; }

  @media (max-width: 720px) {
    .footer-row, .contact-row, .work-head-row { flex-direction: column !important; }

    .hero-section { height: 70vh; min-height: 420px; }
    .hero-foreground { padding-bottom: 190px !important; }
    .hero-ticker-band { height: 30% !important; min-height: 120px !important; }
    .hero-ticker-text { font-size: 56px !important; padding: 0 24px !important; }
    .hero-ticker-track { animation-duration: 110s !important; }

    .nav-bar { padding: 12px 16px !important; }
    .nav-logo-pill { padding: 7px 12px 7px 10px !important; gap: 6px !important; }
    .nav-logo-text { font-size: 13px !important; letter-spacing: 0.5px !important; }
    .nav-menu-pill { display: none !important; }
    .nav-hamburger { display: flex !important; }
  }

  .editable { outline: 1px dashed rgba(217,138,61,0.55); outline-offset: 3px; cursor: text; border-radius: 2px; }
  .editable:hover { outline-color: rgba(217,138,61,0.9); background: rgba(217,138,61,0.06); }
  .editable:focus { outline: 2px solid var(--accent); background: rgba(217,138,61,0.1); }
  .edit-cell-tools { position:absolute; top:6px; right:6px; z-index:5; display:flex; gap:6px; }
  .edit-cell-btn { width:26px; height:26px; border-radius:50%; border:none; background:rgba(14,13,12,0.82); color:#f5f2ea; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }
  .edit-cell-btn:hover { background:var(--accent); color:#0e0d0c; }
  .edit-toolbar { position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:300; display:flex; align-items:center; gap:10px; background:rgba(14,13,12,0.94); border:1px solid rgba(245,242,234,0.18); border-radius:999px; padding:10px 10px 10px 18px; box-shadow:0 10px 30px rgba(0,0,0,0.45); flex-wrap:wrap; justify-content:center; max-width:94vw; }
  .edit-toolbar span.label { font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px; color:var(--accent); }
  .edit-toolbar button { font-family:'Noto Sans KR',sans-serif; font-size:13px; border-radius:999px; padding:9px 16px; cursor:pointer; border:1px solid rgba(245,242,234,0.25); background:transparent; color:#f5f2ea; }
  .edit-toolbar button.primary { background:var(--accent); border-color:var(--accent); color:#0e0d0c; font-weight:700; }
  .edit-toolbar button:hover { opacity:0.82; }
  .edit-panel { position:fixed; right:20px; bottom:90px; z-index:300; background:rgba(14,13,12,0.96); border:1px solid rgba(245,242,234,0.18); border-radius:14px; padding:18px 20px; width:240px; box-shadow:0 10px 30px rgba(0,0,0,0.45); display:none; }
  .edit-panel.open { display:block; }
  .edit-panel h4 { margin:0 0 14px; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:1px; color:var(--accent); }
  .edit-panel label { display:block; font-size:12px; color:#c7c2b6; margin:12px 0 4px; }
  .edit-panel input[type=range] { width:100%; }
  .edit-login-overlay { position:fixed; inset:0; z-index:400; background:rgba(6,5,4,0.94); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
  .edit-login-overlay button { font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px; padding:14px 26px; border-radius:999px; background:var(--accent); border:none; color:#0e0d0c; cursor:pointer; }
  .edit-toast { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:301; background:var(--accent); color:#0e0d0c; font-weight:700; font-size:13px; padding:10px 20px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .edit-toast.show { opacity:1; }
</style>
</head>
<body>
<div id="root"></div>

<div id="editLoginOverlay" class="edit-login-overlay" style="display:none;">
  <div style="font-family:'Anton',sans-serif; font-size:18px; letter-spacing:1px; color:#f5f2ea;">관리자 로그인이 필요해요</div>
  <button onclick="editSignIn()">Google로 로그인</button>
</div>

<div id="editToolbar" class="edit-toolbar" style="display:none;">
  <span class="label">편집 모드</span>
  <button onclick="toggleEditPanel()">크기 조절</button>
  <button class="primary" onclick="saveEdits()">저장</button>
  <button onclick="exitEditMode()">닫기</button>
</div>

<div id="editPanel" class="edit-panel">
  <h4>크기 조절</h4>
  <label>헤드라인 크기</label>
  <input type="range" min="32" max="96" id="rngHeroHeadline" oninput="updateStyleVar('heroHeadlineSize', this.value)">
  <label>최근작업 제목 크기</label>
  <input type="range" min="24" max="64" id="rngWorkTitle" oninput="updateStyleVar('workTitleSize', this.value)">
  <label>작업 카드 제목 크기</label>
  <input type="range" min="11" max="22" id="rngCellTitle" oninput="updateStyleVar('workCellTitleSize', this.value)">
  <label>썸네일 크기</label>
  <input type="range" min="160" max="420" id="rngThumbW" oninput="updateStyleVar('workThumbW', this.value)">
</div>

<div id="editToast" class="edit-toast">저장됐어요</div>

<script>
'use strict';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAVJ6ZZ6L-3RtgoYe2dDSn_lCHXv3CeBGc",
  authDomain: "vinfilm-studio-app.firebaseapp.com",
  projectId: "vinfilm-studio-app",
  storageBucket: "vinfilm-studio-app.firebasestorage.app",
  messagingSenderId: "1072224922970",
  appId: "1:1072224922970:web:bb2cf2544b1c92a7211763",
};
const OWNER_EMAIL = 'kj0010735@gmail.com';

const DEFAULT_CONTENT = {
  heroVideoUrl: '',
  heroEyebrow: 'VIDEO PRODUCTION STUDIO',
  heroHeadline: '[헤드라인 카피를 넣어주세요]',
  heroSub: '인터뷰와 내레이션을 중심으로, 사람의 목소리와 표정을 영상으로 옮기는 곳, VINFILM STUDIO입니다.',
  workSectionTitle: '최근 작업',
  workIntro: '교육·브랜드 콘텐츠를 중심으로 진행한 최신 프로젝트입니다. 매 촬영이 새로운 이야기를 만드는 기회였습니다.',
  workItems: [
    { category: '인터뷰 콘텐츠', title: '삼둥이 인터뷰', client: '에나스쿨', year: '2026', thumbUrl: '', videoUrl: '' },
    { category: '내레이션 콘텐츠', title: 'EF 영어능력지수 내레이션 시리즈', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
    { category: '인터뷰 콘텐츠', title: '대치동 학습 습관 인터뷰', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
    { category: '내레이션 콘텐츠', title: '영어 말하기 유창성 다큐', client: '웅진컴퍼니', year: '2026', thumbUrl: '', videoUrl: '' },
  ],
  contactEmail: '',
  contactPhone: '',
  contactAddress: '',
  instagramUrl: '',
  vimeoUrl: '',
  styleVars: { heroHeadlineSize: 72, workTitleSize: 46, workCellTitleSize: 15, workThumbW: 280 },
};

const PLACEHOLDER_GRADIENTS = [
  'linear-gradient(135deg, #3a2f22, #17130d)',
  'linear-gradient(135deg, #23292c, #121517)',
  'linear-gradient(135deg, #332822, #16110d)',
  'linear-gradient(135deg, #262b23, #131611)',
];

let EDIT_MODE = false;
let currentContent = null;

const SERVICES = [
  { id: 'interview', label: '인터뷰' },
  { id: 'sketch', label: '스케치 영상' },
  { id: 'mv', label: '뮤직비디오' },
  { id: 'youtube', label: '유튜브 콘텐츠' },
];

function enhanceThumbnails(c) {
  (c.workItems || []).forEach((item, idx) => {
    if (item.thumbUrl) return;
    const v = parseVideoUrl(item.videoUrl);
    if (!v || v.type !== 'vimeo') return;
    fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent('https://vimeo.com/' + v.id)}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data || !data.thumbnail_url) return;
        const cell = document.getElementById('work-cell-' + idx);
        if (cell) cell.querySelector('.cell-img').style.backgroundImage = `url('${data.thumbnail_url}')`;
      })
      .catch(() => {});
  });
}
function setCssVars(vars) {
  const v = { ...DEFAULT_CONTENT.styleVars, ...(vars || {}) };
  const root = document.documentElement.style;
  root.setProperty('--hero-headline-size', v.heroHeadlineSize + 'px');
  root.setProperty('--work-title-size', v.workTitleSize + 'px');
  root.setProperty('--work-cell-title-size', v.workCellTitleSize + 'px');
  root.setProperty('--work-thumb-w', v.workThumbW + 'px');
}

function autoThumbUrl(item) {
  if (item.thumbUrl) return item.thumbUrl;
  const v = parseVideoUrl(item.videoUrl);
  if (v && v.type === 'youtube') return `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
  return '';
}
function workCellHtml(item) {
  const i = item.__i;
  const thumb = autoThumbUrl(item);
  const bg = thumb ? `background-image:url('${esc(thumb)}');` : `background:${PLACEHOLDER_GRADIENTS[i % PLACEHOLDER_GRADIENTS.length]};`;
  const clickAttr = (item.videoUrl && !EDIT_MODE) ? `onclick='openWorkLightbox("${esc(item.videoUrl)}")'` : '';
  return `
    <div class="grid-cell" id="work-cell-${i}" ${clickAttr} style="flex:0 0 var(--work-thumb-w, 280px); aspect-ratio:16/9; border-radius:2px;">
      <div class="cell-img" style="${bg}"></div>
      ${item.videoUrl && !EDIT_MODE ? `<div class="cell-play"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 4L19 12L6 20V4Z" fill="#0e0d0c"/></svg></div>` : ''}
      ${EDIT_MODE ? `
      <div class="edit-cell-tools">
        <button class="edit-cell-btn" title="영상/썸네일 링크 수정" onclick="event.stopPropagation(); editItemLink(${i})">✎</button>
        <button class="edit-cell-btn" title="삭제" onclick="event.stopPropagation(); removeWorkItemInline(${i})">✕</button>
      </div>` : ''}
      <div class="cell-caption" style="${EDIT_MODE ? 'opacity:1; transform:none; pointer-events:auto;' : ''}">
        <div class="${EDIT_MODE ? 'editable' : ''}" ${EDIT_MODE ? `contenteditable="true" data-item-field="title" data-item-idx="${i}"` : ''} style="font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:var(--work-cell-title-size, 15px); color:#f5f2ea;">${esc(item.title)}</div>
        <div style="font-size:11.5px; color:#c7c2b6; margin-top:4px; display:flex; gap:4px;">
          <span class="${EDIT_MODE ? 'editable' : ''}" ${EDIT_MODE ? `contenteditable="true" data-item-field="client" data-item-idx="${i}"` : ''}>${esc(item.client)}</span>
          ${EDIT_MODE ? '<span>·</span>' : (item.client && item.year ? '<span>·</span>' : '')}
          <span class="${EDIT_MODE ? 'editable' : ''}" ${EDIT_MODE ? `contenteditable="true" data-item-field="year" data-item-idx="${i}"` : ''}>${esc(item.year)}</span>
        </div>
      </div>
    </div>`;
}
function groupWorkItems(items) {
  const order = []; const map = {};
  items.forEach((it, idx) => {
    const cat = (it.category || '').trim() || '작업';
    if (!map[cat]) { map[cat] = []; order.push(cat); }
    map[cat].push({ ...it, __i: idx });
  });
  return order.map(cat => ({ category: cat, items: map[cat] }));
}
function workCategoryHtml(group) {
  const idxList = group.items.map(it => it.__i).join(',');
  return `
    <div style="margin-bottom:44px;">
      <h3 class="${EDIT_MODE ? 'editable' : ''}" ${EDIT_MODE ? `contenteditable="true" data-category-group="${idxList}"` : ''} style="margin:0 0 18px; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:2px; color:var(--accent); text-transform:uppercase; display:inline-block;">${esc(group.category)}</h3>
      <div class="work-category-row" style="display:flex; gap:14px; overflow-x:auto;">
        ${group.items.map(workCellHtml).join('')}
        ${EDIT_MODE ? `<button data-add-category="${esc(group.category)}" style="flex:0 0 var(--work-thumb-w, 280px); aspect-ratio:16/9; border-radius:2px; border:1px dashed rgba(245,242,234,0.35); background:transparent; color:#a8a49b; cursor:pointer; font-size:13px; font-family:'Noto Sans KR',sans-serif;">+ 이 카테고리에 작업 추가</button>` : ''}
      </div>
    </div>`;
}
/* 유튜브는 공식 IFrame Player API로 띄운다 — 컨트롤 등 기본 UI는 그대로 두고,
   가능하면 최고화질(4K)로 재생을 시도한다.
   (유튜브가 화질을 자동으로 조절해서 100% 강제되진 않을 수 있음) */
let ytApiReady = false;
let ytPendingCreate = null;
let ytPlayer = null;
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  if (ytPendingCreate) { const fn = ytPendingCreate; ytPendingCreate = null; fn(); }
};

function openWorkLightbox(url) {
  const v = parseVideoUrl(url);
  if (!v) return;
  document.getElementById('workLightbox').classList.add('open');
  if (v.type === 'youtube') {
    document.getElementById('workLightboxInner').innerHTML = '<div id="ytPlayerMount" style="width:100%;height:100%;"></div>';
    const createPlayer = () => {
      ytPlayer = new YT.Player('ytPlayerMount', {
        videoId: v.id,
        playerVars: { autoplay: 1, playsinline: 1 },
        events: {
          onReady: (e) => {
            try { e.target.setPlaybackQuality('hd2160'); } catch (err) {}
            e.target.playVideo();
          }
        }
      });
    };
    if (ytApiReady && window.YT && window.YT.Player) createPlayer();
    else ytPendingCreate = createPlayer;
  } else if (v.type === 'vimeo') {
    document.getElementById('workLightboxInner').innerHTML = `<iframe src="https://player.vimeo.com/video/${esc(v.id)}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
  } else {
    document.getElementById('workLightboxInner').innerHTML = `<video src="${esc(v.url)}" controls autoplay style="width:100%;height:100%;"></video>`;
  }
}
function closeWorkLightbox() {
  document.getElementById('workLightbox').classList.remove('open');
  if (ytPlayer && ytPlayer.destroy) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
  document.getElementById('workLightboxInner').innerHTML = '';
}

function parseVideoUrl(url) {
  if (!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  if (m) return { type: 'youtube', id: m[1] };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { type: 'vimeo', id: m[1] };
  return { type: 'file', url };
}
function heroMediaHtml(c) {
  const v = parseVideoUrl(c.heroVideoUrl);
  if (v && v.type === 'youtube') {
    return `<iframe src="https://www.youtube.com/embed/${esc(v.id)}?autoplay=1&mute=1&loop=1&playlist=${esc(v.id)}&controls=0&modestbranding=1&playsinline=1&rel=0" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.9; pointer-events:none; border:none;" allow="autoplay; encrypted-media"></iframe>`;
  }
  if (v && v.type === 'vimeo') {
    return `<iframe src="https://player.vimeo.com/video/${esc(v.id)}?autoplay=1&muted=1&loop=1&background=1" style="position:absolute; inset:0; width:100%; height:100%; opacity:0.9; pointer-events:none; border:none;" allow="autoplay; encrypted-media"></iframe>`;
  }
  if (v && v.type === 'file') {
    return `<video autoplay muted loop playsinline preload="auto" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.9;"><source src="${esc(v.url)}"></video>`;
  }
  return '';
}

/* ---- 페이지 안에서 바로 수정하는 편집 모드 (?edit=1, 관리자 Google 로그인 필요) ---- */
const EDIT_REQUESTED = new URLSearchParams(location.search).get('edit') === '1';
let db = null;
let ownerConfirmed = false;

function reRenderEdit() {
  render(currentContent);
  setCssVars(currentContent.styleVars);
  enhanceThumbnails(currentContent);
  wireEditMode();
}
function wireEditMode() {
  if (!EDIT_MODE) return;
  document.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('blur', () => { currentContent[el.dataset.field] = el.textContent.trim(); });
  });
  document.querySelectorAll('[data-item-field]').forEach(el => {
    el.addEventListener('blur', () => {
      const idx = Number(el.dataset.itemIdx);
      currentContent.workItems[idx][el.dataset.itemField] = el.textContent.trim();
    });
  });
  document.querySelectorAll('[data-category-group]').forEach(el => {
    el.addEventListener('blur', () => {
      const idxs = el.dataset.categoryGroup.split(',').map(Number);
      const newCat = el.textContent.trim();
      idxs.forEach(i => { currentContent.workItems[i].category = newCat; });
    });
  });
  document.querySelectorAll('[data-add-category]').forEach(el => {
    el.addEventListener('click', () => addWorkItemInline(el.dataset.addCategory));
  });
  document.querySelectorAll('.editable').forEach(el => {
    const multiline = el.dataset.field === 'heroSub' || el.dataset.field === 'workIntro';
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && !multiline) { e.preventDefault(); el.blur(); } });
  });
}
function editItemLink(idx) {
  const item = currentContent.workItems[idx];
  const url = prompt('영상 URL (유튜브·Vimeo·mp4)', item.videoUrl || '');
  if (url === null) return;
  item.videoUrl = url.trim();
  const thumb = prompt('썸네일 이미지 URL (비워두면 영상에서 자동으로 가져와요)', item.thumbUrl || '');
  if (thumb !== null) item.thumbUrl = thumb.trim();
  reRenderEdit();
}
function removeWorkItemInline(idx) {
  if (!confirm('이 작업을 삭제할까요?')) return;
  currentContent.workItems.splice(idx, 1);
  reRenderEdit();
}
function addWorkItemInline(category) {
  currentContent.workItems.push({ category: category || '작업', title: '새 작업', client: '', year: '', thumbUrl: '', videoUrl: '' });
  reRenderEdit();
}
function addNewCategory() {
  const name = prompt('새 카테고리 이름 (예: 브랜드 스케치 영상)');
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  addWorkItemInline(trimmed);
}
function editFooterLink(field) {
  const url = prompt(field === 'instagramUrl' ? 'Instagram URL' : 'Vimeo URL', currentContent[field] || '');
  if (url === null) return;
  currentContent[field] = url.trim();
  reRenderEdit();
}
function editHeroVideo() {
  const url = prompt('배경 영상 URL (유튜브·Vimeo·mp4)', currentContent.heroVideoUrl || '');
  if (url === null) return;
  currentContent.heroVideoUrl = url.trim();
  reRenderEdit();
}
function updateStyleVar(key, value) {
  currentContent.styleVars = { ...DEFAULT_CONTENT.styleVars, ...(currentContent.styleVars || {}), [key]: Number(value) };
  setCssVars(currentContent.styleVars);
}
function toggleEditPanel() {
  document.getElementById('editPanel').classList.toggle('open');
}
function showEditToast(msg) {
  const t = document.getElementById('editToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function saveEdits() {
  if (!db) return;
  db.collection('siteContent').doc('home').set(currentContent)
    .then(() => showEditToast('저장됐어요'))
    .catch(err => { console.error(err); showEditToast('저장 실패: ' + err.message); });
}
function exitEditMode() { location.href = location.pathname; }
function editSignIn() {
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(err => alert('로그인 실패: ' + err.message));
}
function tryEnterEditMode() {
  if (!EDIT_REQUESTED || !ownerConfirmed || !currentContent || EDIT_MODE) return;
  EDIT_MODE = true;
  document.getElementById('editLoginOverlay').style.display = 'none';
  document.getElementById('editToolbar').style.display = 'flex';
  reRenderEdit();
  const sv = { ...DEFAULT_CONTENT.styleVars, ...(currentContent.styleVars || {}) };
  document.getElementById('rngHeroHeadline').value = sv.heroHeadlineSize;
  document.getElementById('rngWorkTitle').value = sv.workTitleSize;
  document.getElementById('rngCellTitle').value = sv.workCellTitleSize;
  document.getElementById('rngThumbW').value = sv.workThumbW;
}

/* Firestore 로딩 중엔 기본값(플레이스홀더)을 먼저 보여주지 않는다 —
   실제 콘텐츠가 준비되면(또는 타임아웃 시 기본값으로) 딱 한 번만 그린다. */
/* Firestore가 느릴 땐 기본값을 "임시로" 보여주되, 실제 데이터가
   나중에 도착하면 언제든 다시 그려서 기본값에 영구히 멈추지 않게 한다. */
let realDataLoaded = false;
function showFade() { requestAnimationFrame(() => { document.getElementById('root').style.opacity = '1'; }); }
function renderReal(c) {
  realDataLoaded = true;
  currentContent = c;
  render(c);
  setCssVars(c.styleVars);
  enhanceThumbnails(c);
  if (EDIT_MODE) wireEditMode();
  showFade();
  tryEnterEditMode();
}
const fallbackTimer = setTimeout(() => {
  if (!realDataLoaded) {
    currentContent = DEFAULT_CONTENT;
    render(DEFAULT_CONTENT);
    setCssVars(DEFAULT_CONTENT.styleVars);
    showFade();
    tryEnterEditMode();
  }
}, 1800);

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  db.collection('siteContent').doc('home').get().then(doc => {
    clearTimeout(fallbackTimer);
    if (doc.exists) {
      const data = doc.data();
      const merged = { ...DEFAULT_CONTENT, ...data };
      if (!Array.isArray(merged.workItems)) merged.workItems = DEFAULT_CONTENT.workItems;
      merged.styleVars = { ...DEFAULT_CONTENT.styleVars, ...(merged.styleVars || {}) };
      renderReal(merged);
    } else {
      renderReal(DEFAULT_CONTENT);
    }
  }).catch(err => { console.warn('site content load failed, showing defaults', err); renderReal(DEFAULT_CONTENT); });

  if (EDIT_REQUESTED) {
    firebase.auth().onAuthStateChanged(user => {
      if (user && user.email === OWNER_EMAIL) {
        ownerConfirmed = true;
        tryEnterEditMode();
      } else {
        ownerConfirmed = false;
        EDIT_MODE = false;
        document.getElementById('editLoginOverlay').style.display = 'flex';
        document.getElementById('editToolbar').style.display = 'none';
      }
    });
  }
} catch (e) {
  console.warn('Firebase 초기화 실패, 기본 콘텐츠로 표시합니다.', e);
  renderReal(DEFAULT_CONTENT);
}
