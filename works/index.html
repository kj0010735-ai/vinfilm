      const iconDomain = (fd.get('iconDomain') || '').toString().trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
      if (S.shortcut.editingId) saveShortcuts(shortcuts.map(x => x.id === S.shortcut.editingId ? { ...x, name, url, iconDomain } : x));
      else saveShortcuts([...shortcuts, { id: uid(), name, url, iconDomain }]);
      S.shortcut.modalOpen = false; S.shortcut.editingId = null;
      render();
    } else if (form.matches('[data-form-role="notice-form"]')) {
      if (GUEST_MODE) return;
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim(); if (!title) return;
      const body = (fd.get('body') || '').toString();
      const target = (fd.get('target') || 'all').toString();
      const ids = target === 'all' ? collabs.map(x => x.id) : [target];
      const groupId = uid(), at = Date.now();
      saveNotices([...ids.map(cid => ({ id: uid() + '-' + cid.slice(0, 6), groupId, collabId: cid, title, body, createdAt: at })), ...notices]);
      S.notif.compose = false; S.notif.open = true; render();
    } else if (form.matches('[data-form-role="collab-form"]')) {
      if (GUEST_MODE) return;
      const fd = new FormData(form);
      const name = (fd.get('name') || '').toString().trim(); if (!name) return;
      const mode = fd.get('mode') === 'link' ? 'link' : 'login';
      const members = parseEmails(fd.get('members'));
      if (mode === 'login' && !members.length) { S.collab.msg = '구글 로그인 방식은 협업자의 구글 계정 이메일을 넣어야 해요.'; render(); return; }
      const data = { name, mode, members, showEquipment: fd.has('showEquipment') };
      const eid = S.collab.editingId;
      if (eid && eid !== 'new') saveCollabs(collabs.map(x => x.id === eid ? { ...x, ...data, updatedAt: Date.now() } : x));
      else saveCollabs([...collabs, { id: newCollabId(), createdAt: Date.now(), ...data }]);
      S.collab.editingId = null; S.collab.msg = eid && eid !== 'new' ? '저장했어요.' : `${name} 공간을 만들었어요. 공유 프로젝트를 배정한 뒤 "📤 링크 보내기"로 보내세요.`;
      render();
    } else if (form.matches('[data-form-role="quote-biz-form"]')) {
      const fd = new FormData(form);
      const next = {}; BIZ_FIELDS.forEach(f => { next[f.key] = (fd.get(f.key) || '').toString().trim(); });
      if (!next.name) next.name = 'VINFILM STUDIO';
      if (window.__bizPad && !window.__bizPad.isEmpty()) next.signature = window.__bizPad.toDataURL();
      else if (!S.quote.bizSignCleared && biz.signature) next.signature = biz.signature;
      S.quote.bizSignCleared = false;
      saveBiz(next); S.quote.bizOpen = false; if (/사업자 정보|대표 서명/.test(S.quote.msg)) S.quote.msg = '';
      render();
    } else if (form.matches('[data-form-role="song-quick-form"]')) {
      const url = normalizeUrl((new FormData(form).get('url') || '').toString().trim().split(/\s+/)[0] || '');
      const yt = ytIdsIn(url)[0];
      if (!yt) { S.song.msg = '유튜브 링크를 붙여넣어 주세요.'; render(); return; }
      const dup = songs.find(s => ytIdsIn(s.url)[0] === yt);
      if (dup) { S.song.msg = ''; S.song.playId = dup.id; render(); return; }
      S.song.msg = '제목을 불러오는 중…'; render();
      songLookup(url).then(info => {
        const id = uid();
        saveSongs([{ id, createdAt: Date.now(), title: (info && info.title) || '새 노래', artist: (info && info.artist) || '', url: 'https://youtu.be/' + yt, key: '', lyrics: '' }, ...songs]);
        S.song.msg = ''; S.song.editingId = id; S.song.modalOpen = true; // 바로 수정 창을 열어 가사를 붙여넣게 한다
        render();
      });
    } else if (form.matches('[data-form-role="song-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const payload = { title, artist: (fd.get('artist') || '').toString().trim(), url: normalizeUrl((fd.get('url') || '').toString().trim()), key: (fd.get('key') || '').toString().trim(), lyrics: (fd.get('lyrics') || '').toString().replace(/\s+$/, '') };
      const before = songs.find(s => s.id === S.song.editingId);
      if (before && songBlocks(before.lyrics).length !== songBlocks(payload.lyrics).length) payload.secTimes = [];
      const songId = S.song.editingId || uid();
      const file = fd.get('audioFile'); const hasFile = file && typeof file === 'object' && file.size > 0;
      if (fd.get('audioRemove') && before && before.audioPath) { songDeleteAudio(before.audioPath); Object.assign(payload, { audioUrl: '', audioName: '', audioPath: '' }); }
      if (S.song.editingId) saveSongs(songs.map(s => s.id === S.song.editingId ? { ...s, ...payload } : s));
      else saveSongs([{ id: songId, createdAt: Date.now(), ...payload }, ...songs]);
      S.song.modalOpen = false; S.song.editingId = null;
      if (hasFile) songUploadAudio(songId, file, before && before.audioPath);
      render();
    } else if (form.matches('[data-form-role="note-form"]')) {
      const fd = new FormData(form);
      const content = (fd.get('content') || '').toString().trim();
      if (!content) return;
      const title = (fd.get('title') || '').toString().trim();
      if (S.note.editingId) saveNotes(notes.map(n => n.id === S.note.editingId ? { ...n, title, content } : n));
      else saveNotes([...notes, { id: uid(), title, content, color: TASK_COLOR_PALETTE[notes.length % TASK_COLOR_PALETTE.length], createdAt: Date.now() }]);
      S.note.modalOpen = false; S.note.editingId = null;
      render();
    } else if (form.matches('[data-form-role="shoot-form"]')) {
      const fd = new FormData(form);
      const params = paramsFromShootForm(fd);
      if (S.shoot.editingParamsId) {
        saveShoots(shoots.map(s => s.id === S.shoot.editingParamsId ? { ...s, ...params } : s));
        S.shoot.formOpen = false; S.shoot.editingParamsId = null;
        render();
      } else {
        finalizeNewShoot(params, buildRecommendation(params));
      }
    }
  });

  /* keyboard: Enter in category-add input */
  root.addEventListener('keydown', (e) => {
    if (e.target.id === 'newCategoryNameInput' && e.key === 'Enter') {
      e.preventDefault();
      const name = e.target.value.trim();
      if (!name) return;
      if (eqCategories.some(c => c.label === name)) { window.alert('이미 있는 카테고리예요.'); return; }
      saveEqCategories([...eqCategories, { id: `cat-${Date.now()}`, label: name, abbr: name.slice(0, 2), color: CATEGORY_COLOR_PALETTE[eqCategories.length % CATEGORY_COLOR_PALETTE.length] }]);
      render();
    }
  });

  /* drag & drop: equipment photo zone + equipment category re-sort + 패킹 가방 재배치 */
  root.addEventListener('dragover', (e) => {
    const zone = e.target.closest('[data-dropzone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('drag-over');
    if (zone.dataset.dropzone === 'eq-cat') e.dataTransfer.dropEffect = e.altKey ? 'copy' : 'move';
  });
  root.addEventListener('dragleave', (e) => {
    const zone = e.target.closest('[data-dropzone]');
    if (!zone) return;
    zone.classList.remove('drag-over');
  });
  root.addEventListener('drop', async (e) => {
    const zone = e.target.closest('[data-dropzone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (zone.dataset.dropzone === 'eq-photo') {
      currentEqPhotoError = '';
      const files = e.dataTransfer.files;
      if (files && files.length > 0) { await handlePhotoFile(files[0]); return; }
      const url = extractDroppedImageUrl(e.dataTransfer);
      if (!url) { currentEqPhotoError = '이미지를 인식하지 못했어요. 이미지 자체를 드래그해줘.'; refreshEqPhotoZone(); return; }
      try { currentEqPhoto = await resizeFromUrl(url); }
      catch (err) { currentEqPhoto = url; currentEqPhotoError = '외부 이미지 링크로 저장했어요. 인터넷이 연결되어 있어야 보여요.'; }
      refreshEqPhotoZone();
    } else if (zone.dataset.dropzone === 'eq-cat') {
      const eqId = e.dataTransfer.getData('application/x-eq-id');
      if (!eqId) return;
      const src = eqById(eqId);
      if (!src) return;
      const targetCat = zone.dataset.catId;
      if (e.altKey) {
        const { id: _oldId, serial: _oldSerial, createdAt: _oldCreated, ...rest } = src;
        saveEqItems([{ ...rest, id: uid(), serial: nextSerial(eqItems), category: targetCat, createdAt: Date.now() }, ...eqItems]);
      } else {
        saveEqItems(eqItems.map(it => it.id === eqId ? { ...it, category: targetCat } : it));
      }
      render();
    } else if (zone.dataset.dropzone === 'pack-bag') {
      const itemId = e.dataTransfer.getData('application/x-pack-id');
      if (!itemId) return;
      const shoot = shoots.find(s => s.id === S.shoot.selectedShootId);
      if (!shoot) return;
      const targetBagId = zone.dataset.bagId === 'none' ? '' : zone.dataset.bagId;
      const overrides = { ...(shoot.bagOverrides || {}), [itemId]: targetBagId };
      saveShoots(shoots.map(s => s.id === shoot.id ? { ...s, bagOverrides: overrides } : s));
      refreshShootPackList();
    } else if (zone.dataset.dropzone === 'proj-row') {
      const draggedId = e.dataTransfer.getData('application/x-proj-row-id');
      const targetId = zone.dataset.id;
      if (!draggedId || draggedId === targetId) return;
      const isShared = S.activeTab === 'shared';
      const list = isShared ? sharedProjItems : projItems;
      const dragged = list.find(p => p.id === draggedId);
      const target = list.find(p => p.id === targetId);
      if (!dragged || !target) return;
      if ((dragged.parentId || null) !== (target.parentId || null)) return;
      const rect = zone.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      const without = list.filter(p => p.id !== draggedId);
      const targetIdx = without.findIndex(p => p.id === targetId);
      const insertAt = before ? targetIdx : targetIdx + 1;
      const next = [...without.slice(0, insertAt), dragged, ...without.slice(insertAt)];
      if (isShared) saveSharedProjItems(next); else saveProjItems(next);
      render();
    }
  });
  root.addEventListener('dragstart', (e) => {
    const eqCard = e.target.closest('[data-drag-eq-id]');
    if (eqCard) { e.dataTransfer.setData('application/x-eq-id', eqCard.dataset.dragEqId); e.dataTransfer.effectAllowed = 'copyMove'; return; }
    const packRow = e.target.closest('[data-drag-pack-id]');
    if (packRow) { e.dataTransfer.setData('application/x-pack-id', packRow.dataset.dragPackId); e.dataTransfer.effectAllowed = 'move'; return; }
    const projRow = e.target.closest('[data-drag-row-id]');
    if (projRow) { e.dataTransfer.setData('application/x-proj-row-id', projRow.dataset.dragRowId); e.dataTransfer.effectAllowed = 'move'; return; }
  });

  /* paste image into equipment modal */
  window.addEventListener('paste', async (e) => {
    if (!S.eq.modalOpen) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) { e.preventDefault(); await handlePhotoFile(file); }
        return;
      }
    }
  });

  /* 프로젝트/공유 프로젝트 하위 드릴다운도 브라우저 뒤로가기로 한 단계씩 빠져나오게 히스토리에 반영 */
  history.replaceState({ projParentId: S.proj.currentParentId || null, sharedParentId: S.shared.currentParentId || null }, '');
  window.addEventListener('popstate', (e) => {
    const state = e.state || {};
    if ('sharedParentId' in state) {
      S.shared.currentParentId = state.sharedParentId || null;
      S.shared.statusFilter = 'all';
      S.shared.search = '';
      S.activeTab = 'shared';
    } else {
      S.proj.currentParentId = state.projParentId || null;
      S.proj.statusFilter = 'all';
      S.proj.search = '';
      S.activeTab = 'projects';
    }
    render();
  });

  /* ⌘B / Ctrl+B: 메모 칸에서 고른 글자를 **굵게**로 감싼다(한 번 더 누르면 풀림). 보기 화면에서 굵은 글씨로 보임 */
  document.addEventListener('keydown', (e) => {
    if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'b' || e.altKey || e.shiftKey) return;
    const t = e.target;
    const rich = t.closest && t.closest('[data-rich]');
    if (rich) { e.preventDefault(); document.execCommand('bold'); richMemoSync(rich); return; }
    if (t.tagName === 'TEXTAREA') {
      e.preventDefault();
      const s = t.selectionStart, en = t.selectionEnd, v = t.value, sel = v.slice(s, en);
      if (s === en) return;
      let next, ns, ne;
      if (v.slice(s - 2, s) === '**' && v.slice(en, en + 2) === '**') { next = v.slice(0, s - 2) + sel + v.slice(en + 2); ns = s - 2; ne = en - 2; }
      else if (/^\*\*[\s\S]*\*\*$/.test(sel)) { next = v.slice(0, s) + sel.slice(2, -2) + v.slice(en); ns = s; ne = en - 4; }
      else { next = v.slice(0, s) + '**' + sel + '**' + v.slice(en); ns = s + 2; ne = en + 2; }
      t.value = next; t.setSelectionRange(ns, ne); t.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (t.isContentEditable) {
      e.preventDefault();
      const sel = window.getSelection(); const txt = sel ? sel.toString() : '';
      if (!txt) return;
      document.execCommand('insertText', false, /^\*\*[\s\S]*\*\*$/.test(txt) ? txt.slice(2, -2) : '**' + txt + '**');
    }
  });

  /* Esc closes whichever modal is open */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    let changed = false;
    if (S.eq.modalOpen) { S.eq.modalOpen = false; S.eq.editingId = null; currentEqPhoto = ''; changed = true; }
    if (S.eq.detailId) { S.eq.detailId = null; changed = true; }
    if (S.eq.categoryModalOpen) { S.eq.categoryModalOpen = false; changed = true; }
    if (S.sched.modalOpen) { S.sched.modalOpen = false; S.sched.editingId = null; changed = true; }
    if (S.sched.detailId) { S.sched.detailId = null; changed = true; }
    if (S.proj.modalOpen) { S.proj.modalOpen = false; S.proj.editingId = null; changed = true; }
    if (S.proj.statusMenu) { S.proj.statusMenu = null; changed = true; }
    if (S.proj.rowMenu) { S.proj.rowMenu = null; changed = true; }
    if (S.settingsOpen) { S.settingsOpen = false; changed = true; }
    if (S.shared.modalOpen) { S.shared.modalOpen = false; S.shared.editingId = null; changed = true; }
    if (S.shared.statusMenu) { S.shared.statusMenu = null; changed = true; }
    if (S.shared.rowMenu) { S.shared.rowMenu = null; changed = true; }
    if (S.shoot.formOpen) { S.shoot.formOpen = false; S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; changed = true; }
    if (S.task.modalOpen) { S.task.modalOpen = false; S.task.editingId = null; changed = true; }
    if (S.note.modalOpen) { S.note.modalOpen = false; S.note.editingId = null; changed = true; }
    if (S.song.modalOpen) { S.song.modalOpen = false; S.song.editingId = null; changed = true; }
    if (S.shortcut.modalOpen) { S.shortcut.modalOpen = false; S.shortcut.editingId = null; changed = true; }
    if (gcal.modalOpen) { gcal.modalOpen = false; changed = true; }
    if (S.moreOpen) { S.moreOpen = false; changed = true; }
    if (gcal.detailId) { gcal.detailId = null; changed = true; }
    if (changed) render();
  });

  initCloudSync();
}

function collabGateHtml(title, msg, withLogin) {
  return `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0e0d0c; color:#f5f2ea; font-family:'Paperozi', -apple-system, 'Malgun Gothic', sans-serif; padding:24px;">
    <div style="width:320px; text-align:center;">
      <div style="font-size:13px; letter-spacing:2px; color:#79766f; margin-bottom:10px;">VINFILM STUDIO</div>
      <h1 style="margin:0 0 12px; font-size:21px;">${title}</h1>
      <p style="margin:0 0 20px; font-size:13.5px; color:#a8a49b; line-height:1.65;">${msg}</p>
      ${withLogin && typeof uaInfo === 'function' && uaInfo().inapp ? (() => { const u = uaInfo(); const here = location.href;
        const href = u.kakao ? `kakaotalk://web/openExternal?url=${encodeURIComponent(here)}` : u.android ? `intent://${here.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end` : '';
        return `<p style="margin:0 0 12px; font-size:13px; color:#e0a63c; line-height:1.6;">${u.kakao ? '카카오톡' : '앱'} 안에서는 Google 로그인이 막혀 있어요.<br>${u.ios ? 'Safari' : 'Chrome'}로 열어서 로그인해 주세요.</p>
          ${href ? `<a href="${href}" style="display:block; background:#2f6fee; color:#fff; border-radius:8px; padding:12px; font-weight:700; font-size:14px; text-decoration:none; margin-bottom:10px;">${u.ios ? 'Safari' : 'Chrome'}로 열기</a>` : `<p style="font-size:12.5px; color:#a8a49b;">오른쪽 ⋯ 메뉴 → 다른 브라우저로 열기</p>`}`; })() : ''}
      ${withLogin ? `<button id="collabLoginBtn" style="width:100%; background:#f5f2ea; color:#0e0d0c; border:none; border-radius:8px; padding:12px; font-weight:700; font-size:14px; cursor:pointer;">Google로 로그인</button>` : ''}
      <div id="collabLoginErr" style="color:#e0796f; font-size:12.5px; margin-top:12px;"></div>

async function collabBoot() {
  const root = document.getElementById('root');
  root.innerHTML = collabGateHtml('공유 작업 공간', '불러오는 중…', false);
  if (typeof firebase === 'undefined' || !firebase.firestore) { root.innerHTML = collabGateHtml('연결할 수 없어요', '인터넷 연결을 확인하고 새로고침해 주세요.', false); return; }
  const db = firebase.firestore();
  const tryGet = async () => { try { const d = await db.collection('collabs').doc(COLLAB_ID).get(); return d.exists ? d.data() : null; } catch (e) { return null; } };
  let started = false;
  const start = (info) => {
    if (started) return; started = true;
    collabInfo = info;
    // 설치한 앱은 /works/로 열리므로 마지막 협업 공간을 기억해 둔다(대표님 계정일 땐 기억 안 함)
    try { const cu = firebase.auth().currentUser; if (!(cu && ADMIN_EMAILS.includes(cu.email))) localStorage.setItem('vinfilm-last-collab', COLLAB_ID); } catch (e) {}
    GUEST_ALLOWED_TABS = ['shared', 'schedule', ...(info.showEquipment ? ['equipment'] : [])];
    const u = firebase.auth().currentUser;
    if (info.mode === 'login' && u) { try { localStorage.setItem(GUEST_NAME_KEY, u.displayName || u.email); } catch (e) {} }
    if (!localStorage.getItem(GUEST_NAME_KEY)) showGuestNameGate(); else bootApp();
  };
  const first = await tryGet();
  if (first) { start(first); return; }
  // 로그인 공간이거나 링크가 끊긴 경우 — 로그인 상태를 보고 다시 시도
  firebase.auth().onAuthStateChanged(async (user) => {
    if (started) return;
    if (user) {
      const info = await tryGet();
      if (info) { start(info); return; }
      root.innerHTML = collabGateHtml('접근 권한이 없어요', `${esc(user.email || '')} 계정은 이 공간에 초대되지 않았어요.<br>초대받은 계정으로 다시 로그인하거나 VINFILM STUDIO에 문의해 주세요.`, true);
    } else {
      root.innerHTML = collabGateHtml('공유 작업 공간', '초대받은 Google 계정으로 로그인해 주세요.<br><small style="color:#79766f">링크로 받은 공간이 열리지 않는다면 링크가 바뀌었을 수 있어요.</small>', true);
    }
    const btn = document.getElementById('collabLoginBtn');
    if (btn) btn.addEventListener('click', async () => {
      try { if (firebase.auth().currentUser) await firebase.auth().signOut(); await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch (err) { document.getElementById('collabLoginErr').textContent = '로그인 실패: ' + (err.message || err); }
    });
  });
}
document.addEventListener('DOMContentLoaded', () => {
  if (COLLAB_MODE) { collabBoot(); return; }
  // 협업자가 설치한 앱을 열면 /works/로 들어온다 → 기억해 둔 협업 공간으로 보낸다(대표님으로 로그인돼 있으면 그대로)
  let lastCollab = ''; try { lastCollab = localStorage.getItem('vinfilm-last-collab') || ''; } catch (e) {}
  if (!GUEST_MODE && /^[0-9a-f]{32}$/.test(lastCollab) && typeof firebase !== 'undefined' && firebase.auth) {
    const unsub = firebase.auth().onAuthStateChanged(user => {
      unsub();
      if (!user || !ADMIN_EMAILS.includes(user.email)) { location.replace('/works/?c=' + lastCollab); return; }
      bootApp();
    });
    return;
  }
  if (GUEST_MODE) {
    if (!localStorage.getItem(GUEST_NAME_KEY)) showGuestNameGate(); else bootApp();
    return;
  }
  if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') { bootApp(); return; }
  let booted = false;
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      if (!booted) { booted = true; bootApp(); }
    } else {
      showLoginGate();
    }
  });
});

  /* ===== 🔔 알림 ===== */
  .d-topbar { display:flex; justify-content:flex-end; margin:-24px 0 6px; min-height:36px; }
  .notif-bell { position:relative; width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
  .notif-bell.on, .notif-bell:hover { border-color:var(--accent); }
  .notif-badge { position:absolute; top:-5px; right:-6px; min-width:18px; height:18px; padding:0 5px; box-sizing:border-box; border-radius:9px; background:#e5484d; color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); }
  .m-top-actions { display:flex; align-items:center; gap:10px; }
  .m-top-actions .notif-bell { width:36px; height:36px; box-shadow:none; background:transparent; border-color:transparent; }
  .notif-backdrop { position:fixed; inset:0; z-index:120; }
  .notif-panel { position:fixed; z-index:121; top:64px; right:24px; width:360px; max-height:min(560px, calc(100vh - 90px)); display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); overflow:hidden; animation:modalIn .2s ease both; }
  .notif-head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
  .notif-head b { font-size:15px; }
  .notif-head button { border:none; background:none; color:var(--accent); font-family:var(--font-body); font-size:12.5px; font-weight:700; cursor:pointer; margin-left:10px; }
  .notif-list { overflow-y:auto; padding:6px; }
  .notif-item { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:none; background:none; padding:10px; border-radius:12px; cursor:pointer; color:var(--text); font-family:var(--font-body); }
  .notif-item:hover { background:var(--surface-hover); }
  .notif-item.unread { background:var(--accent-soft); }
  .notif-ic { font-size:18px; line-height:1.2; flex:none; }
  .notif-txt { flex:1; min-width:0; } .notif-txt b { display:block; font-size:13.5px; font-weight:700; overflow-wrap:anywhere; }
  .notif-txt small { display:block; color:var(--text-dim); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .notif-item em { flex:none; font-style:normal; font-size:11.5px; color:var(--text-faint); }
  .notif-empty { text-align:center; color:var(--text-faint); font-size:13px; padding:26px 0; margin:0; }
  .notif-sent { border-top:1px solid var(--border); padding:8px 12px 12px; max-height:180px; overflow-y:auto; }
  .notif-sub { font-size:11.5px; color:var(--text-faint); font-weight:700; margin:4px 4px 6px; }
  .notif-sent-row { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:6px 4px; }
  .notif-sent-row b { display:block; font-size:13px; } .notif-sent-row small { display:block; font-size:11.5px; color:var(--text-faint); }
  .notif-sent-row button { border:none; background:none; color:var(--text-faint); cursor:pointer; }
  .notice-body { white-space:pre-wrap; font-size:14px; line-height:1.75; overflow-wrap:anywhere; }
  @media (max-width: 720px) {
    .d-topbar { display:none; }
    .notif-panel { top:calc(62px + env(safe-area-inset-top)); left:10px; right:10px; width:auto; max-height:calc(100vh - 150px); }
  }
  .proj-row-pill[data-status-menu-id], .proj-row-pill[data-shared-status-menu-id] { cursor:pointer; transition:filter .15s ease; }
  .proj-row-pill[data-status-menu-id]:hover, .proj-row-pill[data-shared-status-menu-id]:hover { filter:brightness(0.95); box-shadow:0 0 0 2px currentColor inset; }
  /* 기간 일정 */
  .sched-span-seg { margin:0 0 12px; display:inline-flex; }
  .cal-ev.span-mid, .cal-ev.span-end { border-left-style:dotted; }
  .cal-ev.span-mid .cal-ev-time, .cal-ev.span-end .cal-ev-time { display:none; }
  .cal-ev.span-end::after { content:'끝'; margin-left:auto; font-size:10px; color:var(--text-faint); flex:none; }
  .sched-span-lbl { display:block; font-size:11px; color:var(--text-faint); }
  /* 기간 일정을 하나의 막대로: 일정 목록을 칸 폭 끝까지 펴고, 이어지는 쪽 여백·모서리를 없앤다 */
  .cal-evs { margin:0 -6px; }
  .cal-evs > * { margin-left:6px; margin-right:6px; width:auto !important; }
  .cal-evs > .cal-ev.span-start { margin-right:0; border-top-right-radius:0; border-bottom-right-radius:0; }
  .cal-evs > .cal-ev.span-mid { margin-left:0; margin-right:0; border-radius:0; border-left:none; padding-left:10px; }
  .cal-evs > .cal-ev.span-end { margin-left:0; border-top-left-radius:0; border-bottom-left-radius:0; border-left:none; padding-left:10px; }
  .cal-evs > .cal-ev.span-wk { border-left:3px solid var(--ev); border-top-left-radius:6px; border-bottom-left-radius:6px; margin-left:6px; padding-left:7px; }
  .cal-ev.span-quiet .cal-ev-title, .cal-ev.span-quiet .cal-ev-time { visibility:hidden; }
  .cal-ev.span-mid, .cal-ev.span-end { border-left-style:solid; }
  .cal-ev.span-end::after { content:none; }
  .cal-cell.is-outside .cal-ev.span-mid, .cal-cell.is-outside .cal-ev.span-end { opacity:.45; }
  .cal-ev-spacer { visibility:hidden; pointer-events:none; }
  /* 시간 입력 */
  .time-field { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .time-hint { font-size:11.5px; color:var(--accent); min-height:1em; } .time-hint.bad { color:#d9534f; }
  .time-chips { display:flex; flex-wrap:wrap; gap:4px; }
  .time-chip { border:1px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:999px; padding:3px 8px; font-family:var(--font-body); font-size:11.5px; cursor:pointer; }
  .time-chip:hover { border-color:var(--accent); color:var(--accent); }
  .time-field input:disabled ~ .time-chips { opacity:.5; }

  /* ===== 프로젝트 등록/수정 창: 데스크톱에서는 오른쪽에서 나오는 넓은 패널(화면 절반) ===== */
  @media (min-width: 721px) {
    .eq-modal-overlay.is-drawer { justify-content:flex-end; align-items:stretch; padding:0; }
    .eq-modal-overlay.is-drawer .eq-modal { width:50vw; min-width:520px; max-width:860px; max-height:none; height:100%; border-radius:0; border-width:0 0 0 1px; padding:32px 40px 40px; animation:drawerIn .28s cubic-bezier(.2,.8,.2,1) both; }
    .eq-modal-overlay.is-drawer .eq-modal-head h2 { font-size:22px; }
    .eq-modal-overlay.is-drawer textarea { min-height:220px; }
  }
  @keyframes drawerIn { from { transform:translateX(40px); opacity:0; } to { transform:none; opacity:1; } }

  .proj-detail .eq-detail-row { font-size:15px; padding:13px 0; }
  .proj-detail .eq-detail-notes { font-size:15.5px; padding:18px 0; min-height:120px; }

  /* 메모 속 유튜브 레퍼런스 썸네일 */
  .yt-thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:12px 0 4px; }
  .yt-thumb { position:relative; display:block; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:var(--border); border:1px solid var(--border); }
  .yt-thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s ease; }
  .yt-thumb:hover img { transform:scale(1.04); }
  .yt-play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; text-shadow:0 2px 8px rgba(0,0,0,.6); opacity:.9; pointer-events:none; }
  .yt-no { position:absolute; left:6px; top:6px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:rgba(0,0,0,.6); color:#fff; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; box-sizing:border-box; }

  /* 메모 편집 칸(굵게가 실제로 굵게 보이는 편집 칸) */
  .rich-memo { width:100%; box-sizing:border-box; min-height:260px; max-height:60vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:var(--font-body); font-size:13.5px; line-height:1.6; outline:none; white-space:pre-wrap; overflow-wrap:anywhere; cursor:text; }
  .rich-memo:focus { border-color:var(--accent); }
  .rich-memo:empty::before { content:attr(data-placeholder); color:var(--text-faint); opacity:.5; pointer-events:none; }
  .rich-memo b, .rich-memo strong { font-weight:800; }
  @media (max-width: 720px) { .rich-memo { font-size:16px; } }
  /* 오른쪽 패널에서는 메모 칸이 남는 높이를 채우고, 내용이 길면 칸이 같이 늘어난다(칸 안 스크롤 없음) */
  @media (min-width: 721px) { .eq-modal-overlay.is-drawer .rich-memo { font-size:15px; min-height:max(320px, calc(100vh - 640px)); max-height:none; overflow-y:visible; } }

  /* 제목 위에서 글자 커서(I)가 뜨지 않게 */
  .proj-row:not(.proj-row-head), .proj-row:not(.proj-row-head) .proj-row-title, .proj-row:not(.proj-row-head) .proj-row-code { cursor:pointer; }
  .eq-modal-head h2, .eq-detail-row > span, .proj-parent-meta, .eq-header h1 { cursor:default; }

  /* 프로젝트 상세 패널: 정보 카드(이름 위, 값 아래)로 한눈에 */
  .pd-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:6px 0 4px; }
  .pd-card { background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .pd-card > span { font-size:12px; color:var(--text-dim); font-weight:600; cursor:default; }
  .pd-card > b { font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:26px; overflow-wrap:anywhere; }
  .pd-card.pd-wide { grid-column:span 2; }
  @media (max-width: 720px) { .pd-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }

  .eq-modal-overlay.no-anim, .eq-modal-overlay.no-anim .eq-modal { animation:none !important; }

  /* ===== 노래연습 ===== */
  .song-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-top:14px; }
  .song-card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .song-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--accent); }
  .song-thumb { position:relative; aspect-ratio:16/9; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:34px; }
  .song-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .song-card-body { padding:12px 14px 14px; }
  .song-card-title { font-size:15.5px; font-weight:700; color:var(--text); overflow-wrap:anywhere; }
  .song-card-sub { font-size:12.5px; color:var(--text-dim); margin-top:3px; overflow-wrap:anywhere; }
  .song-card-edit { position:absolute; top:8px; right:8px; background:var(--surface); opacity:0; transition:opacity .15s ease; }
  .song-card:hover .song-card-edit { opacity:1; }
  .song-play-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .song-play-title { flex:1; min-width:160px; }
  .song-play-tools { display:flex; gap:6px; flex-wrap:wrap; }
  .song-lyrics { overflow-wrap:anywhere; line-height:1.75; color:var(--text); font-weight:500; padding-bottom:40vh; display:flex; flex-direction:column; gap:.9em; }
  .song-sec { border-left:4px solid transparent; padding:.15em 0 .15em .8em; border-radius:4px; }
  .song-sec-body { white-space:pre-wrap; }
  .song-sec-label { display:inline-block; font-size:12.5px; font-weight:800; letter-spacing:.02em; padding:3px 10px; border-radius:999px; margin-bottom:.45em; background:var(--border); color:var(--text-dim); }
  .song-sec-verse { border-left-color:var(--border-strong); }
  .song-sec-pre { border-left-color:#e0a63c; } .song-sec-pre .song-sec-label { background:#e0a63c26; color:#b97f17; }
  .song-sec-chorus { border-left-color:var(--accent); background:var(--accent-soft); padding:.6em .8em; border-radius:12px; }
  .song-sec-chorus .song-sec-label { background:var(--accent); color:#fff; }
  .song-sec-bridge { border-left-color:#8b5cf6; } .song-sec-bridge .song-sec-label { background:#8b5cf626; color:#8b5cf6; }
  .song-sec-etc .song-sec-body { color:var(--text-dim); }
  .song-sec-chips { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:2px 0 8px; }
  .song-sec-chips > span { font-size:12px; color:var(--text-faint); margin-right:2px; }
  .song-lyrics b { font-weight:800; color:var(--accent); }
  .song-lyrics-input { min-height:42vh !important; line-height:1.6; }
  #songDock { position:fixed; z-index:40; right:28px; top:96px; width:min(42vw, 620px); aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#000; box-shadow:var(--shadow-lg); }
  #songDock iframe { width:100%; height:100%; border:0; display:block; }
  @media (min-width: 721px) { .song-play.has-video:not(.is-mini) { padding-right:calc(min(42vw, 620px) + 28px); } }
  /* 작은 플레이어: 오른쪽 아래 모서리에 작게 띄우고 가사는 화면 폭을 다 쓴다 */
  #songDock.is-mini { top:auto; bottom:24px; right:24px; width:320px; border-radius:12px; }
  /* MR 파일 재생 막대: 영상이 없으니 크게 띄울 필요 없이 항상 오른쪽 아래 작은 막대, 가사는 화면 폭을 다 쓴다 */
  #songDock.is-file { top:auto; bottom:24px; right:24px; width:380px; aspect-ratio:auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .song-play.has-file { padding-right:0 !important; padding-top:0 !important; }
  .song-player { display:flex; align-items:center; gap:14px; padding:16px 18px; }
  .sp-play { flex:0 0 52px; height:52px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:18px; cursor:pointer; }
  .sp-play:disabled { opacity:.5; cursor:default; }
  .sp-mid { flex:1; min-width:0; }
  .sp-name { font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp-mid input[type=range] { width:100%; margin:8px 0 2px; accent-color:var(--accent); }
  .sp-time { font-size:12px; color:var(--text-dim); }
  .song-key { display:inline-flex; align-items:center; gap:6px; }
  .song-key b { min-width:44px; text-align:center; font-size:13px; color:var(--accent); }
  .song-file-cur { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; margin-bottom:8px; color:var(--text); }
  .song-file-rm { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--text-dim); font-weight:400; }
  .song-file-rm input { width:auto; }
  .date-wrap { display:flex; align-items:center; gap:6px; min-width:0; }
  .date-wrap input { flex:1; min-width:0; width:auto; -webkit-appearance:none; appearance:none; } /* 아이폰 날짜 칸은 기본 폭이 커서 줄어들지 않고 ✕ 버튼을 화면 밖으로 밀어낸다 */
  .date-clear { display:none; flex:0 0 auto; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:14px; cursor:pointer; padding:0; }
  .date-clear:hover { color:var(--danger, #e5484d); border-color:var(--border-strong); }
  .date-wrap.has-val .date-clear { display:inline-flex; }
  @media (max-width: 720px) {
    .song-card-edit { opacity:1; }
    #songDock { left:0; right:0; top:calc(env(safe-area-inset-top) + 52px); width:100%; border-radius:0; }
    .song-play.has-video:not(.is-mini) { padding-top:56.25vw; }
    #songDock.is-mini { left:auto; right:12px; top:auto; bottom:calc(env(safe-area-inset-bottom) + 78px); width:46vw; border-radius:10px; }
    #songDock.is-file { left:12px; right:12px; top:auto; bottom:calc(env(safe-area-inset-bottom) + 78px); width:auto; border-radius:14px; }
    .song-play-head { gap:8px; }
  }

  .song-quick { display:flex; gap:8px; margin-top:14px; }
  .song-quick input { flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; color:var(--text); font-family:var(--font-body); font-size:14px; outline:none; }
  .song-quick input:focus { border-color:var(--accent); }
  .song-quick .eq-add-btn { white-space:nowrap; }
  @media (max-width: 720px) { .song-quick input { font-size:16px; } }

  /* 노래연습 싱크 */
  .song-sec { transition:box-shadow .2s ease, background .2s ease, opacity .2s ease; }
  .song-sec-top { display:flex; align-items:center; gap:8px; }
  .song-sec-top:not(:has(.song-sec-label)):has(.song-sec-time:empty) { display:none; }
  .song-sec-label { margin-bottom:0; }
  .song-sec-top { margin-bottom:.45em; }
  .song-sec-time { font-size:12px; font-weight:700; color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .song-sec-time:empty { display:none; }
  .song-sec.is-set { cursor:pointer; }
  .song-sec.now { box-shadow:0 0 0 2px var(--accent); background:var(--accent-soft); border-radius:12px; padding:.6em .8em; }
  .song-lyrics:has(.song-sec.now) .song-sec:not(.now) { opacity:.55; }
  .song-lyrics.syncing .song-sec { cursor:pointer; outline:1.5px dashed var(--border-strong); outline-offset:4px; border-radius:12px; opacity:1 !important; }
  .song-lyrics.syncing .song-sec.is-set { outline-color:var(--accent); outline-style:solid; }
  .song-sec.tapped { animation:songTap .35s ease; }
  @keyframes songTap { 0% { transform:scale(.985); background:var(--accent-soft); } 100% { transform:none; } }
  .song-sync-hint { background:var(--accent-soft); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:13.5px; line-height:1.55; margin-bottom:16px; }
</style>
</body>
</html>
