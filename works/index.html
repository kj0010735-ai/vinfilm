function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function colorMarkerStyle(color, basePadding) {
  if (!color) return '';
  return `--row-tint:${color}22; border-left:6px solid ${color}; padding-left:${basePadding - 6}px;`;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
const WEEKDAYS_KO = ['일','월','화','수','목','금','토'];
function dateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${m}월 ${d}일 (${WEEKDAYS_KO[dt.getDay()]})`;
}
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,9)}`; }
function formatUpdated(ts) { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

/* ================= image helpers ================= */
function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('이미지를 읽을 수 없어요'));
    img.src = src;
  });
}
function drawResized(img, maxDim = 480, quality = 0.72) {
  let { width, height } = img;
  if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
  else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}
function resizeImage(file, maxDim = 480, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = async () => {
      try { resolve(drawResized(await loadImageElement(reader.result), maxDim, quality)); }
      catch (err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}
async function resizeFromUrl(url, maxDim = 480, quality = 0.72) {
  const resp = await fetch(url, { mode: 'cors' });
  if (!resp.ok) throw new Error('fetch failed');
  const blob = await resp.blob();
  const objectUrl = URL.createObjectURL(blob);
  try { return drawResized(await loadImageElement(objectUrl), maxDim, quality); }
  finally { URL.revokeObjectURL(objectUrl); }
}
function extractDroppedImageUrl(dataTransfer) {
  let url = dataTransfer.getData('text/uri-list') || dataTransfer.getData('text/plain');
  if (url && /^https?:\/\//i.test(url.trim())) return url.trim();
  const html = dataTransfer.getData('text/html');
  if (html) { const m = /<img[^>]+src="([^"]+)"/i.exec(html); if (m) return m[1]; }
  return null;
}

function getLocalArrayFor(name) {

    default: return [];

}
function applyCloudUpdate(name, items) {
  switch (name) {
    case 'equipment': eqItems = items; try { localStorage.setItem(LS_ITEMS, JSON.stringify(items)); } catch (e) {} break;
    case 'categories': eqCategories = items.length ? items : DEFAULT_CATEGORIES; try { localStorage.setItem(LS_CATEGORIES, JSON.stringify(eqCategories)); } catch (e) {} break;
    case 'schedule': schedItems = items; try { localStorage.setItem(LS_SCHEDULE, JSON.stringify(items)); } catch (e) {} break;
    case 'projects': projItems = items; try { localStorage.setItem(LS_PROJECTS, JSON.stringify(items)); } catch (e) {} break;
    case 'shoots': shoots = items; try { localStorage.setItem(LS_SHOOTS, JSON.stringify(items)); } catch (e) {} break;
    case 'presets': presets = items; try { localStorage.setItem(LS_PRESETS, JSON.stringify(items)); } catch (e) {} break;
    case 'todayTasks': todayTasks = items; try { localStorage.setItem(LS_TASKS, JSON.stringify(items)); } catch (e) {} break;
    case 'notes': notes = items; try { localStorage.setItem(LS_NOTES, JSON.stringify(items)); } catch (e) {} break;
    case 'shortcuts': shortcuts = items; try { localStorage.setItem(LS_SHORTCUTS, JSON.stringify(items)); } catch (e) {} break;
    case 'sharedProjects': sharedProjItems = items; try { localStorage.setItem(LS_SHARED, JSON.stringify(items)); } catch (e) {} break;
  }
  render();
}
async function pushToCloud(name, prevArr, nextArr) {
  if (!window.cloudSync || !window.cloudSyncReady) return;
  const prevIds = new Set(prevArr.map(x => x.id));
  const nextIds = new Set(nextArr.map(x => x.id));
  const toDelete = [...prevIds].filter(id => !nextIds.has(id));
  try {
    if (nextArr.length) await window.cloudSync.upsertMany(name, nextArr);
    if (toDelete.length) await window.cloudSync.deleteMany(name, toDelete);
  } catch (e) { console.warn('cloud sync push failed for', name, e); }
}

function initCloudSync() {
  if (IS_LOCAL_DEV) {
    console.warn('로컬 환경(localhost/file://)이라 클라우드 동기화를 켜지 않았어요 — localStorage만으로 동작합니다. 실제 운영 데이터는 안전해요.');
    return;
  }
  if (typeof firebase === 'undefined') {
    console.warn('Firebase SDK를 불러오지 못했어요 (인터넷 연결 확인). 로컬 저장 모드로 계속 동작합니다.');
    return;
  }
  try {
    const db = firebase.firestore();
    window.cloudSync = {
      async upsertMany(name, items) { await Promise.all(items.map(it => db.collection(name).doc(String(it.id)).set(it))); },
      async deleteMany(name, ids) { await Promise.all(ids.map(id => db.collection(name).doc(String(id)).delete())); },
    };
    (GUEST_MODE ? GUEST_CLOUD_COLLECTIONS : CLOUD_COLLECTIONS).forEach(name => {
      let initialized = false;
      db.collection(name).onSnapshot(async (snap) => {
        const items = snap.docs.map(d => d.data());
        if (!initialized) {
          initialized = true;
          if (items.length === 0) {
            const local = getLocalArrayFor(name) || [];
            if (local.length > 0) { await window.cloudSync.upsertMany(name, local); return; }
          }
        }
        applyCloudUpdate(name, items);
      }, (err) => console.warn('cloud sync listen error for', name, err));
    });
    window.cloudSyncReady = true;
    render();
  } catch (e) {
    console.warn('Firebase 초기화 실패, 로컬 저장 모드로 계속 동작합니다.', e);
    window.cloudSyncReady = false;
  }
}

function nextSerial(items) { let max = 0; items.forEach(it => { const m = /^EQ-(\d+)$/.exec(it.serial || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); }); return `EQ-${String(max + 1).padStart(3, '0')}`; }
function nextProjectSerial(list) { let max = 0; list.forEach(p => { const m = /^PJ-(\d+)$/.exec(p.serial || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); }); return `PJ-${String(max + 1).padStart(3, '0')}`; }
function nextSharedSerial(list) { let max = 0; list.forEach(p => { const m = /^SP-(\d+)$/.exec(p.serial || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); }); return `SP-${String(max + 1).padStart(3, '0')}`; }
function sharedStatusOf(id) { return SHARED_STATUSES.find(s => s.id === id) || SHARED_STATUSES[0]; }
function categoryOf(id) { return eqCategories.find(c => c.id === id) || eqCategories[eqCategories.length - 1] || { label: '기타', abbr: '기타', color: '#8b90a0' }; }
function eqStatusOf(id) { return EQ_STATUSES.find(s => s.id === id) || EQ_STATUSES[0]; }
function eqById(id) { return eqItems.find(it => it.id === id); }
function bagOptions() { return eqItems.filter(it => it.category === 'bag'); }

function getFilteredEquipment() {
  let list = [...eqItems];
  const st = S.eq;
  if (st.categoryFilter !== 'all') list = list.filter(it => it.category === st.categoryFilter);
  if (st.statusFilter !== 'all') list = list.filter(it => it.status === st.statusFilter);
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    list = list.filter(it => it.name.toLowerCase().includes(q) || (it.location||'').toLowerCase().includes(q) || (it.notes||'').toLowerCase().includes(q) || (it.serial||'').toLowerCase().includes(q) || (it.battery||'').toLowerCase().includes(q));
  }
  if (st.sortBy === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  else if (st.sortBy === 'category') list.sort((a,b) => a.category.localeCompare(b.category));
  else list.sort((a,b) => b.createdAt - a.createdAt);
  return list;
}

  }
  const isDefaultView = !S.eq.search.trim() && S.eq.categoryFilter === 'all' && S.eq.statusFilter === 'all';
  if (isDefaultView) {
    const topLevel = filtered.filter(it => !hasParent(it));

      if (items.length === 0) return '';

  return `<div class="eq-grid">${filtered.map(it => eqCardHtml(it, [])).join('')}</div>`;

  const want = {};

    if (pushed[body.id] === sig) continue;

    catch (e) { if (e.status === 404) await gapiFetch(base, { method: 'POST', body: sig }); else throw e; }

  }

function getFilteredSchedule() {
  let list = visibleSchedItems();
  const st = S.sched;
  if (st.categoryFilter !== 'all') list = list.filter(it => it.category === st.categoryFilter);
  if (!st.showPast) list = list.filter(it => it.date >= todayStr());
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    list = list.filter(it => it.title.toLowerCase().includes(q) || (it.location||'').toLowerCase().includes(q) || (it.memo||'').toLowerCase().includes(q));
  }
  list.sort((a,b) => `${a.date}T${a.time||'00:00'}`.localeCompare(`${b.date}T${b.time||'00:00'}`));
  return list;
}
function diffDaysFromToday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - todayOnly) / 86400000);
}
function ddayLabel(dateStr) {
  const diff = diffDaysFromToday(dateStr);
  if (diff === 0) return 'D-DAY';
  if (diff > 0) return `D-${diff}`;
  return `D+${-diff}`;
}
function schedGroupsHtml() {
  const filtered = getFilteredSchedule();
  if (filtered.length === 0) {
    return `<div class="eq-empty"><p>${schedItems.length===0?'아직 등록된 일정이 없어요.':'조건에 맞는 일정이 없어요.'}</p><p>${schedItems.length===0?'일정을 직접 등록하거나 캘린더를 가져와보세요.':'검색어나 필터를 조정해보세요.'}</p></div>`;
  }
  const groups = [];
  filtered.forEach(it => {
    let g = groups.find(g => g.date === it.date);
    if (!g) { g = { date: it.date, items: [] }; groups.push(g); }
    g.items.push(it);

  return groups.map(group => {

    return `
    <div class="sched-day-group">

        <span class="sched-day-date">${dateLabel(group.date)}</span>

          <div class="sched-body" data-action="sched-open-detail" data-id="${item.id}">

function ymd(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseYmd(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
function calFilteredItems() {
  // 캘린더는 과거도 보여야 하므로 "지난 일정" 토글은 무시하고 카테고리/검색만 적용
  const st = S.sched;
  let list = visibleSchedItems();
  if (st.categoryFilter !== 'all') list = list.filter(it => it.category === st.categoryFilter);
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    list = list.filter(it => it.title.toLowerCase().includes(q) || (it.location||'').toLowerCase().includes(q) || (it.memo||'').toLowerCase().includes(q));
  }
  list.sort((a,b) => `${a.date}T${a.time||'00:00'}`.localeCompare(`${b.date}T${b.time||'00:00'}`));
  const byDate = {};
  list.forEach(it => { (byDate[it.date] = byDate[it.date] || []).push(it); });
  if (st.categoryFilter === 'all' || st.categoryFilter === 'calendar') {
    const q = st.search.trim().toLowerCase();
    const g = gcalEventsByDate();
    Object.keys(g).forEach(d => {
      const evs = g[d].filter(ev => !q || ev.title.toLowerCase().includes(q) || (ev.location||'').toLowerCase().includes(q));
      if (evs.length) byDate[d] = [...(byDate[d] || []), ...evs].sort((a,b) => (a.time||'').localeCompare(b.time||''));
    });
  }
  return byDate;
}
function calEventHtml(it, compact) {
  const past = it.date < todayStr();
  const g = it.source === 'google';
  return `<button class="cal-ev ${past ? 'is-past' : ''} ${g ? 'is-phone' : ''}" style="--ev:var(--sched-${it.category})" data-action="${g ? 'gcal-open-detail' : 'sched-open-detail'}" data-id="${esc(it.id)}" title="${esc(it.title)}${g && it.calName ? ' · 📱 ' + esc(it.calName) : ''}">${it.time ? `<span class="cal-ev-time">${esc(it.time)}</span>` : ''}<span class="cal-ev-title">${esc(it.title)}</span></button>`;
}
function calTitle() {
  const c = parseYmd(S.sched.cursor);
  if (S.sched.view === 'week') {
    const start = new Date(c); start.setDate(c.getDate() - c.getDay());
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return `${start.getFullYear()}년 ${start.getMonth()+1}월 ${start.getDate()}일 – ${end.getMonth()+1}월 ${end.getDate()}일`;
  }
  return `${c.getFullYear()}년 ${c.getMonth()+1}월`;
}
function calGridHtml() {
  const byDate = calFilteredItems();
  const c = parseYmd(S.sched.cursor);
  const today = todayStr();
  const weekdays = ['일','월','화','수','목','금','토'];
  let start, weeks;
  if (S.sched.view === 'week') {
    start = new Date(c); start.setDate(c.getDate() - c.getDay()); weeks = 1;
  } else {
    const first = new Date(c.getFullYear(), c.getMonth(), 1);
    start = new Date(first); start.setDate(1 - first.getDay());
    const last = new Date(c.getFullYear(), c.getMonth() + 1, 0);
    weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  }
  const maxShow = S.sched.view === 'week' ? 99 : 3;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d);
    const items = byDate[key] || [];
    const outside = S.sched.view === 'month' && d.getMonth() !== c.getMonth();
    const shown = items.slice(0, maxShow);
    cells += `
      <div class="cal-cell ${outside ? 'is-outside' : ''} ${key === today ? 'is-today' : ''} ${d.getDay() === 0 ? 'is-sun' : ''} ${d.getDay() === 6 ? 'is-sat' : ''}" data-action="cal-add-on-date" data-date="${key}">
        <div class="cal-daynum"><span>${d.getDate()}</span></div>
        <div class="cal-evs">
          ${shown.map(it => calEventHtml(it)).join('')}
          ${items.length > shown.length ? `<button class="cal-more" data-action="cal-open-day" data-date="${key}">+${items.length - shown.length}개 더보기</button>` : ''}
        </div>
      </div>`;
  }
  return `
    <div class="cal ${S.sched.view === 'week' ? 'cal-week' : ''}">
      <div class="cal-head">${weekdays.map((w, i) => `<div class="${i===0?'is-sun':i===6?'is-sat':''}">${w}</div>`).join('')}</div>
      <div class="cal-body" style="grid-template-rows:repeat(${weeks}, minmax(${S.sched.view === 'week' ? '300px' : '84px'}, 1fr));">${cells}</div>
    </div>`;
}

function projBreadcrumb(id) {
  const chain = [];
  let cur = id ? projItems.find(p => p.id === id) : null;
  while (cur) { chain.unshift(cur); cur = cur.parentId ? projItems.find(p => p.id === cur.parentId) : null; }
  return chain;
}
/* 프로젝트/공유 프로젝트 "폴더 이동" 공용 헬퍼 — 옮기려는 항목 자신과 그 하위 항목 전체로는
   이동할 수 없게(순환 방지) 제외 집합을 만들고, 트리 순서(부모 먼저) + 들여쓰기로 선택지를 만든다. */
function collectDescendantIds(items, rootId) {
  const ids = new Set();
  const queue = [rootId];
  while (queue.length) {
    const cur = queue.shift();
    items.filter(x => (x.parentId || null) === cur).forEach(child => { ids.add(child.id); queue.push(child.id); });
  }
  return ids;
}
function folderPickerOptions(items, excludeSet) {
  const byParent = {};
  items.forEach(p => { const k = p.parentId || 'root'; (byParent[k] = byParent[k] || []).push(p); });
  const out = [];
  (function walk(parentKey, depth) {
    (byParent[parentKey] || []).forEach(p => {
      if (excludeSet.has(p.id)) return; // 자기 자신/하위 트리는 후보에서도, 그 아래로도 내려가지 않음
      out.push({ id: p.id, label: (depth ? '　'.repeat(depth) + '└ ' : '') + p.title });
      walk(p.id, depth + 1);
    });
  })('root', 0);
  return out;
}

function projDday(dueDate) {
  if (!dueDate) return null;
  const diff = Math.round((new Date(dueDate + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  if (diff === 0) return { text: 'D-DAY', urgent: true };
  if (diff < 0) return { text: `D+${-diff}`, urgent: true };
  return { text: `D-${diff}`, soon: diff <= 3 };
}

  if (count <= 0) return [];

  if (sortPref === 'light') pool = pool.slice().sort((a,b) => (parseFloat(a.weight)||9999) - (parseFloat(b.weight)||9999));
  else pool = pool.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  return pool.slice(0, count).map(it => it.id);
}
function expandCompanions(idsArray) {
  const expanded = new Set(idsArray);
  const queue = [...idsArray];
  while (queue.length) {
    const id = queue.shift();
    const item = eqById(id);
    if (!item) continue;
    (Array.isArray(item.companionIds) ? item.companionIds : []).forEach(cid => { if (!expanded.has(cid) && eqById(cid)) { expanded.add(cid); queue.push(cid); } });
    eqItems.filter(c => c.parentId === id).forEach(c => { if (!expanded.has(c.id)) { expanded.add(c.id); queue.push(c.id); } });
  }
  return [...expanded];
}
function buildRecommendation(p) {
  const sortPref = p.packPref === 'minimal' ? 'light' : 'default';
  const picked = new Set();
  const add = (ids) => ids.forEach(id => picked.add(id));
  add(pickByCategory('camera', p.cameraCount, sortPref, picked));
  add(pickByCategory('lens', Math.max(1, p.cameraCount), sortPref, picked));
  add(pickByCategory('audio', p.audioCount, sortPref, picked));
  add(pickByCategory('light', LIGHT_PREF_COUNT[p.lightPref] ?? 0, sortPref, picked));
  if (p.packPref === 'full' || (p.packPref === 'standard' && p.cameraCount > 1)) add(pickByCategory('monitor', 1, sortPref, picked));
  if (p.packPref !== 'minimal' && p.audioCount > 0) add(pickByCategory('wireless', 1, sortPref, picked));
  if (p.packPref !== 'minimal') add(pickByCategory('tripod', p.cameraCount, sortPref, picked));
  const battPerCam = p.durationHours > 4 ? 2 : 1;
  add(pickByCategory('battery', battPerCam * Math.max(1, p.cameraCount), sortPref, picked));
  return expandCompanions([...picked]);
}
function paramsFromShootForm(fd) {
  return {
    name: (fd.get('name') || '').toString().trim(), shootType: fd.get('shootType') || '', castCount: parseInt(fd.get('castCount'), 10) || 0,
    cameraCount: parseInt(fd.get('cameraCount'), 10) || 0, durationHours: parseFloat(fd.get('durationHours')) || 0, location: fd.get('location') || 'indoor',
    crewCount: parseInt(fd.get('crewCount'), 10) || 0, transport: fd.get('transport') || 'car', packPref: fd.get('packPref') || 'standard',
    audioCount: parseInt(fd.get('audioCount'), 10) || 0, lightPref: fd.get('lightPref') || 'none',
  };
}
function finalizeNewShoot(params, confirmedIds) {
  const newShoot = { id: uid(), createdAt: Date.now(), confirmedIds, packedIds: [], retrievedIds: [], bagOverrides: {}, ...params };
  saveShoots([newShoot, ...shoots]);
  S.shoot.formOpen = false; S.shoot.applyPresetId = null; S.shoot.selectedShootId = newShoot.id; S.shoot.mode = 'pack';
  render();
}
function effectiveBagId(shoot, item) {
  const overrides = shoot.bagOverrides || {};
  if (Object.prototype.hasOwnProperty.call(overrides, item.id)) {
    const ov = overrides[item.id];
    return (ov && eqById(ov)) ? ov : '';
  }
  if (item.bagId && eqById(item.bagId)) return item.bagId;
  if (item.parentId) {
    const parent = eqById(item.parentId);
    if (parent && parent.bagId && eqById(parent.bagId)) return parent.bagId;
  }
  return '';
}
function packGroups(shoot) {
  const fullIds = expandCompanions(shoot.confirmedIds || []);
  const items = fullIds.map(eqById).filter(Boolean);
  const groups = {};
  const bagIds = new Set();
  items.forEach(it => {
    if (it.category === 'bag') { bagIds.add(it.id); return; }
    const key = effectiveBagId(shoot, it) || 'none';
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  Object.keys(groups).forEach(k => { if (k !== 'none') bagIds.add(k); });
  return { groups, bagIds };
}

  if (list.length === 0) return `<div class="eq-empty"><p>이 달에는 등록된 일정이 없어요.</p></div>`;
  const groups = [];
  list.forEach(it => {
    let g = groups.find(g => g.date === it.date);
    if (!g) { g = { date: it.date, items: [] }; groups.push(g); }
    g.items.push(it);
  });
  return groups.map(g => `
    <div class="sched-day-group">
      <div class="sched-day-label"><span class="sched-day-date">${dateLabel(g.date)}</span></div>
      ${g.items.map(todayCardHtml).join('')}
    </div>`).join('');
}

function normalizeUrl(u) { u = (u || '').trim(); if (!u) return ''; return /^[a-z][a-z0-9+.-]*:\/\//i.test(u) ? u : 'https://' + u; }

}
function render() {
  document.getElementById('root').innerHTML = `<div class="app-shell">${renderSidebar()}<main class="app-main">${renderMobileTopBar()}${renderTab()}</main>${renderMobileTabBar()}</div>${schedModalHtml()}${settingsModalHtml()}${gcalModalHtml()}${gcalDetailModalHtml()}`;
  fitCalendar();
  positionNavIndicator();
  const main = document.querySelector('.app-main');
  if (main && window.__lastTab !== S.activeTab) { main.classList.add('tab-enter'); window.__lastTab = S.activeTab; }
  const af = document.querySelector('[autofocus]');
  if (af) { af.focus(); if (af.value) { const v = af.value; af.value = ''; af.value = v; } }
}
window.addEventListener('resize', () => { window.__navY = null; positionNavIndicator(); });
/* 사이드바 선택 표시가 이전 메뉴 위치에서 새 메뉴 위치로 미끄러지듯 움직이게 한다.
   render()가 매번 DOM을 새로 만들기 때문에 CSS transition만으로는 안 움직여서, 이전 위치를 기억해 두었다가
   새 요소를 이전 위치에 먼저 그린 뒤 다음 프레임에 새 위치로 옮긴다. */
/* 캘린더를 화면 아래 끝까지 빈틈없이 채운다 — 위쪽 헤더/필터 높이가 상황마다 달라서 CSS만으로 못 맞추고 렌더 후 실제 위치로 계산 */
function fitCalendar() {
  const cal = document.querySelector('.cal-card .cal');
  if (!cal) return;
  const top = cal.getBoundingClientRect().top + window.scrollY;
  const tb = document.querySelector('.m-tabbar');
  const tbh = tb && getComputedStyle(tb).display !== 'none' ? tb.offsetHeight : 0;
  const h = Math.max(window.innerHeight - top - 40 - tbh, 460);
  cal.style.height = h + 'px';
}
window.addEventListener('resize', () => fitCalendar());
function positionNavIndicator() {
  const ind = document.querySelector('.side-nav-indicator');
  const act = document.querySelector('.side-nav-item.active');
  if (!ind) return;
  if (!act) { ind.style.opacity = '0'; window.__navY = null; return; }
  const y = act.offsetTop, h = act.offsetHeight;
  ind.style.height = h + 'px';
  if (window.__navY != null && window.__navY !== y) {
    ind.style.transform = `translateY(${window.__navY}px)`;
    ind.getBoundingClientRect();
    requestAnimationFrame(() => { ind.style.transform = `translateY(${y}px)`; });
  } else {
    ind.style.transform = `translateY(${y}px)`;
  }
  window.__navY = y;
}

/* ================= event handling ================= */

function showLightbox(url) {
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${url}" class="lightbox-img" alt="" />`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}
async function handlePhotoFile(file) {
  currentEqPhotoError = '';
  try { currentEqPhoto = await resizeImage(file); }
  catch (err) { currentEqPhotoError = '사진을 불러오지 못했어요. 다른 이미지로 시도해줘.'; }
  refreshEqPhotoZone();
}

function bootApp() {
  render();
  if (gcalTokenValid()) gcalSync(false);
  else if (localStorage.getItem(GCAL_LS.enabled) === '1') { gcal.status = 'expired'; }

  const root = document.getElementById('root');

  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    /* 게스트는 장비목록을 보기만 할 수 있다 — 등록/수정/삭제/카테고리 관리 전부 차단. */
    const EQ_WRITE_ACTIONS = ['eq-open-add', 'eq-open-edit', 'eq-confirm-delete', 'eq-delete', 'eq-open-category-modal', 'eq-add-category', 'eq-delete-category', 'eq-detail-edit', 'eq-detail-delete', 'eq-open-add-child', 'eq-request-delete-in-modal'];
    if (GUEST_MODE && EQ_WRITE_ACTIONS.includes(action)) return;

    switch (action) {
      case 'set-tab':
        if (GUEST_MODE && !GUEST_ALLOWED_TABS.includes(id)) return;
        S.activeTab = id;
        S.moreOpen = false;
        window.scrollTo(0, 0);
        render();
        if (id === 'schedule' && gcalTokenValid()) gcalSync(false);
        break;
      case 'open-settings': S.settingsOpen = true; S.moreOpen = false; render(); break;
      case 'm-more': S.moreOpen = !S.moreOpen; render(); break;
      case 'm-more-close': S.moreOpen = false; render(); break;
      case 'close-settings': S.settingsOpen = false; render(); break;
      case 'close-settings-backdrop': if (!e.target.closest('[data-stop-close]')) { S.settingsOpen = false; render(); } break;
      case 'set-theme': applyTheme(el.dataset.theme); render(); break;
      case 'logout': logout(); break;

      /* equipment */
      case 'eq-open-add': S.eq.editingId = null; S.eq.newItemParentId = null; S.eq.modalOpen = true; currentEqPhoto = ''; currentEqPhotoError = ''; render(); break;
      case 'eq-open-edit': S.eq.editingId = id; S.eq.newItemParentId = null; S.eq.modalOpen = true; currentEqPhotoError = ''; render(); break;
      case 'eq-close-modal': S.eq.modalOpen = false; S.eq.editingId = null; S.eq.newItemParentId = null; currentEqPhoto = ''; render(); break;
      case 'eq-close-modal-backdrop': if (!e.target.closest('[data-stop-close]')) { S.eq.modalOpen = false; S.eq.editingId = null; S.eq.newItemParentId = null; currentEqPhoto = ''; render(); } break;
      case 'eq-confirm-delete': S.eq.confirmDeleteId = id; refreshEqGrid(); break;
      case 'eq-cancel-delete': S.eq.confirmDeleteId = null; refreshEqGrid(); break;
      case 'eq-delete': saveEqItems(eqItems.filter(it => it.id !== id)); S.eq.confirmDeleteId = null; refreshEqGrid(); break;
      case 'eq-set-category-filter': S.eq.categoryFilter = id; render(); break;
      case 'eq-set-status-filter': S.eq.statusFilter = id; render(); break;
      case 'eq-toggle-sort-open': S.eq.sortOpen = !S.eq.sortOpen; render(); break;
      case 'eq-set-sort': S.eq.sortBy = id; S.eq.sortOpen = false; render(); break;
      case 'eq-open-category-modal': S.eq.categoryModalOpen = true; render(); break;
      case 'eq-close-category-modal': S.eq.categoryModalOpen = false; render(); break;
      case 'eq-close-category-modal-backdrop': if (!e.target.closest('[data-stop-close]')) { S.eq.categoryModalOpen = false; render(); } break;
      case 'eq-add-category': {
        const input = document.getElementById('newCategoryNameInput');
        const name = input ? input.value.trim() : '';
        if (!name) break;
        if (eqCategories.some(c => c.label === name)) { window.alert('이미 있는 카테고리예요.'); break; }
        saveEqCategories([...eqCategories, { id: `cat-${Date.now()}`, label: name, abbr: name.slice(0, 2), color: CATEGORY_COLOR_PALETTE[eqCategories.length % CATEGORY_COLOR_PALETTE.length] }]);
        render();
        break;
      }
      case 'eq-delete-category': {
        if (eqCategories.length <= 1) { window.alert('최소 하나의 카테고리는 남아있어야 해요.'); break; }
        const cat = eqCategories.find(c => c.id === id);
        const fallback = eqCategories.find(c => c.id !== id);
        const count = eqItems.filter(it => it.category === id).length;
        if (count > 0) {
          const ok = window.confirm(`"${cat.label}" 카테고리에 속한 장비 ${count}개가 있어요.\n삭제하면 "${fallback.label}"(으)로 옮겨질 거예요. 계속할까요?`);
          if (!ok) break;
          saveEqItems(eqItems.map(it => it.category === id ? { ...it, category: fallback.id } : it));
        }
        saveEqCategories(eqCategories.filter(c => c.id !== id));
        if (S.eq.categoryFilter === id) S.eq.categoryFilter = 'all';
        render();
        break;
      }
      case 'eq-photo-pick': { const inp = document.getElementById('eqFileInput'); if (inp) inp.click(); break; }
      case 'eq-search-photo': {
        const q = (document.getElementById('eqNameInput')?.value || '').trim();
        if (!q) { alert('먼저 장비 이름을 입력해줘'); break; }
        window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q), '_blank', 'noopener');
        break;
      }
      case 'eq-search-specs': {
        const q = (document.getElementById('eqNameInput')?.value || '').trim();
        if (!q) { alert('먼저 장비 이름을 입력해줘'); break; }
        window.open('https://www.google.com/search?q=' + encodeURIComponent(q + ' 제원 스펙'), '_blank', 'noopener');
        break;
      }
      case 'eq-open-detail': S.eq.detailId = id; render(); break;
      case 'eq-close-detail': S.eq.detailId = null; render(); break;
      case 'eq-close-detail-backdrop': if (!e.target.closest('[data-stop-close]')) { S.eq.detailId = null; render(); } break;
      case 'eq-detail-edit': S.eq.detailId = null; S.eq.editingId = id; S.eq.newItemParentId = null; currentEqPhotoError = ''; S.eq.modalOpen = true; render(); break;
      case 'eq-detail-delete': {
        const item = eqById(id);
        if (item && window.confirm(`"${item.name}" 삭제할까요?`)) {
          saveEqItems(eqItems.filter(it => it.id !== id));
          S.eq.detailId = null;
          render();
        }
        break;
      }
      case 'eq-remove-photo': currentEqPhoto = ''; currentEqPhotoError = ''; refreshEqPhotoZone(); break;
      case 'eq-view-photo': { const item = eqById(id); if (item && item.photo) showLightbox(item.photo); break; }
      case 'eq-view-current-photo': if (currentEqPhoto) showLightbox(currentEqPhoto); break;
      case 'eq-open-add-child': S.eq.editingId = null; S.eq.newItemParentId = id; S.eq.detailId = null; S.eq.modalOpen = true; currentEqPhoto = ''; currentEqPhotoError = ''; render(); break;
      case 'eq-request-delete-in-modal': {
        const item = eqById(id);
        if (!item) break;
        if (window.confirm(`"${item.name}" 삭제할까요?`)) {
          saveEqItems(eqItems.filter(it => it.id !== id));
          S.eq.modalOpen = false; S.eq.editingId = null; currentEqPhoto = '';
          render();
        }
        break;
      }

      /* schedule */
      case 'sched-open-add': S.sched.editingId = null; S.sched.linkProjectId = null; S.sched.prefillDate = null; S.sched.modalOpen = true; render(); break;
      case 'cal-add-on-date':
        if (e.target.closest('.cal-ev, .cal-more')) break;
        S.sched.editingId = null; S.sched.linkProjectId = null; S.sched.prefillDate = el.dataset.date; S.sched.modalOpen = true; render(); break;
      case 'cal-open-day': S.sched.view = 'week'; S.sched.cursor = el.dataset.date; render(); break;
      case 'cal-set-view': S.sched.view = id; render(); break;
      case 'cal-today': S.sched.cursor = todayStr(); render(); break;
      case 'cal-prev': case 'cal-next': {
        const dir = action === 'cal-next' ? 1 : -1;
        const c = parseYmd(S.sched.cursor);
        if (S.sched.view === 'week') c.setDate(c.getDate() + 7 * dir);
        else { c.setDate(1); c.setMonth(c.getMonth() + dir); }
        S.sched.cursor = ymd(c); render(); break;
      }
      case 'sched-open-edit': S.sched.editingId = id; S.sched.linkProjectId = null; S.sched.modalOpen = true; render(); break;
      case 'sched-close-modal': S.sched.modalOpen = false; S.sched.editingId = null; S.sched.linkProjectId = null; render(); break;
      case 'sched-close-modal-backdrop': if (!e.target.closest('[data-stop-close]')) { S.sched.modalOpen = false; S.sched.editingId = null; S.sched.linkProjectId = null; render(); } break;
      case 'sched-confirm-delete': S.sched.confirmDeleteId = id; refreshSchedList(); break;
      case 'sched-cancel-delete': S.sched.confirmDeleteId = null; refreshSchedList(); break;
      case 'sched-delete': saveSchedItems(schedItems.filter(it => it.id !== id)); S.sched.confirmDeleteId = null; refreshSchedList(); break;
      case 'sched-set-category-filter': S.sched.categoryFilter = id; render(); break;
      case 'sched-toggle-past': S.sched.showPast = !S.sched.showPast; render(); break;
      case 'sched-open-detail': S.sched.detailId = id; render(); break;
      case 'sched-close-detail': S.sched.detailId = null; render(); break;
      case 'sched-close-detail-backdrop': if (!e.target.closest('[data-stop-close]')) { S.sched.detailId = null; render(); } break;
      case 'sched-detail-edit': S.sched.detailId = null; S.sched.editingId = id; S.sched.modalOpen = true; render(); break;
      case 'sched-detail-delete': {
        const item = schedItems.find(it => it.id === id);
        if (item && window.confirm(`"${item.title}" 삭제할까요?`)) {
          saveSchedItems(schedItems.filter(it => it.id !== id));
          S.sched.detailId = null;
          render();
        }
        break;
      }
      case 'gcal-open': gcal.modalOpen = true; render(); break;
      case 'gcal-close': gcal.modalOpen = false; render(); break;
      case 'gcal-close-backdrop': if (!e.target.closest('[data-stop-close]')) { gcal.modalOpen = false; render(); } break;
      case 'gcal-connect': gcalConnect(); break;
      case 'gcal-sync-now': gcalSync(true); break;
      case 'gcal-disconnect': if (window.confirm('휴대폰 캘린더 연결을 해제할까요? (Google 캘린더에 들어간 일정은 그대로 남아요)')) { gcalDisconnect(); gcal.modalOpen = false; render(); } break;
      case 'gcal-open-detail': gcal.detailId = el.dataset.id; render(); break;
      case 'gcal-close-detail': gcal.detailId = null; render(); break;
      case 'gcal-close-detail-backdrop': if (!e.target.closest('[data-stop-close]')) { gcal.detailId = null; render(); } break;

      case 'proj-open-add': S.proj.editingId = null; S.proj.addStatus = id; S.proj.modalOpen = true; render(); break;
      case 'proj-open-edit': S.proj.editingId = id; S.proj.modalOpen = true; S.proj.rowMenu = null; render(); break;
      case 'proj-duplicate': {
        const src = projItems.find(p => p.id === id);
        if (src) {
          const copy = { ...src, id: uid(), serial: nextProjectSerial(projItems), createdAt: Date.now(), title: `${src.title} 복사본`, status: 'todo', dueDate: '' };
          saveProjItems([copy, ...projItems]);
          S.proj.rowMenu = null;
          render();
        }
        break;
      }
      case 'proj-close-modal': S.proj.modalOpen = false; S.proj.editingId = null; render(); break;
      case 'proj-close-modal-backdrop': if (!e.target.closest('[data-stop-close]')) { S.proj.modalOpen = false; S.proj.editingId = null; render(); } break;
      case 'proj-confirm-delete': S.proj.confirmDeleteId = id; S.proj.rowMenu = null; render(); break;
      case 'proj-cancel-delete': S.proj.confirmDeleteId = null; render(); break;
      case 'proj-delete': saveProjItems(projItems.filter(p => p.id !== id)); S.proj.confirmDeleteId = null; render(); break;
      case 'proj-set-status-filter': S.proj.statusFilter = id; render(); break;
      case 'proj-drill-in':
        if (S.proj.selectMode) {
          const cur = new Set(S.proj.selectedIds);
          if (cur.has(id)) cur.delete(id); else cur.add(id);
          S.proj.selectedIds = [...cur];
          refreshProjList();
          break;
        }
        S.proj.currentParentId = id; S.proj.statusFilter = 'all'; S.proj.search = ''; S.proj.selectedIds = [];
        history.pushState({ projParentId: id }, '');
        render();
        break;
      case 'proj-go-parent':
        S.proj.currentParentId = id || null; S.proj.statusFilter = 'all'; S.proj.search = ''; S.proj.selectedIds = [];
        history.pushState({ projParentId: id || null }, '');
        render();
        break;
      case 'proj-close-status-menu': S.proj.statusMenu = null; render(); break;
      case 'proj-close-row-menu': S.proj.rowMenu = null; render(); break;
      case 'proj-set-status': {
        const status = el.dataset.status;
        saveProjItems(projItems.map(p => p.id === id ? { ...p, status } : p));
        S.proj.statusMenu = null;
        render();
        break;
      }
      case 'proj-confirm-delete-parent': {
        const p = projItems.find(pr => pr.id === id);
        if (p && window.confirm(`"${p.title}"와(과) 하위 프로젝트를 모두 삭제할까요?`)) {
          const idsToDelete = new Set([id]);
          let changed = true;
          while (changed) {
            changed = false;
            projItems.forEach(it => { if (it.parentId && idsToDelete.has(it.parentId) && !idsToDelete.has(it.id)) { idsToDelete.add(it.id); changed = true; } });
          }
          saveProjItems(projItems.filter(pr => !idsToDelete.has(pr.id)));
          S.proj.currentParentId = p.parentId || null;
          history.replaceState({ projParentId: S.proj.currentParentId }, '');
          render();
        }
        break;
      }
      case 'proj-create-schedule': S.sched.editingId = null; S.sched.linkProjectId = id; S.sched.modalOpen = true; render(); break;
      case 'proj-view-schedule': {
        const p = projItems.find(pr => pr.id === id);
        if (p && p.scheduleId) { S.activeTab = 'schedule'; S.sched.detailId = p.scheduleId; render(); }
        break;
      }
      case 'proj-bulk-set-status': {
        const status = el.dataset.status;
        const ids = new Set(S.proj.selectedIds);
        saveProjItems(projItems.map(p => ids.has(p.id) ? { ...p, status } : p));
        S.proj.selectedIds = [];
        render();
        break;
      }
      case 'proj-bulk-delete': {
        const ids = new Set(S.proj.selectedIds);
        if (ids.size && window.confirm(`선택한 ${ids.size}개 프로젝트를 삭제할까요?`)) {
          saveProjItems(projItems.filter(p => !ids.has(p.id)));
          S.proj.selectedIds = [];
          render();
        }
        break;
      }
      case 'proj-clear-selection': S.proj.selectedIds = []; render(); break;
      case 'proj-toggle-select-mode':
        S.proj.selectMode = !S.proj.selectMode;
        if (!S.proj.selectMode) S.proj.selectedIds = [];
        render();
        break;
      case 'proj-open-move': S.proj.moveIds = [id]; S.proj.rowMenu = null; render(); break;
      case 'proj-bulk-move': if (S.proj.selectedIds.length) { S.proj.moveIds = [...S.proj.selectedIds]; render(); } break;
      case 'proj-close-move-modal': S.proj.moveIds = null; render(); break;

      /* shared projects */
      case 'shared-open-add': S.shared.editingId = null; S.shared.modalOpen = true; render(); break;
      case 'shared-open-edit': S.shared.editingId = id; S.shared.modalOpen = true; S.shared.rowMenu = null; render(); break;
      case 'shared-duplicate': {
        const src = sharedProjItems.find(p => p.id === id);
        if (src) {
          const copy = { ...src, id: uid(), serial: nextSharedSerial(sharedProjItems), createdAt: Date.now(), title: `${src.title} 복사본`, status: 'todo', dueDate: '', updatedBy: currentEditorName(), updatedAt: Date.now() };
          saveSharedProjItems([copy, ...sharedProjItems]);
          S.shared.rowMenu = null;
          render();
        }
        break;
      }
      case 'shared-close-modal': S.shared.modalOpen = false; S.shared.editingId = null; render(); break;
      case 'shared-close-modal-backdrop': if (!e.target.closest('[data-stop-close]')) { S.shared.modalOpen = false; S.shared.editingId = null; render(); } break;
      case 'shared-confirm-delete': S.shared.confirmDeleteId = id; S.shared.rowMenu = null; render(); break;
      case 'shared-cancel-delete': S.shared.confirmDeleteId = null; render(); break;
      case 'shared-delete': saveSharedProjItems(sharedProjItems.filter(p => p.id !== id)); S.shared.confirmDeleteId = null; render(); break;
      case 'shared-set-status-filter': S.shared.statusFilter = id; render(); break;
      case 'shared-drill-in':
        if (S.shared.selectMode) {
          const cur = new Set(S.shared.selectedIds);
          if (cur.has(id)) cur.delete(id); else cur.add(id);
          S.shared.selectedIds = [...cur];
          refreshSharedProjList();
          break;
        }
        S.shared.currentParentId = id; S.shared.statusFilter = 'all'; S.shared.search = ''; S.shared.selectedIds = [];
        history.pushState({ sharedParentId: id }, '');
        render();
        break;
      case 'shared-go-parent':
        S.shared.currentParentId = id || null; S.shared.statusFilter = 'all'; S.shared.search = ''; S.shared.selectedIds = [];
        history.pushState({ sharedParentId: id || null }, '');
        render();
        break;
      case 'shared-bulk-set-status': {
        const status = el.dataset.status;
        const ids = new Set(S.shared.selectedIds);
        saveSharedProjItems(sharedProjItems.map(p => ids.has(p.id) ? { ...p, status, updatedBy: currentEditorName(), updatedAt: Date.now() } : p));
        S.shared.selectedIds = [];
        render();
        break;
      }
      case 'shared-bulk-delete': {
        const ids = new Set(S.shared.selectedIds);
        if (ids.size && window.confirm(`선택한 ${ids.size}개 프로젝트를 삭제할까요?`)) {
          saveSharedProjItems(sharedProjItems.filter(p => !ids.has(p.id)));
          S.shared.selectedIds = [];
          render();
        }
        break;
      }
      case 'shared-clear-selection': S.shared.selectedIds = []; render(); break;
      case 'shared-toggle-select-mode':
        S.shared.selectMode = !S.shared.selectMode;
        if (!S.shared.selectMode) S.shared.selectedIds = [];
        render();
        break;
      case 'shared-open-move': S.shared.moveIds = [id]; S.shared.rowMenu = null; render(); break;
      case 'shared-bulk-move': if (S.shared.selectedIds.length) { S.shared.moveIds = [...S.shared.selectedIds]; render(); } break;
      case 'shared-close-move-modal': S.shared.moveIds = null; render(); break;
      case 'shared-close-status-menu': S.shared.statusMenu = null; render(); break;
      case 'shared-close-row-menu': S.shared.rowMenu = null; render(); break;
      case 'shared-set-status': {
        const status = el.dataset.status;
        saveSharedProjItems(sharedProjItems.map(p => p.id === id ? { ...p, status, updatedBy: currentEditorName(), updatedAt: Date.now() } : p));
        S.shared.statusMenu = null;
        render();
        break;
      }
      case 'shared-confirm-delete-parent': {
        const p = sharedProjItems.find(pr => pr.id === id);
        if (p && window.confirm(`"${p.title}"와(과) 하위 프로젝트를 모두 삭제할까요?`)) {
          const idsToDelete = new Set([id]);
          let changed = true;
          while (changed) {
            changed = false;
            sharedProjItems.forEach(it => { if (it.parentId && idsToDelete.has(it.parentId) && !idsToDelete.has(it.id)) { idsToDelete.add(it.id); changed = true; } });
          }
          saveSharedProjItems(sharedProjItems.filter(pr => !idsToDelete.has(pr.id)));
          S.shared.currentParentId = p.parentId || null;
          history.replaceState({ sharedParentId: S.shared.currentParentId }, '');
          render();
        }
        break;
      }

      /* shoot prep */
      /* today */
      case 'today-open-shoot': S.activeTab = 'shootprep'; S.shoot.selectedShootId = id; S.shoot.mode = 'pack'; render(); break;
      case 'today-open-shootprep': S.activeTab = 'shootprep'; S.shoot.selectedShootId = null; render(); break;
      case 'today-open-project': S.activeTab = 'projects'; render(); break;
      case 'today-open-project-detail':
        S.activeTab = 'projects'; S.proj.currentParentId = id;
        history.pushState({ projParentId: id }, '');
        render();
        break;
      case 'today-set-view': S.today.viewMode = id; render(); break;
      case 'today-prev-month': {
        const [y, m] = S.today.month.split('-').map(Number);
        const d = new Date(y, m - 2, 1);
        S.today.month = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
        render();
        break;
      }
      case 'today-next-month': {
        const [y, m] = S.today.month.split('-').map(Number);
        const d = new Date(y, m, 1);
        S.today.month = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
        render();
        break;
      }
      case 'today-jump-current-month': S.today.month = todayStr().slice(0, 7); render(); break;
      case 'task-open-add': S.task.editingId = null; S.task.modalOpen = true; render(); break;
      case 'task-open-edit': S.task.editingId = id; S.task.modalOpen = true; render(); break;
      case 'task-close-modal': S.task.modalOpen = false; S.task.editingId = null; render(); break;
      case 'task-confirm-delete': S.task.confirmDeleteId = id; render(); break;
      case 'task-cancel-delete': S.task.confirmDeleteId = null; render(); break;
      case 'task-delete': saveTodayTasks(todayTasks.filter(t => t.id !== id)); S.task.confirmDeleteId = null; render(); break;
      case 'shortcut-open-add': S.shortcut.editingId = null; S.shortcut.modalOpen = true; render(); break;
      case 'shortcut-open-edit': S.shortcut.editingId = id; S.shortcut.modalOpen = true; render(); break;
      case 'shortcut-close-modal': S.shortcut.modalOpen = false; S.shortcut.editingId = null; render(); break;
      case 'shortcut-delete': saveShortcuts(shortcuts.filter(x => x.id !== id)); S.shortcut.modalOpen = false; S.shortcut.editingId = null; render(); break;
      case 'note-open-add': S.note.editingId = null; S.note.modalOpen = true; render(); break;
      case 'note-open-edit': S.note.editingId = id; S.note.modalOpen = true; render(); break;
      case 'note-close-modal': S.note.modalOpen = false; S.note.editingId = null; render(); break;
      case 'note-confirm-delete': S.note.confirmDeleteId = id; render(); break;
      case 'note-cancel-delete': S.note.confirmDeleteId = null; render(); break;
      case 'note-delete': saveNotes(notes.filter(n => n.id !== id)); S.note.confirmDeleteId = null; render(); break;

      /* shoot prep */
      case 'shoot-open-new-form': S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; S.shoot.formOpen = true; render(); break;
      case 'shoot-create-blank': {
        const form = document.querySelector('[data-form-role="shoot-form"]');
        if (!form) break;
        const fd = new FormData(form);
        const params = paramsFromShootForm(fd);
        const preset = S.shoot.applyPresetId ? presets.find(p => p.id === S.shoot.applyPresetId) : null;
        const confirmedIds = preset ? (preset.confirmedIds || []).filter(pid => eqById(pid)) : [];
        finalizeNewShoot(params, confirmedIds);
        break;
      }
      case 'shoot-close-form': S.shoot.formOpen = false; S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; render(); break;
      case 'shoot-close-form-backdrop': if (!e.target.closest('[data-stop-close]')) { S.shoot.formOpen = false; S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; render(); } break;
      case 'shoot-edit-params': S.shoot.editingParamsId = id; S.shoot.applyPresetId = null; S.shoot.formOpen = true; render(); break;
      case 'shoot-open-detail': S.shoot.selectedShootId = id; S.shoot.mode = 'pack'; render(); break;
      case 'shoot-back-to-list': S.shoot.selectedShootId = null; render(); break;
      case 'shoot-confirm-delete': S.shoot.confirmDeleteShootId = id; render(); break;
      case 'shoot-cancel-delete': S.shoot.confirmDeleteShootId = null; render(); break;
      case 'shoot-delete':
        saveShoots(shoots.filter(s => s.id !== id));
        S.shoot.confirmDeleteShootId = null;
        if (S.shoot.selectedShootId === id) S.shoot.selectedShootId = null;
        render();
        break;
      case 'shoot-regenerate': {
        const shoot = shoots.find(s => s.id === id);
        if (!shoot) break;
        if (!window.confirm('추천을 다시 받으면 지금까지 직접 수정한 확정 장비 목록이 새로 계산된 추천으로 대체돼요. 계속할까요?')) break;
        const newIds = buildRecommendation(shoot);
        saveShoots(shoots.map(s => s.id === id ? { ...s, confirmedIds: newIds } : s));
        render();
        break;
      }
      case 'shoot-reset-checklist': {
        const key = S.shoot.mode === 'pack' ? 'packedIds' : 'retrievedIds';
        saveShoots(shoots.map(s => s.id === id ? { ...s, [key]: [] } : s));
        refreshShootPackList();
        break;
      }
      case 'shoot-set-mode': S.shoot.mode = id; render(); break;
      case 'shoot-save-preset': {
        const shoot = shoots.find(s => s.id === id);
        if (!shoot) break;
        const name = window.prompt('프리셋 이름을 입력해줘 (예: 1인 인터뷰 최소 세팅)');
        if (!name) break;
        const trimmed = name.trim();
        if (!trimmed) break;
        const { name: _n, id: _id, createdAt: _c, packedIds: _p, retrievedIds: _r, ...params } = shoot;
        savePresets([...presets, { id: uid(), name: trimmed, params, confirmedIds: shoot.confirmedIds || [], createdAt: Date.now() }]);
        window.alert('프리셋으로 저장했어요.');
        break;
      }
      case 'shoot-start-from-preset': S.shoot.editingParamsId = null; S.shoot.applyPresetId = id; S.shoot.formOpen = true; render(); break;
      case 'preset-confirm-delete': S.shoot.confirmDeletePresetId = id; render(); break;
      case 'preset-cancel-delete': S.shoot.confirmDeletePresetId = null; render(); break;
      case 'preset-delete': savePresets(presets.filter(p => p.id !== id)); S.shoot.confirmDeletePresetId = null; render(); break;
    }
  });

  /* 프로젝트/공유 프로젝트: 상태 배지 우클릭 → 빠른 상태 변경, 행 우클릭 → 수정/삭제 메뉴 */
  root.addEventListener('contextmenu', (e) => {
    const pill = e.target.closest('[data-status-menu-id]');
    if (pill) { e.preventDefault(); S.proj.statusMenu = { id: pill.dataset.statusMenuId, x: e.clientX, y: e.clientY }; render(); return; }
    const sharedPill = e.target.closest('[data-shared-status-menu-id]');
    if (sharedPill) { e.preventDefault(); S.shared.statusMenu = { id: sharedPill.dataset.sharedStatusMenuId, x: e.clientX, y: e.clientY }; render(); return; }
    const row = e.target.closest('[data-row-menu-id]');
    if (row) { e.preventDefault(); S.proj.rowMenu = { id: row.dataset.rowMenuId, x: e.clientX, y: e.clientY }; render(); return; }
    const sharedRow = e.target.closest('[data-shared-row-menu-id]');
    if (sharedRow) { e.preventDefault(); S.shared.rowMenu = { id: sharedRow.dataset.sharedRowMenuId, x: e.clientX, y: e.clientY }; render(); return; }
  });

  /* text search (targeted refresh, no full render → keeps focus) */
  root.addEventListener('input', (e) => {
    if (e.target.id === 'eqSearchInput') { S.eq.search = e.target.value; refreshEqGrid(); }
    else if (e.target.id === 'schedSearchInput') { S.sched.search = e.target.value; refreshSchedList(); }
    else if (e.target.id === 'projSearchInput') { S.proj.search = e.target.value; refreshProjList(); }
    else if (e.target.id === 'sharedProjSearchInput') { S.shared.search = e.target.value; refreshSharedProjList(); }
  });

  /* checkboxes: allDay, photo file, ics import, shoot confirm/pack toggles */
  root.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.role === 'proj-due-inline') {
      const id = e.target.dataset.id;
      saveProjItems(projItems.map(p => p.id === id ? { ...p, dueDate: e.target.value } : p));
      refreshProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-due-inline') {
      const id = e.target.dataset.id;
      saveSharedProjItems(sharedProjItems.map(p => p.id === id ? { ...p, dueDate: e.target.value } : p));
      refreshSharedProjList();
    }
    if (e.target.id === 'todayMonthPicker') {
      if (e.target.value) { S.today.month = e.target.value; render(); }
    }
    if (e.target.id === 'schedAllDayCb') {
      const timeInput = document.getElementById('schedTimeInput');
      if (timeInput) timeInput.disabled = e.target.checked;
    }
    if (e.target.id === 'eqFileInput') {
      const file = e.target.files && e.target.files[0];
      if (file) handlePhotoFile(file);
      e.target.value = '';
    }
    if (e.target.dataset && e.target.dataset.role === 'confirm-toggle') {
      const shoot = shoots.find(s => s.id === S.shoot.selectedShootId);
      if (!shoot) return;
      const itemId = e.target.dataset.id;
      const cur = new Set(shoot.confirmedIds || []);
      if (e.target.checked) cur.add(itemId); else cur.delete(itemId);
      saveShoots(shoots.map(s => s.id === shoot.id ? { ...s, confirmedIds: [...cur] } : s));
      refreshShootPackList();
    }
    if (e.target.dataset && e.target.dataset.role === 'pack-toggle') {
      const shootId = e.target.dataset.shootId || S.shoot.selectedShootId;
      const shoot = shoots.find(s => s.id === shootId);
      if (!shoot) return;
      const key = S.shoot.mode === 'pack' ? 'packedIds' : 'retrievedIds';
      const itemId = e.target.dataset.id;
      const cur = new Set(shoot[key] || []);
      if (e.target.checked) cur.add(itemId); else cur.delete(itemId);
      saveShoots(shoots.map(s => s.id === shoot.id ? { ...s, [key]: [...cur] } : s));
      if (S.activeTab === 'shootprep') refreshShootPackList(); else render();
    }
    if (e.target.dataset && e.target.dataset.role === 'proj-row-select') {
      const rid = e.target.dataset.id;
      const cur = new Set(S.proj.selectedIds);
      if (e.target.checked) cur.add(rid); else cur.delete(rid);
      S.proj.selectedIds = [...cur];
      refreshProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'proj-select-all') {
      const ids = (e.target.dataset.ids || '').split(',').filter(Boolean);
      const cur = new Set(S.proj.selectedIds);
      if (e.target.checked) ids.forEach(x => cur.add(x)); else ids.forEach(x => cur.delete(x));
      S.proj.selectedIds = [...cur];
      refreshProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-row-select') {
      const rid = e.target.dataset.id;
      const cur = new Set(S.shared.selectedIds);
      if (e.target.checked) cur.add(rid); else cur.delete(rid);
      S.shared.selectedIds = [...cur];
      refreshSharedProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-select-all') {
      const ids = (e.target.dataset.ids || '').split(',').filter(Boolean);
      const cur = new Set(S.shared.selectedIds);
      if (e.target.checked) ids.forEach(x => cur.add(x)); else ids.forEach(x => cur.delete(x));
      S.shared.selectedIds = [...cur];
      refreshSharedProjList();
    }
  });

  /* 프로젝트/공유 프로젝트 목록에서 메모를 행 안에서 바로 수정(contenteditable) — 포커스 잃을 때 저장 */
  root.addEventListener('focusout', (e) => {
    if (e.target.dataset && e.target.dataset.role === 'proj-notes-inline') {
      const id = e.target.dataset.id;
      const notes = e.target.textContent.trim();
      saveProjItems(projItems.map(p => p.id === id ? { ...p, notes } : p));
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-notes-inline') {
      const id = e.target.dataset.id;
      const notes = e.target.textContent.trim();
      saveSharedProjItems(sharedProjItems.map(p => p.id === id ? { ...p, notes } : p));
    }
  });

  /* form submits */
  root.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    if (form.matches('[data-form-role="eq-form"]')) {
      if (GUEST_MODE) return;
      const fd = new FormData(form);
      const name = (fd.get('name') || '').toString().trim();
      if (!name) return;
      const payload = {
        name, category: fd.get('category'), status: fd.get('status') || 'owned', quantity: parseInt(fd.get('quantity'), 10) || 1,
        weight: fd.get('weight') || '', battery: fd.get('battery') || '', cables: fd.get('cables') || '', bagId: fd.get('bagId') || '',
        parentId: fd.get('parentId') || '', companionIds: fd.getAll('companions'), notes: fd.get('notes') || '', photo: currentEqPhoto,
        updatedBy: currentEditorName(), updatedAt: Date.now(),
      };
      if (S.eq.editingId) saveEqItems(eqItems.map(it => it.id === S.eq.editingId ? { ...it, ...payload } : it));
      else saveEqItems([{ id: uid(), serial: nextSerial(eqItems), createdAt: Date.now(), ...payload }, ...eqItems]);
      S.eq.modalOpen = false; S.eq.editingId = null; S.eq.newItemParentId = null; currentEqPhoto = '';
      render();
    } else if (form.matches('[data-form-role="sched-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const allDay = fd.has('allDay');
      const payload = { title, date: fd.get('date'), time: allDay ? null : (fd.get('time') || null), location: fd.get('location') || '', contact: fd.get('contact') || '', category: fd.get('category') || 'shoot', memo: fd.get('memo') || '' };
      if (S.sched.editingId) {
        saveSchedItems(schedItems.map(it => it.id === S.sched.editingId ? { ...it, ...payload } : it));
      } else {
        const newId = uid();
        const linkProjectId = S.sched.linkProjectId;
        saveSchedItems([{ id: newId, createdAt: Date.now(), source: 'manual', projectId: linkProjectId || null, ...payload }, ...schedItems]);
        if (linkProjectId) saveProjItems(projItems.map(p => p.id === linkProjectId ? { ...p, scheduleId: newId } : p));
      }
      S.sched.modalOpen = false; S.sched.editingId = null; S.sched.linkProjectId = null;
      render();
    } else if (form.matches('[data-form-role="proj-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const payload = { title, client: fd.get('client') || '', status: fd.get('status') || 'todo', type: fd.get('type') || '', color: fd.get('color') || '', dueDate: fd.get('dueDate') || '', notes: fd.get('notes') || '' };
      if (S.proj.editingId) saveProjItems(projItems.map(p => p.id === S.proj.editingId ? { ...p, ...payload } : p));
      else saveProjItems([{ id: uid(), serial: nextProjectSerial(projItems), createdAt: Date.now(), parentId: S.proj.currentParentId || null, ...payload }, ...projItems]);
      S.proj.modalOpen = false; S.proj.editingId = null;
      render();
    } else if (form.matches('[data-form-role="proj-move-form"]')) {
      const fd = new FormData(form);
      const targetParentId = fd.get('targetParentId') || null;
      const ids = new Set(S.proj.moveIds || []);
      if (ids.size) saveProjItems(projItems.map(p => ids.has(p.id) ? { ...p, parentId: targetParentId } : p));
      S.proj.moveIds = null; S.proj.selectedIds = [];
      render();
    } else if (form.matches('[data-form-role="shared-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const payload = { title, client: fd.get('client') || '', dueDate: fd.get('dueDate') || '', status: fd.get('status') || 'todo', color: fd.get('color') || '', link: fd.get('link') || '', notes: fd.get('notes') || '', updatedBy: currentEditorName(), updatedAt: Date.now() };
      if (S.shared.editingId) saveSharedProjItems(sharedProjItems.map(p => p.id === S.shared.editingId ? { ...p, ...payload } : p));
      else saveSharedProjItems([{ id: uid(), serial: nextSharedSerial(sharedProjItems), createdAt: Date.now(), parentId: S.shared.currentParentId || null, ...payload }, ...sharedProjItems]);
      S.shared.modalOpen = false; S.shared.editingId = null;
      render();
    } else if (form.matches('[data-form-role="shared-move-form"]')) {
      const fd = new FormData(form);
      const targetParentId = fd.get('targetParentId') || null;
      const ids = new Set(S.shared.moveIds || []);
      if (ids.size) saveSharedProjItems(sharedProjItems.map(p => ids.has(p.id) ? { ...p, parentId: targetParentId, updatedBy: currentEditorName(), updatedAt: Date.now() } : p));
      S.shared.moveIds = null; S.shared.selectedIds = [];
      render();
    } else if (form.matches('[data-form-role="task-form"]')) {
      const fd = new FormData(form);
      const text = (fd.get('text') || '').toString().trim();
      if (!text) return;
      if (S.task.editingId) saveTodayTasks(todayTasks.map(t => t.id === S.task.editingId ? { ...t, text } : t));
      else saveTodayTasks([...todayTasks, { id: uid(), text, color: TASK_COLOR_PALETTE[todayTasks.length % TASK_COLOR_PALETTE.length], createdAt: Date.now() }]);
      S.task.modalOpen = false; S.task.editingId = null;
      render();
    } else if (form.matches('[data-form-role="shortcut-form"]')) {
      const fd = new FormData(form);
      const name = (fd.get('name') || '').toString().trim();
      const url = normalizeUrl((fd.get('url') || '').toString());
      if (!name || !url) return;
      const iconDomain = (fd.get('iconDomain') || '').toString().trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
      if (S.shortcut.editingId) saveShortcuts(shortcuts.map(x => x.id === S.shortcut.editingId ? { ...x, name, url, iconDomain } : x));
      else saveShortcuts([...shortcuts, { id: uid(), name, url, iconDomain }]);
      S.shortcut.modalOpen = false; S.shortcut.editingId = null;
      render();
    } else if (form.matches('[data-form-role="note-form"]')) {
      const fd = new FormData(form);
      const content = (fd.get('content') || '').toString().trim();
      if (!content) return;
      const title = (fd.get('title') || '').toString().trim();
      if (S.note.editingId) saveNotes(notes.map(n => n.id === S.note.editingId ? { ...n, title, content } : n));
      else saveNotes([...notes, { id: uid(), title, content, color: TASK_COLOR_PALETTE[notes.length % TASK_COLOR_PALETTE.length], createdAt: Date.now() }]);
      S.note.modalOpen = false; S.note.editingId = null;
      render();
    } else if (form.matches('[data-form-role="shoot-form"]')) {
      const fd = new FormData(form);
      const params = paramsFromShootForm(fd);
      if (S.shoot.editingParamsId) {
        saveShoots(shoots.map(s => s.id === S.shoot.editingParamsId ? { ...s, ...params } : s));
        S.shoot.formOpen = false; S.shoot.editingParamsId = null;
        render();
      } else {
        finalizeNewShoot(params, buildRecommendation(params));
      }
    }
  });

  /* keyboard: Enter in category-add input */
  root.addEventListener('keydown', (e) => {
    if (e.target.id === 'newCategoryNameInput' && e.key === 'Enter') {
      e.preventDefault();
      const name = e.target.value.trim();
      if (!name) return;
      if (eqCategories.some(c => c.label === name)) { window.alert('이미 있는 카테고리예요.'); return; }
      saveEqCategories([...eqCategories, { id: `cat-${Date.now()}`, label: name, abbr: name.slice(0, 2), color: CATEGORY_COLOR_PALETTE[eqCategories.length % CATEGORY_COLOR_PALETTE.length] }]);
      render();
    }
  });

  /* drag & drop: equipment photo zone + equipment category re-sort + 패킹 가방 재배치 */
  root.addEventListener('dragover', (e) => {
    const zone = e.target.closest('[data-dropzone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('drag-over');
    if (zone.dataset.dropzone === 'eq-cat') e.dataTransfer.dropEffect = e.altKey ? 'copy' : 'move';
  });
  root.addEventListener('dragleave', (e) => {
    const zone = e.target.closest('[data-dropzone]');
    if (!zone) return;
    zone.classList.remove('drag-over');
  });
  root.addEventListener('drop', async (e) => {
    const zone = e.target.closest('[data-dropzone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (zone.dataset.dropzone === 'eq-photo') {
      currentEqPhotoError = '';
      const files = e.dataTransfer.files;
      if (files && files.length > 0) { await handlePhotoFile(files[0]); return; }
      const url = extractDroppedImageUrl(e.dataTransfer);
      if (!url) { currentEqPhotoError = '이미지를 인식하지 못했어요. 이미지 자체를 드래그해줘.'; refreshEqPhotoZone(); return; }
      try { currentEqPhoto = await resizeFromUrl(url); }
      catch (err) { currentEqPhoto = url; currentEqPhotoError = '외부 이미지 링크로 저장했어요. 인터넷이 연결되어 있어야 보여요.'; }
      refreshEqPhotoZone();
    } else if (zone.dataset.dropzone === 'eq-cat') {
      const eqId = e.dataTransfer.getData('application/x-eq-id');
      if (!eqId) return;
      const src = eqById(eqId);
      if (!src) return;
      const targetCat = zone.dataset.catId;
      if (e.altKey) {
        const { id: _oldId, serial: _oldSerial, createdAt: _oldCreated, ...rest } = src;
        saveEqItems([{ ...rest, id: uid(), serial: nextSerial(eqItems), category: targetCat, createdAt: Date.now() }, ...eqItems]);
      } else {
        saveEqItems(eqItems.map(it => it.id === eqId ? { ...it, category: targetCat } : it));
      }
      render();
    } else if (zone.dataset.dropzone === 'pack-bag') {
      const itemId = e.dataTransfer.getData('application/x-pack-id');
      if (!itemId) return;
      const shoot = shoots.find(s => s.id === S.shoot.selectedShootId);
      if (!shoot) return;
      const targetBagId = zone.dataset.bagId === 'none' ? '' : zone.dataset.bagId;
      const overrides = { ...(shoot.bagOverrides || {}), [itemId]: targetBagId };
      saveShoots(shoots.map(s => s.id === shoot.id ? { ...s, bagOverrides: overrides } : s));
      refreshShootPackList();
    } else if (zone.dataset.dropzone === 'proj-row') {
      const draggedId = e.dataTransfer.getData('application/x-proj-row-id');
      const targetId = zone.dataset.id;
      if (!draggedId || draggedId === targetId) return;
      const isShared = S.activeTab === 'shared';
      const list = isShared ? sharedProjItems : projItems;
      const dragged = list.find(p => p.id === draggedId);
      const target = list.find(p => p.id === targetId);
      if (!dragged || !target) return;
      if ((dragged.parentId || null) !== (target.parentId || null)) return;
      const rect = zone.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      const without = list.filter(p => p.id !== draggedId);
      const targetIdx = without.findIndex(p => p.id === targetId);
      const insertAt = before ? targetIdx : targetIdx + 1;
      const next = [...without.slice(0, insertAt), dragged, ...without.slice(insertAt)];
      if (isShared) saveSharedProjItems(next); else saveProjItems(next);
      render();
    }
  });
  root.addEventListener('dragstart', (e) => {
    const eqCard = e.target.closest('[data-drag-eq-id]');
    if (eqCard) { e.dataTransfer.setData('application/x-eq-id', eqCard.dataset.dragEqId); e.dataTransfer.effectAllowed = 'copyMove'; return; }
    const packRow = e.target.closest('[data-drag-pack-id]');
    if (packRow) { e.dataTransfer.setData('application/x-pack-id', packRow.dataset.dragPackId); e.dataTransfer.effectAllowed = 'move'; return; }
    const projRow = e.target.closest('[data-drag-row-id]');
    if (projRow) { e.dataTransfer.setData('application/x-proj-row-id', projRow.dataset.dragRowId); e.dataTransfer.effectAllowed = 'move'; return; }
  });

  /* paste image into equipment modal */
  window.addEventListener('paste', async (e) => {
    if (!S.eq.modalOpen) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) { e.preventDefault(); await handlePhotoFile(file); }
        return;
      }
    }
  });

  /* 프로젝트/공유 프로젝트 하위 드릴다운도 브라우저 뒤로가기로 한 단계씩 빠져나오게 히스토리에 반영 */
  history.replaceState({ projParentId: S.proj.currentParentId || null, sharedParentId: S.shared.currentParentId || null }, '');
  window.addEventListener('popstate', (e) => {
    const state = e.state || {};
    if ('sharedParentId' in state) {
      S.shared.currentParentId = state.sharedParentId || null;
      S.shared.statusFilter = 'all';
      S.shared.search = '';
      S.activeTab = 'shared';
    } else {
      S.proj.currentParentId = state.projParentId || null;
      S.proj.statusFilter = 'all';
      S.proj.search = '';
      S.activeTab = 'projects';
    }
    render();
  });

  /* Esc closes whichever modal is open */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    let changed = false;
    if (S.eq.modalOpen) { S.eq.modalOpen = false; S.eq.editingId = null; currentEqPhoto = ''; changed = true; }
    if (S.eq.detailId) { S.eq.detailId = null; changed = true; }
    if (S.eq.categoryModalOpen) { S.eq.categoryModalOpen = false; changed = true; }
    if (S.sched.modalOpen) { S.sched.modalOpen = false; S.sched.editingId = null; changed = true; }
    if (S.sched.detailId) { S.sched.detailId = null; changed = true; }
    if (S.proj.modalOpen) { S.proj.modalOpen = false; S.proj.editingId = null; changed = true; }
    if (S.proj.statusMenu) { S.proj.statusMenu = null; changed = true; }
    if (S.proj.rowMenu) { S.proj.rowMenu = null; changed = true; }
    if (S.settingsOpen) { S.settingsOpen = false; changed = true; }
    if (S.shared.modalOpen) { S.shared.modalOpen = false; S.shared.editingId = null; changed = true; }
    if (S.shared.statusMenu) { S.shared.statusMenu = null; changed = true; }
    if (S.shared.rowMenu) { S.shared.rowMenu = null; changed = true; }
    if (S.shoot.formOpen) { S.shoot.formOpen = false; S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; changed = true; }
    if (S.task.modalOpen) { S.task.modalOpen = false; S.task.editingId = null; changed = true; }
    if (S.note.modalOpen) { S.note.modalOpen = false; S.note.editingId = null; changed = true; }
    if (S.shortcut.modalOpen) { S.shortcut.modalOpen = false; S.shortcut.editingId = null; changed = true; }
    if (gcal.modalOpen) { gcal.modalOpen = false; changed = true; }
    if (S.moreOpen) { S.moreOpen = false; changed = true; }
    if (gcal.detailId) { gcal.detailId = null; changed = true; }
    if (changed) render();
  });

  initCloudSync();
}

document.addEventListener('DOMContentLoaded', () => {
  if (GUEST_MODE) {
    if (!localStorage.getItem(GUEST_NAME_KEY)) showGuestNameGate(); else bootApp();
    return;
  }
  if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') { bootApp(); return; }
  let booted = false;
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      if (!booted) { booted = true; bootApp(); }
    } else {
      showLoginGate();
    }
  });
});
</script>

  :root {
    /* 블랙 테마: 갈색/노랑 기운 없이 차분한 그래파이트 + 블루 포인트 (화이트 테마는 아래 [data-theme="light"]) */
    --bg: #101216; --surface: #171a20; --surface-hover: #1f232b; --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.24); --sidebar-bg: #14171c; --shadow-sm: 0 1px 2px rgba(0,0,0,0.4); --shadow-md: 0 8px 22px rgba(0,0,0,0.45); --shadow-lg: 0 24px 60px rgba(0,0,0,0.6);
    --row-bg: #1b1f26; --row-bg-hover: #232832; --row-border: rgba(255,255,255,0.10); --row-title: #f1f3f7; --row-text: #c4c9d3;
    --text: #eceef2; --text-dim: #a4abb8; --text-faint: #767e8d;

    --font-body: 'Paperozi', 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;

    --font-display: 'Anton', sans-serif;
  }
  /* 화이트 테마 — 설정(⚙️)에서 전환, <html data-theme="light">. 색은 전부 변수로만 바꿔서 화면별 수정이 필요 없게 함. */
  :root[data-theme="light"] {
    --bg: #f6f7f9; --surface: #ffffff; --surface-hover: #f1f3f7; --border: rgba(20,28,45,0.10); --border-strong: rgba(20,28,45,0.22);
    --text: #14171f; --text-dim: #566070; --text-faint: #8a93a3;
    --accent: #2f6fee; --accent-soft: rgba(47,111,238,0.10);
    --sidebar-bg: #ffffff; --shadow-sm: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.05); --shadow-md: 0 6px 18px rgba(16,24,40,0.09); --shadow-lg: 0 24px 60px rgba(16,24,40,0.22);
    --row-bg: #ffffff; --row-bg-hover: #f5f8ff; --row-border: rgba(20,28,45,0.10); --row-title: #14171f; --row-text: #3a4353;
  }
  :root[data-theme="light"] .eq-add-btn, :root[data-theme="light"] .eq-modal-submit, :root[data-theme="light"] .eq-cat-add-row button, :root[data-theme="light"] .sched-dday-badge.is-today { color:#fff; }
  :root[data-theme="light"] .eq-confirm-bar { background:rgba(255,255,255,0.96); }
  /* .eq-modal-overlay 계열(예: 스케줄 등록 모달)은 프로젝트 탭 등 다른 화면 위에서도 뜰 수 있게
     .app-shell 밖(전역 render())에서도 렌더링된다 — 그래서 위 색상 변수들은 .app-shell이 아니라
     :root에 둬야 한다. .app-shell 안에만 정의하면 그 바깥 요소는 변수를 못 받아 화면이 새까맣게 보인다
     (실제로 그 버그가 있었음). */

    display: flex; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body);
  }
  .app-shell * { box-sizing: border-box; }
  .app-main { margin-left: 168px; width: 100%; padding: 32px 28px 60px; }

  .side-nav-mark { width: 100%; text-align: center; color: var(--accent); font-size: 10px; margin-bottom: 18px; }

  .side-nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .side-nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
