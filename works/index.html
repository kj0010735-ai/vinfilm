  .cal-bar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:14px; }
  .cal-nav { display:flex; gap:6px; }
  .cal-nav-btn, .cal-today-btn { height:36px; min-width:36px; padding:0 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:var(--font-body); font-size:16px; cursor:pointer; transition:background .15s ease, border-color .15s ease; }
  .cal-today-btn { font-size:13px; font-weight:600; }
  .cal-nav-btn:hover, .cal-today-btn:hover { background:var(--surface-hover); border-color:var(--border-strong); }
  .cal-title { font-size:19px; font-weight:800; letter-spacing:-0.02em; text-align:center; white-space:nowrap; }
  .cal-seg { justify-self:end; display:flex; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:3px; }
  .cal-seg button { border:none; background:none; color:var(--text-dim); font-family:var(--font-body); font-size:13px; font-weight:600; padding:6px 14px; border-radius:8px; cursor:pointer; transition:background .18s ease, color .18s ease; }
  .cal-seg button.on { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }
  .cal { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .cal-head { display:grid; grid-template-columns:repeat(7, 1fr); background:var(--bg); border-bottom:1px solid var(--border); }
  .cal-head div { text-align:center; font-size:12px; font-weight:700; color:var(--text-faint); padding:10px 0; }
  .cal-head .is-sun, .cal-cell.is-sun .cal-daynum { color:#e5534b; }
  .cal-head .is-sat, .cal-cell.is-sat .cal-daynum { color:#4a7dff; }
  .cal-body { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); }
  .cal-cell { position:relative; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:6px 6px 8px; min-width:0; cursor:pointer; transition:background .15s ease; }
  .cal-cell:nth-child(7n) { border-right:none; }
  .cal-cell:hover { background:var(--surface-hover); }
  .cal-cell.is-outside { background:var(--bg); }
  .cal-cell.is-outside .cal-daynum, .cal-cell.is-outside .cal-ev { opacity:.45; }
  .cal-daynum { display:flex; justify-content:flex-end; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:4px; }
  .cal-daynum span { min-width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:0 6px; }
  .cal-cell.is-today { background:var(--accent-soft); }
  .cal-cell.is-today .cal-daynum span { background:var(--accent); color:#fff; }
  .cal-evs { display:flex; flex-direction:column; gap:3px; }
  .cal-ev { display:flex; align-items:center; gap:5px; width:100%; text-align:left; border:none; border-left:3px solid var(--ev); background:color-mix(in srgb, var(--ev) 14%, transparent); color:var(--text); border-radius:6px; padding:3px 7px; font-family:var(--font-body); font-size:11.5px; font-weight:600; cursor:pointer; overflow:hidden; transition:filter .15s ease, transform .15s ease; }
  .cal-ev:hover { filter:brightness(1.08); transform:translateX(1px); }
  .cal-ev.is-past { opacity:.6; }
  .cal-ev-time { color:var(--text-dim); font-weight:500; flex-shrink:0; }
  .cal-ev-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-more { border:none; background:none; color:var(--text-faint); font-family:var(--font-body); font-size:11px; font-weight:600; text-align:left; padding:1px 4px; cursor:pointer; }
  .cal-more:hover { color:var(--accent); }
  .cal-week .cal-ev { font-size:12.5px; padding:6px 8px; }
  .cal-card #schedList { margin-top:4px; }
  @media (max-width: 860px) {
    .cal-bar { grid-template-columns:1fr auto; } .cal-title { grid-column:1 / -1; order:-1; }
    .cal-card { padding:10px; } .cal-ev-time { display:none; } .cal-ev { font-size:10.5px; padding:2px 4px; }
  }

  /* 캘린더 꽉 채우기 + 휴대폰 연결 */
  .cal { display:flex; flex-direction:column; }
  .cal-head { flex:0 0 auto; }
  .cal-body { flex:1 1 auto; min-height:0; }
  .cal-cell { overflow:hidden; }
  .cal-evs { overflow:hidden; }
  .cal-ev.is-phone { border-left-style:dotted; }
  .gcal-btn.is-on { background:var(--surface); color:var(--text); border:1px solid var(--border); }
  .gcal-btn.is-warn { background:var(--surface); color:#e0a63c; border:1px solid #e0a63c; }
  .gcal-notice { background:var(--accent-soft); border:1px solid var(--border); color:var(--text-dim); border-radius:12px; padding:10px 14px; font-size:12.5px; margin:0 0 14px; line-height:1.6; }
  .gcal-notice.is-warn { color:var(--text); border-color:#e0a63c; background:rgba(224,166,60,0.12); }
  .gcal-notice a { color:var(--accent); font-weight:700; }
  .gcal-steps { margin:0 0 14px; padding:0; list-style:none; counter-reset:step; display:flex; flex-direction:column; gap:12px; }
  .gcal-steps li { counter-increment:step; position:relative; padding:12px 14px 12px 46px; border:1px solid var(--border); border-radius:12px; background:var(--bg); font-size:12.5px; color:var(--text-dim); line-height:1.6; }
  .gcal-steps li::before { content:counter(step); position:absolute; left:14px; top:12px; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .gcal-steps li.done::before { content:'✓'; background:var(--accent); color:#fff; }
  .gcal-steps li > b { display:block; color:var(--text); font-size:13.5px; margin-bottom:3px; }
  .gcal-steps li > span { display:block; }
  .gcal-steps li > em { display:block; font-style:normal; color:var(--accent); font-weight:700; margin-top:6px; }

  /* ================= 대시보드 카드 ================= */
  .dash-hello h1 { font-size:28px; font-weight:800; letter-spacing:-0.025em; margin:4px 0 6px; }
  .dash-hello p { font-size:15px; color:var(--text-dim); margin:0 0 22px; }
  .dash-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 22px; box-shadow:var(--shadow-sm); margin-bottom:16px; }
  .dash-quick { display:none; }
  .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:6px; }
  .dash-grid .dash-card { margin-bottom:0; }
  .dash-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .dash-card-head h2 { font-size:16px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .dash-card-head h2 small { font-size:14px; font-weight:700; color:var(--text-dim); }
  .dash-more { border:none; background:none; color:var(--text-faint); font-family:var(--font-body); font-size:13px; cursor:pointer; padding:4px 0; }
  .dash-more:hover { color:var(--accent); }
  .dash-empty { color:var(--text-faint); font-size:15px; margin:10px 0 6px; }
  .dash-list { display:flex; flex-direction:column; }
  .dash-row { display:flex; align-items:center; gap:12px; width:100%; border:none; border-top:1px solid var(--border); background:none; padding:11px 2px; text-align:left; color:var(--text); cursor:pointer; font-family:var(--font-body); }
  .dash-row:first-child { border-top:none; }
  .dash-row:hover .dash-row-main b { color:var(--accent); }
  .dash-date { width:40px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .dash-date b { font-size:18px; font-weight:800; }
  .dash-date small { font-size:11px; color:var(--text-faint); margin-top:2px; }
  .dash-date.is-today b, .dash-date.is-today small { color:var(--accent); }
  .dash-row-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .dash-row-main b { font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s ease; }
  .dash-row-main small { font-size:12px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dash-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dash-pill { font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:8px; white-space:nowrap; flex-shrink:0; }
  .dash-tile { display:flex; flex-direction:column; align-items:center; gap:9px; border:none; background:none; color:var(--text); font-family:var(--font-body); font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
  .dash-tile:active .dash-tile-ic { transform:scale(.94); }
  .dash-tile-ic { width:62px; height:62px; border-radius:19px; display:flex; align-items:center; justify-content:center; transition:transform .15s ease; }
  .dash-tile-ic svg, .m-tab svg, .m-icon-btn svg, .m-sheet-ic svg, .m-sheet-row i svg { fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .dash-tile-ic svg { width:28px; height:28px; }
  .t-blue { background:rgba(74,125,255,0.14); color:#4a7dff; } .t-violet { background:rgba(139,92,246,0.14); color:#8b5cf6; }
  .t-green { background:rgba(46,164,110,0.14); color:#2ea46e; } .t-slate { background:rgba(100,116,139,0.16); color:#64748b; }
  .t-orange { background:rgba(234,124,52,0.15); color:#ea7c34; } .t-yellow { background:rgba(214,158,20,0.16); color:#c98f0c; }
  .t-teal { background:rgba(20,160,160,0.14); color:#14a0a0; }
  :root:not([data-theme="light"]) .t-slate { color:#94a3b8; }
  .dash-section-head { margin-top:18px; }

  /* ================= 모바일(아이폰) 레이아웃 ================= */
  .m-topbar, .m-tabbar { display:none; }
  @media (max-width: 720px) {
    .side-nav { display:none !important; }
    .app-main { margin-left:0 !important; padding:0 16px calc(96px + env(safe-area-inset-bottom)) !important; }
    .m-topbar { display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:40; margin:0 -16px 18px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px 18px; background:color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); }
    .m-logo { height:30px; width:auto; border-radius:4px; display:block; }
    .m-top-actions { display:flex; align-items:center; gap:4px; }
    .m-sync { color:var(--text-faint); font-size:15px; margin-right:4px; }
    .m-icon-btn { width:42px; height:42px; border:none; background:none; color:var(--text); display:flex; align-items:center; justify-content:center; border-radius:12px; -webkit-tap-highlight-color:transparent; }
    .m-icon-btn svg { width:25px; height:25px; }
    .m-tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:60; padding:7px 4px calc(7px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border-top:1px solid var(--border); }
    .m-tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; border:none; background:none; color:var(--text-faint); font-family:var(--font-body); font-size:11px; font-weight:600; padding:4px 0; -webkit-tap-highlight-color:transparent; transition:color .15s ease; }
    .m-tab svg { width:26px; height:26px; transition:transform .2s cubic-bezier(.2,.8,.2,1); }
    .m-tab.on { color:var(--text); font-weight:800; }
    .m-tab.on svg { transform:scale(1.06); stroke-width:2; }
    .m-sheet-backdrop { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,0.38); animation:fadeIn .2s ease both; }
    .m-sheet { position:fixed; left:0; right:0; bottom:0; z-index:71; background:var(--surface); border-radius:22px 22px 0 0; padding:8px 12px calc(14px + env(safe-area-inset-bottom)); box-shadow:var(--shadow-lg); animation:sheetUp .3s cubic-bezier(.2,.8,.2,1) both; }
    .m-sheet-grip { width:40px; height:5px; border-radius:3px; background:var(--border-strong); margin:4px auto 10px; }
    .m-sheet-row { display:flex; align-items:center; gap:14px; width:100%; padding:14px 10px; border:none; background:none; color:var(--text); font-family:var(--font-body); font-size:16px; font-weight:600; text-decoration:none; border-radius:14px; text-align:left; -webkit-tap-highlight-color:transparent; }
    .m-sheet-row:active { background:var(--surface-hover); }
    .m-sheet-row.is-dim { color:var(--text-faint); }
    .m-sheet-ic { width:40px; height:40px; border-radius:12px; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .m-sheet-ic svg { width:22px; height:22px; }
    .m-sheet-row i { margin-left:auto; color:var(--text-faint); display:flex; }
    .m-sheet-row i svg { width:18px; height:18px; }
    .dash-hello h1 { font-size:26px; }
    .dash-quick { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px 4px; padding:22px 10px; }
    .dash-tile { font-size:12.5px; }
    .dash-tile-ic { width:58px; height:58px; border-radius:18px; }
    .dash-grid { grid-template-columns:1fr; }
    .dash-card { border-radius:18px; padding:18px; }
    .eq-header { gap:12px; margin-bottom:18px; }
    .eq-header > div:last-child { flex-wrap:wrap; }
    .eq-title { font-size:24px; }
    .eq-add-btn { padding:10px 16px; font-size:13.5px; }
    .eq-modal-overlay { align-items:flex-end; padding:0; }
    .eq-modal { max-width:100% !important; border-radius:22px 22px 0 0; max-height:90vh; padding-bottom:calc(22px + env(safe-area-inset-bottom)); }
    .tab-enter { animation-duration:.28s; }
  }

  /* 폰에서는 프로젝트 행을 2줄 카드로: 1줄 상태·마감(D-day) / 2줄 제목 */
  @media (max-width: 720px) {
    .proj-list .proj-row-head { display:none !important; }
    .proj-row, .proj-list.select-mode .proj-row { grid-template-columns:auto 1fr auto !important; grid-template-areas:"status due chev" "title title chev"; gap:8px 10px; padding:14px 14px 14px 16px; }
    .proj-row-status-cell { grid-area:status; }
    .proj-row-due-cell { grid-area:due; display:flex; align-items:center; justify-content:flex-end; gap:6px; }
    .proj-row-due-cell .proj-row-due-input { width:auto; margin:0; font-size:12px; }
    .proj-row-due-cell .proj-row-dday { margin-top:0; }
    .proj-row-title-cell { grid-area:title; min-width:0; }
    .proj-row-title { font-size:15.5px; }
    .proj-row-actions-cell { grid-area:chev; }
    .proj-row-check-cell { display:none !important; }
  }
  @keyframes sheetUp { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes modalIn { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
</style>
