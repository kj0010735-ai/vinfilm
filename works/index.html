   맥·PC는 범위를 works/로 좁힌 manifest-desktop.webmanifest를 쓴다 — 그래야 Chrome에서 수입지출(ledger/)을 별도 앱으로 설치할 수 있다.
   두 파일은 scope만 다르니 하나를 고치면 다른 쪽도 같이 고칠 것. */
if (!/iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) document.getElementById('manifestLink').href = 'manifest-desktop.webmanifest';

<script>
/* 설치한 앱(Chrome)에 스트림덱 버튼 등으로 다른 화면 주소가 들어오면 새 창을 띄우지 않고 이 창에서 그 화면으로 간다
   — works/manifest.webmanifest의 launch_handler(focus-existing)와 짝. 같은 화면이면 아무것도 안 해서 보던 상태가 유지된다. */
if ('launchQueue' in window) launchQueue.setConsumer(function (p) {
  if (!p || !p.targetURL) return;
  var u = new URL(p.targetURL);
  if (u.origin === location.origin && u.pathname !== location.pathname) location.href = u.href;
});
</script>

'use strict';

/* ================= shared helpers ================= */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function colorMarkerStyle(color, basePadding) {
  if (!color) return '';
  return `--row-tint:${color}22; border-left:6px solid ${color}; padding-left:${basePadding - 6}px;`;
}
/* 메모 속 http(s) 주소를 눌러서 바로 열리는 링크로 — esc() 한 뒤에 감싸므로 안전. 링크를 눌러도 카드 클릭(data-action)이
   같이 실행되지 않게 stopPropagation. 끝에 붙은 문장부호/괄호는 링크에서 뺀다. */
/* 시간 입력: 휠 대신 타이핑. "8:30" "830" "20" "1930" "8시 30분" "8시반" "오후 2시" "pm 7" 등을 HH:MM으로 바꾼다.
   오전/오후 표시가 없으면 적힌 숫자 그대로(24시간제)로 본다 — 입력칸 옆 미리보기로 확인. */
function parseTimeInput(raw) {
  let s = String(raw || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return '';
  let pm = /오후|저녁|밤|pm|p\.m/.test(s), am = /오전|아침|새벽|am|a\.m/.test(s);
  s = s.replace(/오후|저녁|밤|오전|아침|새벽|p\.?m\.?|a\.?m\.?/g, '');
  let h, m = 0, mt;
  if ((mt = s.match(/^(\d{1,2})시(?:(\d{1,2})분?|반)?$/))) { h = +mt[1]; m = s.includes('반') ? 30 : (mt[2] ? +mt[2] : 0); }
  else if ((mt = s.match(/^(\d{1,2})[:.](\d{1,2})$/))) { h = +mt[1]; m = +mt[2]; }
  else if ((mt = s.match(/^(\d{3,4})$/))) { h = +mt[1].slice(0, -2); m = +mt[1].slice(-2); }
  else if ((mt = s.match(/^(\d{1,2})$/))) { h = +mt[1]; }
  else return null;
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (h > 23 || m > 59) return null;
  return `${pad2(h)}:${pad2(m)}`;
}
function timeLabelKo(hhmm) { if (!hhmm) return ''; const [h, m] = hhmm.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h % 12 === 0 ? 12 : h % 12}:${pad2(m)}`; }
const TIME_CHIPS = ['09:00', '10:00', '13:00', '14:00', '18:00', '19:00', '20:00'];
function timeFieldHtml(name, value, attrs = '') {
  return `<div class="time-field"><input type="text" name="${name}" class="time-input" data-role="time-input" autocomplete="off" inputmode="text" value="${esc(value || '')}" placeholder="예: 8:30, 오후 2시, 1930" ${attrs} />
    <div class="time-hint" data-time-hint>${value ? timeLabelKo(value) : '비우면 하루 종일'}</div>
    <div class="time-chips">${TIME_CHIPS.map(t => `<button type="button" class="time-chip" data-action="time-chip" data-id="${t}">${timeLabelKo(t).replace(':00', '시')}</button>`).join('')}</div></div>`;
}
/* 메모 편집 칸: 굵게(⌘B)가 별표가 아니라 진짜 굵은 글씨로 보이는 편집 칸.
   화면은 contenteditable, 저장 값은 예전과 같은 "**굵게**" 텍스트(숨긴 textarea에 계속 옮겨 적는다 — FormData가 그대로 읽음). */
function richMemoHtml(name, value, placeholder) {
  const html = esc(value || '').replace(/\*\*([^*\n][^\n]*?)\*\*/g, '<b>$1</b>');
  return `<div class="rich-memo" contenteditable="true" data-rich="1" data-placeholder="${esc(placeholder || '')}">${html}</div><textarea name="${name}" hidden>${esc(value || '')}</textarea>`;
}
function richMemoText(el) {
  const isBold = (n) => n.nodeType === 1 && (/^(B|STRONG)$/.test(n.tagName) || /^(bold|[6-9]00)$/.test(n.style && n.style.fontWeight || ''));
  const walk = (node, bold) => {
    let out = '';
    node.childNodes.forEach((n, i) => {
      if (n.nodeType === 3) {
        const t = n.nodeValue;
        out += bold ? t.split('\n').map(l => l.trim() ? l.replace(/^(\s*)([\s\S]*?)(\s*)$/, '$1**$2**$3') : l).join('\n') : t;
      } else if (n.nodeType === 1) {
        if (n.tagName === 'BR') { out += '\n'; return; }
        const block = /^(DIV|P|LI)$/.test(n.tagName);
        if (block && out && !out.endsWith('\n')) out += '\n';
        out += walk(n, bold || isBold(n));
        if (block && !out.endsWith('\n')) out += '\n';
      }
    });
    return out;
  };
  // 붙어 있는 굵은 조각(**a****b**)은 하나로 합치고, 끝의 빈 줄 하나는 편집 칸이 붙인 것이라 뺀다
  return walk(el, false).replace(/\*\*\*\*/g, '').replace(/\n$/, '');
}
function richMemoSync(el) { const ta = el.nextElementSibling; if (ta && ta.tagName === 'TEXTAREA') ta.value = richMemoText(el); }
document.addEventListener('input', (e) => { const el = e.target.closest && e.target.closest('[data-rich]'); if (el) richMemoSync(el); });
document.addEventListener('submit', (e) => { e.target.querySelectorAll && e.target.querySelectorAll('[data-rich]').forEach(richMemoSync); }, true);
document.addEventListener('paste', (e) => {
  const el = e.target.closest && e.target.closest('[data-rich]'); if (!el) return;
  e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
});
document.addEventListener('keydown', (e) => {
  const el = e.target.closest && e.target.closest('[data-rich]'); if (!el) return;
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); document.execCommand('insertLineBreak'); }
});
function linkify(text, opts) {
  let html = esc(text);
  // ⌘B로 넣은 **굵게** 표시를 굵은 글씨로(편집 칸 안에서는 기호를 그대로 둬야 저장 때 안 사라져서 opts.bold=false)
  if (!opts || opts.bold !== false) html = html.replace(/\*\*([^*\n][^\n]*?)\*\*/g, '<b>$1</b>');
  return html.replace(/https?:\/\/(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<>"'])+/g, (m) => {
    const trail = (m.match(/[).,;:!?\]}]+$/) || [''])[0];
    const url = trail ? m.slice(0, -trail.length) : m;
    return `<a class="memo-link" href="${url}" target="_blank" rel="noopener" onclick="openMemoLink(event)">${url}</a>${trail}`;
  });
}
/* 편집 가능한(contenteditable) 행 메모 안의 링크는 브라우저가 열어주지 않아서 직접 연다. 저장은 textContent라 링크 태그는 저장되지 않음 */
function openMemoLink(e) {
  e.stopPropagation();
  const a = e.target.closest && e.target.closest('a.memo-link');
  if (a && a.closest('[contenteditable="true"]')) { e.preventDefault(); window.open(a.href, '_blank', 'noopener'); }
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
const WEEKDAYS_KO = ['일','월','화','수','목','금','토'];
function dateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${m}월 ${d}일 (${WEEKDAYS_KO[dt.getDay()]})`;
}
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,9)}`; }
function formatUpdated(ts) { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

/* ================= image helpers ================= */
function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('이미지를 읽을 수 없어요'));
    img.src = src;
  });
}
function drawResized(img, maxDim = 480, quality = 0.72) {
  let { width, height } = img;
  if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
  else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}
function resizeImage(file, maxDim = 480, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = async () => {
      try { resolve(drawResized(await loadImageElement(reader.result), maxDim, quality)); }
      catch (err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}
async function resizeFromUrl(url, maxDim = 480, quality = 0.72) {
  const resp = await fetch(url, { mode: 'cors' });
  if (!resp.ok) throw new Error('fetch failed');
  const blob = await resp.blob();
  const objectUrl = URL.createObjectURL(blob);
  try { return drawResized(await loadImageElement(objectUrl), maxDim, quality); }
  finally { URL.revokeObjectURL(objectUrl); }
}
function extractDroppedImageUrl(dataTransfer) {
  let url = dataTransfer.getData('text/uri-list') || dataTransfer.getData('text/plain');
  if (url && /^https?:\/\//i.test(url.trim())) return url.trim();
  const html = dataTransfer.getData('text/html');
  if (html) { const m = /<img[^>]+src="([^"]+)"/i.exec(html); if (m) return m[1]; }
  return null;
}

/* 협업자 공간: works/?c={32자 hex}. 협업자마다 다른 공간(collabs/{id})이고, 그 공간에 배정된 공유 프로젝트(sharedProjects.collabId)와
   캘린더 일정(schedule.collabId)만 보인다. 공간마다 접속 방식이 다르다 — 'link'(링크만 알면 로그인 없이) / 'login'(등록된 구글 계정만).
   ?guest=1은 예전 공용 링크 — 규칙상 collabId 없는 공유 프로젝트는 더 이상 못 읽는다(장비목록만 보임). */
const COLLAB_ID = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
const COLLAB_MODE = /^[0-9a-f]{32}$/.test(COLLAB_ID);
const GUEST_MODE = new URLSearchParams(location.search).get('guest') === '1' || COLLAB_MODE;

const LS_NS = COLLAB_MODE ? '-c' + COLLAB_ID.slice(0, 8) : '';
const IS_LOCAL_DEV = ['localhost', '127.0.0.1', ''].includes(location.hostname) || location.protocol === 'file:';

async function pushToCloud(name, prevArr, nextArr) {
  if (!window.cloudSync || !window.cloudSyncReady) return;
  const prevIds = new Set(prevArr.map(x => x.id));
  const nextIds = new Set(nextArr.map(x => x.id));
  const toDelete = [...prevIds].filter(id => !nextIds.has(id));
  try {
    if (nextArr.length) await window.cloudSync.upsertMany(name, nextArr);
    if (toDelete.length) await window.cloudSync.deleteMany(name, toDelete);
  } catch (e) { console.warn('cloud sync push failed for', name, e); }
}

function initCloudSync() {
  if (IS_LOCAL_DEV) {
    console.warn('로컬 환경(localhost/file://)이라 클라우드 동기화를 켜지 않았어요 — localStorage만으로 동작합니다. 실제 운영 데이터는 안전해요.');
    return;
  }
  if (typeof firebase === 'undefined') {
    console.warn('Firebase SDK를 불러오지 못했어요 (인터넷 연결 확인). 로컬 저장 모드로 계속 동작합니다.');
    return;
  }
  try {
    const db = firebase.firestore();
    window.cloudSync = {
      async upsertMany(name, items) { await Promise.all(items.map(it => db.collection(name).doc(String(it.id)).set(it))); },
      async deleteMany(name, ids) { await Promise.all(ids.map(id => db.collection(name).doc(String(id)).delete())); },
    };
    const names = COLLAB_MODE ? ['sharedProjects', 'schedule', 'notices', ...(collabInfo && collabInfo.showEquipment ? ['equipment', 'categories'] : [])]
      : GUEST_MODE ? GUEST_CLOUD_COLLECTIONS : CLOUD_COLLECTIONS;
    names.forEach(name => {
      let initialized = false;
      let ref = db.collection(name);
      if (COLLAB_MODE && (name === 'sharedProjects' || name === 'schedule' || name === 'notices')) ref = ref.where('collabId', '==', COLLAB_ID);
      ref.onSnapshot(async (snap) => {
        const items = snap.docs.map(d => d.data());
        if (!initialized) {
          initialized = true;
          if (items.length === 0 && !GUEST_MODE) {
            const local = getLocalArrayFor(name) || [];
            if (local.length > 0) { await window.cloudSync.upsertMany(name, local); return; }
          }
        }
        applyCloudUpdate(name, items);
      }, (err) => console.warn('cloud sync listen error for', name, err));
    });
    window.cloudSyncReady = true;
    render();
  } catch (e) {
    console.warn('Firebase 초기화 실패, 로컬 저장 모드로 계속 동작합니다.', e);
    window.cloudSyncReady = false;
  }
}

/* ================= 새 버전 알림 + 자동 반영 (HISPLAN 운영툴과 같은 방식) =================
   홈 화면 앱은 켜둔 채 뒤로 보냈다가 다시 여는 경우가 많아서, 배포해도 옛 화면이 며칠씩 남는다.
   - 앱으로 돌아올 때(visibilitychange)와 켜져 있는 동안 20분마다 reg.update()로 새 버전 확인
   - 새 버전이 있으면 화면 아래 가운데 "새 버전이 나왔어요 [업데이트]" — 쓰던 글이 날아가지 않게 누를 때만 적용
   - 새 버전을 받아 둔 채 1분 넘게 뒤에 뒀다가 돌아오면 묻지 않고 바로 적용
   sw.js는 캐시를 안 하고 SKIP_WAITING 메시지만 처리한다. 알림 DOM은 #root 밖(body)에 붙여서 render()가 지우지 않는다. */
const appUpdate = { reg: null, pending: false, applying: false, hiddenAt: 0, started: false };
function renderUpdateToast() {
  let el = document.getElementById('updToast');
  if (!appUpdate.pending) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'updToast'; el.className = 'upd-toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = `<span>새 버전이 나왔어요</span><button type="button" ${appUpdate.applying ? 'disabled' : ''} onclick="applyAppUpdate()">${appUpdate.applying ? '적용 중…' : '업데이트'}</button>`;
}
function markUpdatePending() { if (appUpdate.pending) return; appUpdate.pending = true; renderUpdateToast(); }
function watchInstallingWorker(w) {
  if (!w) return;
  w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) markUpdatePending(); });
}
function checkAppUpdate() { if (appUpdate.reg && navigator.onLine) appUpdate.reg.update().catch(() => {}); }
function startAppUpdates() {
  if (appUpdate.started || !('serviceWorker' in navigator) || location.protocol === 'file:') return;
  appUpdate.started = true;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    appUpdate.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) markUpdatePending();
    watchInstallingWorker(reg.installing);
    reg.addEventListener('updatefound', () => watchInstallingWorker(reg.installing));
    setInterval(checkAppUpdate, 20 * 60 * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { appUpdate.hiddenAt = Date.now(); return; }
      if (appUpdate.pending && appUpdate.hiddenAt && Date.now() - appUpdate.hiddenAt > 60 * 1000) applyAppUpdate();
      else checkAppUpdate();
    });
  }).catch(() => {});
}
/* 라이브러리식 updateSW(true)는 아이폰에서 가끔 새로고침이 안 일어나 버튼이 먹통처럼 보여서 직접 처리한다.
   GitHub Pages가 HTML을 10분간 캐시하므로, 새로고침 전에 cache:'reload'로 한 번 받아 캐시를 갈아끼운다. */
function applyAppUpdate() {
  if (appUpdate.applying) return;
  appUpdate.applying = true; renderUpdateToast();
  let done = false;
  const reload = () => {
    if (done) return; done = true;
    fetch(location.pathname, { cache: 'reload', credentials: 'same-origin' }).catch(() => {}).finally(() => location.reload());
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', reload, { once: true });
  const reg = appUpdate.reg;
  if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  setTimeout(reload, 1500);
}
/* 설정의 "새로고침" 버튼: update() → 0.8초 기다림 → waiting 있으면 적용, 없으면 그냥 새로고침 */
async function refreshToLatest() {
  const reg = appUpdate.reg;
  if (reg) {
    try { await reg.update(); } catch (e) {}
    await new Promise(r => setTimeout(r, 800));
    if (reg.waiting) { applyAppUpdate(); return; }
  }
  fetch(location.pathname, { cache: 'reload', credentials: 'same-origin' }).catch(() => {}).finally(() => location.reload());
}

function getFilteredEquipment() {
  let list = [...eqItems];
  const st = S.eq;
  if (st.categoryFilter !== 'all') list = list.filter(it => it.category === st.categoryFilter);
  if (st.statusFilter !== 'all') list = list.filter(it => it.status === st.statusFilter);
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    list = list.filter(it => it.name.toLowerCase().includes(q) || (it.location||'').toLowerCase().includes(q) || (it.notes||'').toLowerCase().includes(q) || (it.serial||'').toLowerCase().includes(q) || (it.battery||'').toLowerCase().includes(q));
  }
  if (st.sortBy === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  else if (st.sortBy === 'category') list.sort((a,b) => a.category.localeCompare(b.category));
  else list.sort((a,b) => b.createdAt - a.createdAt);
  return list;
}

const CAL_GROUPS_LS = 'vinfilm-works-cal-groups';
function calGroupsHidden() {
  if (!S.sched.hiddenGroups) { let v = {}; try { v = JSON.parse(localStorage.getItem(CAL_GROUPS_LS) || '{}') || {}; } catch (e) {} S.sched.hiddenGroups = { share: !!v.share, work: !!v.work }; }
  return S.sched.hiddenGroups;
}
function schedCatHidden(cat) {
  if (cat === 'calendar') return false;
  const h = calGroupsHidden();

  </div>`;

function getFilteredSchedule() {
  let list = visibleSchedItems();
  const st = S.sched;
  list = list.filter(it => !schedCatHidden(it.category));
  if (st.categoryFilter !== 'all') list = list.filter(it => it.category === st.categoryFilter);
  if (!st.showPast) list = list.filter(it => it.date >= todayStr());
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    list = list.filter(it => it.title.toLowerCase().includes(q) || (it.location||'').toLowerCase().includes(q) || (it.memo||'').toLowerCase().includes(q));
  }
  list.sort((a,b) => `${a.date}T${a.time||'00:00'}`.localeCompare(`${b.date}T${b.time||'00:00'}`));
  return list;
}
function diffDaysFromToday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - todayOnly) / 86400000);
}
function ddayLabel(dateStr) {
  const diff = diffDaysFromToday(dateStr);
  if (diff === 0) return 'D-DAY';
  if (diff > 0) return `D-${diff}`;
  return `D+${-diff}`;
}

function ymd(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseYmd(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
/* 프로젝트 마감일 → 캘린더/대시보드에 읽기 전용 '마감' 일정으로 표시 (완료된 프로젝트는 제외, 저장은 안 함 — 매번 projItems에서 만든다) */
function projDueEvents() {
  if (GUEST_MODE) return [];
  // 촬영처럼 마감 개념이 없는 프로젝트는 캘린더 일정과 마감일이 같은 날이면 '마감' 칩을 따로 띄우지 않는다(중복 방지)
  return projItems.filter(p => p.dueDate && p.status !== 'done')
    .filter(p => { const s = p.scheduleId && schedItems.find(x => x.id === p.scheduleId); return !(s && s.date === p.dueDate); })
    .map(p => ({ id: 'due-' + p.id, projectId: p.id, source: 'due', title: p.title, date: p.dueDate, time: null, category: 'deadline' }));
}
function calFilteredItems() {
  // 캘린더는 과거도 보여야 하므로 "지난 일정" 토글은 무시하고 카테고리/검색만 적용
  const st = S.sched;
  let list = visibleSchedItems().filter(it => !schedCatHidden(it.category));
  if (st.categoryFilter !== 'all') list = list.filter(it => it.category === st.categoryFilter);
  if (st.search.trim()) {
    const q = st.search.trim().toLowerCase();
    list = list.filter(it => it.title.toLowerCase().includes(q) || (it.location||'').toLowerCase().includes(q) || (it.memo||'').toLowerCase().includes(q));
  }
  if ((st.categoryFilter === 'all' || st.categoryFilter === 'deadline') && !schedCatHidden('deadline')) {
    const q = st.search.trim().toLowerCase();
    list = [...list, ...projDueEvents().filter(ev => !q || ev.title.toLowerCase().includes(q))];
  }
  list.sort((a,b) => `${a.date}T${a.time||'00:00'}`.localeCompare(`${b.date}T${b.time||'00:00'}`));
  const byDate = {};
  // 기간 일정에 줄 번호(lane) 배정: 시작일 순으로, 앞 일정이 끝난 줄을 재사용 → 막대가 끝까지 같은 높이로 이어짐
  const laneEnds = [];
  list.filter(it => it.endDate && it.endDate > it.date && it.source !== 'google')
    .sort((a, b) => a.date.localeCompare(b.date) || String(a.id).localeCompare(String(b.id)))
    .forEach(it => { let l = laneEnds.findIndex(e => e < it.date); if (l < 0) { l = laneEnds.length; laneEnds.push(''); } laneEnds[l] = it.endDate; it._lane = l; });
  list.forEach(it => {
    if (it.endDate && it.endDate > it.date && it.source !== 'google') {
      // 기간 일정은 시작~종료 모든 날에 칩을 그림(최대 90일)
      let d = it.date, n = 0;
      while (d <= it.endDate && n < 90) { (byDate[d] = byDate[d] || []).push({ ...it, _span: d === it.date ? 'start' : d === it.endDate ? 'end' : 'mid', _wk: parseYmd(d).getDay() === 0, _lane: it._lane }); d = addDaysYmd(d, 1); n++; }
    } else (byDate[it.date] = byDate[it.date] || []).push(it);
  });
  if (st.categoryFilter === 'all' || st.categoryFilter === 'calendar') {
    const q = st.search.trim().toLowerCase();
    const g = gcalEventsByDate();
    Object.keys(g).forEach(d => {
      const evs = g[d].filter(ev => !q || ev.title.toLowerCase().includes(q) || (ev.location||'').toLowerCase().includes(q));
      if (evs.length) byDate[d] = [...(byDate[d] || []), ...evs].sort((a,b) => (a.time||'').localeCompare(b.time||''));
    });
  }
  // 기간 일정은 날마다 같은 줄에 오도록 맨 위에 '시작일 → id' 순으로 고정, 그 아래 하루 일정은 시간순
  Object.keys(byDate).forEach(d => {
    const spans = byDate[d].filter(x => x._span), rest = byDate[d].filter(x => !x._span);
    if (!spans.length) return;
    const maxLane = Math.max(...spans.map(x => x._lane || 0));
    const row = [];
    for (let l = 0; l <= maxLane; l++) row.push(spans.find(x => (x._lane || 0) === l) || { _spacer: true, id: 'sp-' + l });
    byDate[d] = [...row, ...rest];
  });
  return byDate;
}
function calEventHtml(it, compact) {

function calTitle() {
  const c = parseYmd(S.sched.cursor);

    const start = new Date(c); start.setDate(c.getDate() - c.getDay());
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return `${start.getFullYear()}년 ${start.getMonth()+1}월 ${start.getDate()}일 – ${end.getMonth()+1}월 ${end.getDate()}일`;

function calGridHtml() {
  const byDate = calFilteredItems();
  const c = parseYmd(S.sched.cursor);
  const today = todayStr();
  const weekdays = ['일','월','화','수','목','금','토'];
  let start, weeks;
  if (S.sched.view === 'week') {
    start = new Date(c); start.setDate(c.getDate() - c.getDay()); weeks = 1;
  } else {
    const first = new Date(c.getFullYear(), c.getMonth(), 1);
    start = new Date(first); start.setDate(1 - first.getDay());
    const last = new Date(c.getFullYear(), c.getMonth() + 1, 0);
    weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  }
  const maxShow = S.sched.view === 'week' ? 99 : 3;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d);
    const items = byDate[key] || [];
    const outside = S.sched.view === 'month' && d.getMonth() !== c.getMonth();
    const shown = items.slice(0, maxShow);
    cells += `
      <div class="cal-cell ${outside ? 'is-outside' : ''} ${key === today ? 'is-today' : ''} ${d.getDay() === 0 ? 'is-sun' : ''} ${d.getDay() === 6 ? 'is-sat' : ''}" data-action="cal-add-on-date" data-date="${key}">
        <div class="cal-daynum"><span>${d.getDate()}</span></div>
        <div class="cal-evs">
          ${shown.map(it => calEventHtml(it)).join('')}
          ${items.length > shown.length ? `<button class="cal-more" data-action="cal-open-day" data-date="${key}">+${items.filter(x => !x._spacer).length - shown.filter(x => !x._spacer).length}개 더보기</button>` : ''}
        </div>
      </div>`;
  }
  return `
    <div class="cal ${S.sched.view === 'week' ? 'cal-week' : ''}">
      <div class="cal-head">${weekdays.map((w, i) => `<div class="${i===0?'is-sun':i===6?'is-sat':''}">${w}</div>`).join('')}</div>
      <div class="cal-body" style="grid-template-rows:repeat(${weeks}, minmax(${S.sched.view === 'week' ? '300px' : '84px'}, 1fr));">${cells}</div>
    </div>`;
}

function projBreadcrumb(id) {
  const chain = [];
  let cur = id ? projItems.find(p => p.id === id) : null;
  while (cur) { chain.unshift(cur); cur = cur.parentId ? projItems.find(p => p.id === cur.parentId) : null; }
  return chain;
}
/* 프로젝트/공유 프로젝트 "폴더 이동" 공용 헬퍼 — 옮기려는 항목 자신과 그 하위 항목 전체로는
   이동할 수 없게(순환 방지) 제외 집합을 만들고, 트리 순서(부모 먼저) + 들여쓰기로 선택지를 만든다. */
function collectDescendantIds(items, rootId) {
  const ids = new Set();
  const queue = [rootId];
  while (queue.length) {
    const cur = queue.shift();
    items.filter(x => (x.parentId || null) === cur).forEach(child => { ids.add(child.id); queue.push(child.id); });
  }
  return ids;
}
function folderPickerOptions(items, excludeSet) {
  const byParent = {};
  items.forEach(p => { const k = p.parentId || 'root'; (byParent[k] = byParent[k] || []).push(p); });
  const out = [];
  (function walk(parentKey, depth) {
    (byParent[parentKey] || []).forEach(p => {
      if (excludeSet.has(p.id)) return; // 자기 자신/하위 트리는 후보에서도, 그 아래로도 내려가지 않음
      out.push({ id: p.id, label: (depth ? '　'.repeat(depth) + '└ ' : '') + p.title });
      walk(p.id, depth + 1);
    });
  })('root', 0);

function pickByCategory(catId, count, sortPref, excludeIds) {
  if (count <= 0) return [];
  let pool = eqItems.filter(it => it.category === catId && it.status !== 'sold' && !excludeIds.has(it.id) && !hasParent(it));
  if (sortPref === 'light') pool = pool.slice().sort((a,b) => (parseFloat(a.weight)||9999) - (parseFloat(b.weight)||9999));
  else pool = pool.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  return pool.slice(0, count).map(it => it.id);
}
function expandCompanions(idsArray) {
  const expanded = new Set(idsArray);
  const queue = [...idsArray];
  while (queue.length) {
    const id = queue.shift();
    const item = eqById(id);
    if (!item) continue;
    (Array.isArray(item.companionIds) ? item.companionIds : []).forEach(cid => { if (!expanded.has(cid) && eqById(cid)) { expanded.add(cid); queue.push(cid); } });
    eqItems.filter(c => c.parentId === id).forEach(c => { if (!expanded.has(c.id)) { expanded.add(c.id); queue.push(c.id); } });
  }
  return [...expanded];
}
function buildRecommendation(p) {
  const sortPref = p.packPref === 'minimal' ? 'light' : 'default';
  const picked = new Set();
  const add = (ids) => ids.forEach(id => picked.add(id));
  add(pickByCategory('camera', p.cameraCount, sortPref, picked));
  add(pickByCategory('lens', Math.max(1, p.cameraCount), sortPref, picked));
  add(pickByCategory('audio', p.audioCount, sortPref, picked));
  add(pickByCategory('light', LIGHT_PREF_COUNT[p.lightPref] ?? 0, sortPref, picked));
  if (p.packPref === 'full' || (p.packPref === 'standard' && p.cameraCount > 1)) add(pickByCategory('monitor', 1, sortPref, picked));
  if (p.packPref !== 'minimal' && p.audioCount > 0) add(pickByCategory('wireless', 1, sortPref, picked));
  if (p.packPref !== 'minimal') add(pickByCategory('tripod', p.cameraCount, sortPref, picked));
  const battPerCam = p.durationHours > 4 ? 2 : 1;
  add(pickByCategory('battery', battPerCam * Math.max(1, p.cameraCount), sortPref, picked));
  return expandCompanions([...picked]);
}
function paramsFromShootForm(fd) {
  return {
    name: (fd.get('name') || '').toString().trim(), shootType: fd.get('shootType') || '', castCount: parseInt(fd.get('castCount'), 10) || 0,
    cameraCount: parseInt(fd.get('cameraCount'), 10) || 0, durationHours: parseFloat(fd.get('durationHours')) || 0, location: fd.get('location') || 'indoor',
    crewCount: parseInt(fd.get('crewCount'), 10) || 0, transport: fd.get('transport') || 'car', packPref: fd.get('packPref') || 'standard',
    audioCount: parseInt(fd.get('audioCount'), 10) || 0, lightPref: fd.get('lightPref') || 'none',
  };
}
function finalizeNewShoot(params, confirmedIds) {
  const newShoot = { id: uid(), createdAt: Date.now(), confirmedIds, packedIds: [], retrievedIds: [], bagOverrides: {}, ...params };
  saveShoots([newShoot, ...shoots]);
  S.shoot.formOpen = false; S.shoot.applyPresetId = null; S.shoot.selectedShootId = newShoot.id; S.shoot.mode = 'pack';
  render();
}
function effectiveBagId(shoot, item) {
  const overrides = shoot.bagOverrides || {};
  if (Object.prototype.hasOwnProperty.call(overrides, item.id)) {
    const ov = overrides[item.id];
    return (ov && eqById(ov)) ? ov : '';
  }
  if (item.bagId && eqById(item.bagId)) return item.bagId;
  if (item.parentId) {
    const parent = eqById(item.parentId);
    if (parent && parent.bagId && eqById(parent.bagId)) return parent.bagId;
  }
  return '';
}
function packGroups(shoot) {
  const fullIds = expandCompanions(shoot.confirmedIds || []);
  const items = fullIds.map(eqById).filter(Boolean);
  const groups = {};
  const bagIds = new Set();
  items.forEach(it => {
    if (it.category === 'bag') { bagIds.add(it.id); return; }
    const key = effectiveBagId(shoot, it) || 'none';
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  Object.keys(groups).forEach(k => { if (k !== 'none') bagIds.add(k); });
  return { groups, bagIds };
}

/* =======================================================================
   SONGS TAB (노래연습) — 유튜브 inst(MR) 링크와 가사를 저장해 두고, 영상을 틀어 놓은 채 가사를 크게 보며 연습한다.
   songs 컬렉션(owner 전용). 재생 화면의 영상은 root 바깥(body)에 붙는 고정 패널(#songDock)이라 render()가 다시 돌아도
   끊기지 않는다 — syncSongDock()이 render() 끝에서 만들고/지우고, 영상 id가 바뀔 때만 iframe을 새로 만든다.
   ======================================================================= */
/* 유튜브 링크 → 제목·채널 이름(유튜브 oEmbed, 키 없이 브라우저에서 바로 읽힘). 가사는 저작권이 있어 자동으로 가져오지 않는다 — 검색 버튼으로 찾아 붙여넣기 */
async function songLookup(url) {
  if (!ytIdsIn(url).length) return null;
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url));
    if (!r.ok) return null;
    const d = await r.json();
    return { title: (d.title || '').trim(), artist: (d.author_name || '').replace(/\s*-\s*Topic$/i, '').trim() };
  } catch (e) { return null; }
}
/* 가사를 구간(벌스·후렴 등)별 블록으로 그린다: "[후렴]"처럼 대괄호만 있는 줄(앞뒤 ** 허용)이 구간 이름이고, 그 아래 줄들이 한 블록.
   구간 이름이 없으면 빈 줄로 나뉜 덩어리마다 블록 하나. 후렴 계열은 색 띠로 강조해 한눈에 구분된다. */
function songSectionKind(label) {
  const t = label.toLowerCase();
  if (/후렴|코러스|chorus|hook|싸비|사비/.test(t) && !/프리|pre/.test(t)) return 'chorus';
  if (/프리|pre/.test(t)) return 'pre';
  if (/브릿지|브리지|bridge/.test(t)) return 'bridge';
  if (/인트로|아웃트로|간주|intro|outro|inter/.test(t)) return 'etc';
  return 'verse';
}
function songBlocks(text) {
  const blocks = []; let cur = null;
  String(text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    const m = line.trim().match(/^\**\s*\[([^\]]{1,30})\]\s*\**$/);
    if (m) { cur = { label: m[1].trim(), lines: [] }; blocks.push(cur); return; }
    if (!line.trim()) { if (cur && cur.lines.length && !cur.label) cur = null; else if (cur && cur.lines.length && cur.lines[cur.lines.length - 1] !== '') cur.lines.push(''); return; }
    if (!cur) { cur = { label: '', lines: [] }; blocks.push(cur); }
    cur.lines.push(line);
  });
  return blocks.filter(b => b.label || b.lines.length).map(b => { while (b.lines.length && !b.lines[b.lines.length - 1]) b.lines.pop(); return b; });
}
function songTimeLabel(t) { if (typeof t !== 'number') return ''; const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); }
/* times: 구간(블록) 순서대로의 시작 시각(초). 싱크 맞추기에서 구간을 눌러 찍고 songs[].secTimes에 저장한다 */
function songLyricsHtml(text, times) {
  times = times || [];
  return songBlocks(text).map((b, i) => {
    const kind = b.label ? songSectionKind(b.label) : 'plain';
    const has = typeof times[i] === 'number';
    return `<div class="song-sec song-sec-${kind} ${has ? 'is-set' : ''}" data-sec="${i}" data-action="song-sec-tap" data-id="${i}"><div class="song-sec-top">${b.label ? `<span class="song-sec-label">${esc(b.label)}</span>` : ''}<span class="song-sec-time">${has ? songTimeLabel(times[i]) : ''}</span></div><div class="song-sec-body">${linkify(b.lines.join('\n'))}</div></div>`;
  }).join('');
}
/* 재생 위치에 맞춰 지금 구간을 강조하고 따라 내려간다(0.3초마다). 싱크를 찍는 중에는 쉬어서 화면이 움직이지 않게 한다 */
function songTick() {
  const p = window.__songPlayer, ly = document.getElementById('songLyrics');
  if (!p || !p.getCurrentTime || !ly || S.song.syncing) return;
  const s = songs.find(x => x.id === S.song.playId); if (!s) return;
  const times = s.secTimes || []; let t, playing = false;
  try { t = p.getCurrentTime(); playing = p.getPlayerState() === 1; } catch (e) { return; }
  let act = -1;
  times.forEach((v, i) => { if (typeof v === 'number' && v <= t + 0.2 && (act < 0 || v >= times[act])) act = i; });
  if (act === window.__songAct) return;
  window.__songAct = act;
  ly.querySelectorAll('.song-sec.now').forEach(el => el.classList.remove('now'));
  const el = act >= 0 ? ly.querySelector('[data-sec="' + act + '"]') : null;
  if (el) { el.classList.add('now'); if (playing && S.song.follow !== false) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function songEnsureApi(cb) {
  if (window.YT && window.YT.Player) return cb();
  (window.__ytCbs = window.__ytCbs || []).push(cb);

function won(n) { return (Math.round(Number(n) || 0)).toLocaleString('ko-KR'); }
function quoteTotals(q) {
  const sub = (q.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  let supply = sub, vat = 0;
  if (q.vatMode === 'separate') vat = Math.round(sub * 0.1);
  else if (q.vatMode === 'included') { supply = Math.round(sub / 1.1); vat = sub - supply; }
  return { supply, vat, total: supply + vat };
}
function nextQuoteNumber(date) {
  const prefix = `VF-${date.slice(2, 4)}${date.slice(5, 7)}-`;
  let max = 0;
  quotes.forEach(q => { if ((q.number || '').startsWith(prefix)) max = Math.max(max, parseInt(q.number.slice(prefix.length), 10) || 0); });
  return prefix + String(max + 1).padStart(3, '0');
}
function newQuoteItem(p) { return { id: uid(), cat: (p && p.cat) || '촬영', desc: (p && p.desc) || '', qty: 1, unit: (p && p.unit) || '식', price: 0 }; }
function blankQuote() {
  const today = todayStr();
  return { id: uid(), number: nextQuoteNumber(today), status: 'draft', createdAt: Date.now(), issueDate: today, validUntil: addDaysYmd(today, QUOTE_DEFAULTS.validDays),
    clientName: '', clientContact: '', projectTitle: '', items: [newQuoteItem()],
    vatMode: QUOTE_DEFAULTS.vatMode, deposit: QUOTE_DEFAULTS.deposit, revisions: QUOTE_DEFAULTS.revisions, delivery: QUOTE_DEFAULTS.delivery, memo: '', shareId: '', approval: null };
}
/* 클라이언트에게 보이는 스냅샷 — 내부용 필드(상태/생성시각 등)는 빼고 사업자 정보를 같이 담는다 */
/* 클라이언트에게 보이는 번호 — 내부 연번(VF-2609-001)은 "이번 달 몇 번째"가 드러나서, 문서엔 같은 머리(VF-2609-) + 랜덤 4자를 쓴다.
   한 번 만들면 그 문서에 고정(publicNo). 헷갈리는 글자(0/O, 1/I/L)는 뺐다. */
function makePublicNo(internalNo, taken) {
  const head = String(internalNo || '').replace(/-\d+$/, '-');
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for (let tries = 0; tries < 50; tries++) {
    const a = new Uint8Array(4); crypto.getRandomValues(a);
    const code = head + [...a].map(b => abc[b % abc.length]).join('');
    if (!taken || !taken.has(code)) return code;
  }
  return head + Date.now().toString(36).toUpperCase().slice(-4);
}
function ensureQuotePublicNo(q) { if (!q.publicNo) q.publicNo = makePublicNo(q.number, new Set(quotes.map(x => x.publicNo).filter(Boolean))); return q.publicNo; }
function quoteSnapshot(q) {
  return { v: 1, number: q.publicNo || makePublicNo(q.number), issueDate: q.issueDate, validUntil: q.validUntil, clientName: q.clientName, clientContact: q.clientContact, projectTitle: q.projectTitle,
    items: (q.items || []).map(it => ({ cat: it.cat, desc: it.desc, qty: Number(it.qty) || 0, unit: it.unit, price: Number(it.price) || 0 })),
    vatMode: q.vatMode, deposit: Number(q.deposit) || 0, revisions: Number(q.revisions) || 0, delivery: q.delivery || '', memo: q.memo || '', biz: (({ signature, ...rest }) => rest)(biz), publishedAt: Date.now() };
}
function randomShareId() { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function publishQuote(q) {
  if (IS_LOCAL_DEV || typeof firebase === 'undefined' || !firebase.firestore) return false;
  const ref = firebase.firestore().collection('quotesPublic').doc(q.shareId);
  const snap = quoteSnapshot(q);
  const cur = await ref.get();
  if (cur.exists) await ref.set(snap, { merge: true }); // approval은 건드리지 않는다
  else await ref.set({ ...snap, approval: null });
  return true;
}
function quoteShareUrl(q) { return `${location.origin}/quote/?t=${q.shareId}`; }
let quoteApprovalCheckedAt = 0;
async function checkQuoteApprovals() {
  if (IS_LOCAL_DEV || typeof firebase === 'undefined' || !firebase.firestore || Date.now() - quoteApprovalCheckedAt < 60000) return;
  quoteApprovalCheckedAt = Date.now();
  const pending = quotes.filter(q => q.shareId && !q.approval && q.status !== 'canceled');
  if (!pending.length) return;
  const found = {};
  await Promise.all(pending.map(async q => {
    try { const d = await firebase.firestore().collection('quotesPublic').doc(q.shareId).get(); const a = d.exists && d.data().approval; if (a) found[q.id] = a; } catch (e) {}
  }));
  if (Object.keys(found).length) saveQuotes(quotes.map(q => found[q.id] ? { ...q, approval: found[q.id], status: 'approved' } : q));
}

/* ---- 편집 중 상태: S.quote.draft에 복사본을 들고 있고, 입력할 때마다 draft만 고치고 합계 숫자만 부분 갱신(포커스 유지) ---- */

function quoteCommitDraft() {

  ensureQuotePublicNo(d);
  d.items = (d.items || []).filter(it => it.desc.trim() || Number(it.price));
  if (!d.items.length) d.items = [newQuoteItem()];
  d.updatedAt = Date.now();
  const exists = quotes.some(q => q.id === d.id);
  saveQuotes(exists ? quotes.map(q => q.id === d.id ? JSON.parse(JSON.stringify(d)) : q) : [JSON.parse(JSON.stringify(d)), ...quotes]);
  if (d.shareId) publishQuote(d).catch(() => {});
  return d;
}
function quoteUpdateTotalsDom() {
  const d = S.quote.draft; if (!d) return;
  const t = quoteTotals(d);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('qtSupply', won(t.supply)); set('qtVat', won(t.vat)); set('qtTotal', won(t.total));
  (d.items || []).forEach(it => set('qa-' + it.id, won((Number(it.qty) || 0) * (Number(it.price) || 0))));
}

async function quoteShare() {
  const d = quoteCommitDraft(); if (!d) return;
  if (IS_LOCAL_DEV) { S.quote.msg = '로컬 테스트 환경에서는 공유 링크를 만들지 않아요. 미리보기로 확인해 주세요.'; render(); return; }
  if (bizMissing()) { S.quote.bizOpen = true; S.quote.msg = '링크를 보내기 전에 사업자 정보(사업자번호·계좌)를 먼저 넣어주세요.'; render(); return; }
  try {
    if (!d.shareId) { d.shareId = randomShareId(); }
    if (d.status === 'draft') d.status = 'sent';
    if (!d.sentAt) d.sentAt = Date.now();
    saveQuotes(quotes.map(q => q.id === d.id ? JSON.parse(JSON.stringify(d)) : q));
    await publishQuote(d);
    const url = quoteShareUrl(d);
    const title = `[VINFILM STUDIO] ${d.projectTitle || '견적서'} 견적서`;
    if (navigator.share) {
      try { await navigator.share({ title, text: `${d.clientName ? d.clientName + '님, ' : ''}VINFILM STUDIO 견적서를 보내드려요.`, url }); S.quote.msg = '공유했어요.'; }
      catch (e) { if (e && e.name === 'AbortError') S.quote.msg = ''; else throw e; }
    } else {
      await navigator.clipboard.writeText(url);
      S.quote.msg = '링크를 복사했어요. 카카오톡·문자에 붙여넣어 보내세요.';
    }
  } catch (e) { S.quote.msg = '링크를 만들지 못했어요: ' + (e.message || e); }
  render();
}

  if (!pending.length) return;
  const updates = {};

      if (!c.ledgerSynced) next.ledgerSynced = await contractToLedger(next).catch(() => false);
      updates[c.id] = next;

  if (Object.keys(updates).length) {

function notifGo(n) {

  else if (n.act === 'shared') { const p = sharedProjItems.find(x => x.id === n.ref); S.activeTab = 'shared'; S.shared.currentParentId = p ? (p.parentId || null) : null; S.shared.statusFilter = 'all'; }

  else if (n.act === 'contract') { const k = contracts.find(x => x.id === n.ref); S.activeTab = 'quotes'; S.quote.view = 'contracts'; if (k) { contractOpenEditor(k); return; } }
  window.scrollTo(0, 0); render();
}
function handleNotifAction(action, el, e) {
  switch (action) {
    case 'notif-toggle': S.notif.open = !S.notif.open; render(); return true;
    case 'notif-close': S.notif.open = false; render(); return true;
    case 'notif-read-all': notifMarkRead(notifItems().map(n => n.id)); render(); return true;
    case 'notif-go': { const n = notifItems().find(x => x.id === el.dataset.id); if (n) { notifMarkRead([n.id]); notifGo(n); } return true; }
    case 'notice-new': S.notif.open = false; S.notif.compose = true; render(); return true;
    case 'notice-close': S.notif.compose = false; S.notif.viewId = null; render(); return true;
    case 'notice-close-backdrop': if (!e.target.closest('[data-stop-close]')) { S.notif.compose = false; S.notif.viewId = null; render(); } return true;
    case 'notice-delete': {
      if (GUEST_MODE || !confirm('이 공지를 삭제할까요? 협업자 알림에서도 사라져요.')) return true;
      const g = el.dataset.id; saveNotices(notices.filter(n => (n.groupId || n.id) !== g)); render(); return true;

}

/* 사이드바 선택 표시가 이전 메뉴 위치에서 새 메뉴 위치로 미끄러지듯 움직이게 한다.
   render()가 매번 DOM을 새로 만들기 때문에 CSS transition만으로는 안 움직여서, 이전 위치를 기억해 두었다가
   새 요소를 이전 위치에 먼저 그린 뒤 다음 프레임에 새 위치로 옮긴다. */
/* 캘린더를 화면 아래 끝까지 빈틈없이 채운다 — 위쪽 헤더/필터 높이가 상황마다 달라서 CSS만으로 못 맞추고 렌더 후 실제 위치로 계산 */
function fitCalendar() {
  const cal = document.querySelector('.cal-card .cal');
  if (!cal) return;
  const top = cal.getBoundingClientRect().top + window.scrollY;
  const tb = document.querySelector('.m-tabbar');
  const tbh = tb && getComputedStyle(tb).display !== 'none' ? tb.offsetHeight : 0;
  const h = Math.max(window.innerHeight - top - 40 - tbh, 460);
  cal.style.height = h + 'px';
}
window.addEventListener('resize', () => fitCalendar());
function positionNavIndicator() {
  const ind = document.querySelector('.side-nav-indicator');
  const act = document.querySelector('.side-nav-item.active');
  if (!ind) return;
  if (!act) { ind.style.opacity = '0'; window.__navY = null; return; }
  const y = act.offsetTop, h = act.offsetHeight;
  ind.style.height = h + 'px';
  if (window.__navY != null && window.__navY !== y) {
    ind.style.transform = `translateY(${window.__navY}px)`;
    ind.getBoundingClientRect();
    requestAnimationFrame(() => { ind.style.transform = `translateY(${y}px)`; });
  } else {
    ind.style.transform = `translateY(${y}px)`;
  }
  window.__navY = y;
}

      case 'song-font': { // 다시 그리지 않고 글자 크기만 바꾼다(다시 그리면 재생 중인 영상이 끊김)
        const next = Math.max(14, Math.min(44, songFontSize() + Number(id)));
        try { localStorage.setItem('vinfilm-song-font', String(next)); } catch (x) {}
        const ly = document.getElementById('songLyrics'); if (ly) ly.style.fontSize = next + 'px';
        break;
      }
      case 'song-delete': {
        const s = songs.find(x => x.id === id);
        if (s && window.confirm(`"${s.title}"을(를) 삭제할까요?`)) { saveSongs(songs.filter(x => x.id !== id)); S.song.modalOpen = false; S.song.editingId = null; if (S.song.playId === id) S.song.playId = null; render(); }
        break;
      }
      case 'note-open-add': S.note.editingId = null; S.note.modalOpen = true; render(); break;
      case 'note-open-edit': S.note.editingId = id; S.note.modalOpen = true; render(); break;
      case 'note-close-modal': S.note.modalOpen = false; S.note.editingId = null; render(); break;
      case 'note-confirm-delete': S.note.confirmDeleteId = id; render(); break;
      case 'note-cancel-delete': S.note.confirmDeleteId = null; render(); break;
      case 'note-delete': saveNotes(notes.filter(n => n.id !== id)); S.note.confirmDeleteId = null; render(); break;

      /* shoot prep */
      case 'shoot-open-new-form': S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; S.shoot.formOpen = true; render(); break;
      case 'shoot-create-blank': {
        const form = document.querySelector('[data-form-role="shoot-form"]');
        if (!form) break;
        const fd = new FormData(form);
        const params = paramsFromShootForm(fd);
        const preset = S.shoot.applyPresetId ? presets.find(p => p.id === S.shoot.applyPresetId) : null;
        const confirmedIds = preset ? (preset.confirmedIds || []).filter(pid => eqById(pid)) : [];
        finalizeNewShoot(params, confirmedIds);
        break;
      }
      case 'shoot-close-form': S.shoot.formOpen = false; S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; render(); break;
      case 'shoot-close-form-backdrop': if (!e.target.closest('[data-stop-close]')) { S.shoot.formOpen = false; S.shoot.editingParamsId = null; S.shoot.applyPresetId = null; render(); } break;
      case 'shoot-edit-params': S.shoot.editingParamsId = id; S.shoot.applyPresetId = null; S.shoot.formOpen = true; render(); break;
      case 'shoot-open-detail': S.shoot.selectedShootId = id; S.shoot.mode = 'pack'; render(); break;
      case 'shoot-back-to-list': S.shoot.selectedShootId = null; render(); break;
      case 'shoot-confirm-delete': S.shoot.confirmDeleteShootId = id; render(); break;
      case 'shoot-cancel-delete': S.shoot.confirmDeleteShootId = null; render(); break;
      case 'shoot-delete':
        saveShoots(shoots.filter(s => s.id !== id));
        S.shoot.confirmDeleteShootId = null;
        if (S.shoot.selectedShootId === id) S.shoot.selectedShootId = null;
        render();
        break;
      case 'shoot-regenerate': {
        const shoot = shoots.find(s => s.id === id);
        if (!shoot) break;
        if (!window.confirm('추천을 다시 받으면 지금까지 직접 수정한 확정 장비 목록이 새로 계산된 추천으로 대체돼요. 계속할까요?')) break;
        const newIds = buildRecommendation(shoot);
        saveShoots(shoots.map(s => s.id === id ? { ...s, confirmedIds: newIds } : s));
        render();
        break;
      }
      case 'shoot-reset-checklist': {
        const key = S.shoot.mode === 'pack' ? 'packedIds' : 'retrievedIds';
        saveShoots(shoots.map(s => s.id === id ? { ...s, [key]: [] } : s));
        refreshShootPackList();
        break;
      }
      case 'shoot-set-mode': S.shoot.mode = id; render(); break;
      case 'shoot-save-preset': {
        const shoot = shoots.find(s => s.id === id);
        if (!shoot) break;
        const name = window.prompt('프리셋 이름을 입력해줘 (예: 1인 인터뷰 최소 세팅)');
        if (!name) break;
        const trimmed = name.trim();
        if (!trimmed) break;
        const { name: _n, id: _id, createdAt: _c, packedIds: _p, retrievedIds: _r, ...params } = shoot;
        savePresets([...presets, { id: uid(), name: trimmed, params, confirmedIds: shoot.confirmedIds || [], createdAt: Date.now() }]);
        window.alert('프리셋으로 저장했어요.');
        break;
      }
      case 'shoot-start-from-preset': S.shoot.editingParamsId = null; S.shoot.applyPresetId = id; S.shoot.formOpen = true; render(); break;
      case 'preset-confirm-delete': S.shoot.confirmDeletePresetId = id; render(); break;
      case 'preset-cancel-delete': S.shoot.confirmDeletePresetId = null; render(); break;
      case 'preset-delete': savePresets(presets.filter(p => p.id !== id)); S.shoot.confirmDeletePresetId = null; render(); break;
    }
  });

  /* 프로젝트/공유 프로젝트: 상태 배지 우클릭 → 빠른 상태 변경, 행 우클릭 → 수정/삭제 메뉴 */
  root.addEventListener('contextmenu', (e) => {
    if (e.target.closest('a')) return; // 링크 위에서는 브라우저 기본 메뉴(링크 복사 등)
    const pill = e.target.closest('[data-status-menu-id]');
    if (pill) { e.preventDefault(); S.proj.statusMenu = { id: pill.dataset.statusMenuId, x: e.clientX, y: e.clientY }; refreshMenus(); return; }
    const sharedPill = e.target.closest('[data-shared-status-menu-id]');
    if (sharedPill) { e.preventDefault(); S.shared.statusMenu = { id: sharedPill.dataset.sharedStatusMenuId, x: e.clientX, y: e.clientY }; refreshMenus(); return; }
    const row = e.target.closest('[data-row-menu-id]');
    if (row) { e.preventDefault(); S.proj.rowMenu = { id: row.dataset.rowMenuId, x: e.clientX, y: e.clientY }; refreshMenus(); return; }
    const sharedRow = e.target.closest('[data-shared-row-menu-id]');
    if (sharedRow) { e.preventDefault(); S.shared.rowMenu = { id: sharedRow.dataset.sharedRowMenuId, x: e.clientX, y: e.clientY }; refreshMenus(); return; }
  });

  /* text search (targeted refresh, no full render → keeps focus) */
  root.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.role === 'time-input') {
      const v = parseTimeInput(e.target.value), hint = e.target.parentElement.querySelector('[data-time-hint]');
      if (hint) { hint.textContent = !e.target.value.trim() ? '비우면 하루 종일' : v ? '→ ' + timeLabelKo(v) : '시간을 알아볼 수 없어요'; hint.classList.toggle('bad', v === null); }
      return;
    }
    if (S.quote.draft && handleQuoteInput(e)) return;
    if (S.quote.cdraft && handleContractInput(e)) return;
    if (e.target.id === 'eqSearchInput') { S.eq.search = e.target.value; refreshEqGrid(); }
    else if (e.target.id === 'schedSearchInput') { S.sched.search = e.target.value; refreshSchedList(); }
    else if (e.target.id === 'songSearchInput') { S.song.search = e.target.value; const g = document.getElementById('songGrid'); if (g) g.innerHTML = songGridHtml(); }
    else if (e.target.id === 'projSearchInput') { S.proj.search = e.target.value; refreshProjList(); }
    else if (e.target.id === 'sharedProjSearchInput') { S.shared.search = e.target.value; refreshSharedProjList(); }
  });

  /* checkboxes: allDay, photo file, ics import, shoot confirm/pack toggles */
  root.addEventListener('change', (e) => {
    if (e.target.name === 'url' && e.target.form && e.target.form.matches('[data-form-role="song-form"]')) {
      const f = e.target.form;
      if (!f.elements.title.value.trim()) songLookup(normalizeUrl(e.target.value)).then(info => {
        if (!info || !f.isConnected) return;
        if (!f.elements.title.value.trim()) f.elements.title.value = info.title;
        if (!f.elements.artist.value.trim()) f.elements.artist.value = info.artist;
      });
      return;
    }
    if (e.target.dataset && e.target.dataset.role === 'proj-sort') { setProjSortMode(e.target.value); return; }
    if (e.target.dataset && e.target.dataset.role === 'shared-sort') { setSharedSortMode(e.target.value); return; }
    if (S.quote.draft && handleQuoteInput(e)) return;
    if (S.quote.cdraft && handleContractInput(e)) return;
    if (e.target.dataset && e.target.dataset.role === 'proj-due-inline') {
      const id = e.target.dataset.id;
      saveProjItems(projItems.map(p => p.id === id ? { ...p, dueDate: e.target.value } : p));
      refreshProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-due-inline') {
      const id = e.target.dataset.id;
      saveSharedProjItems(sharedProjItems.map(p => p.id === id ? { ...p, dueDate: e.target.value } : p));
      refreshSharedProjList();
    }
    if (e.target.id === 'todayMonthPicker') {
      if (e.target.value) { S.today.month = e.target.value; render(); }
    }
    if (e.target.dataset && e.target.dataset.role === 'time-input') { const v = parseTimeInput(e.target.value); if (v) e.target.value = v; }
    if (e.target.id === 'schedAllDayCb') {
      const timeInput = document.getElementById('schedTimeInput');
      if (timeInput) timeInput.disabled = e.target.checked;
    }
    if (e.target.id === 'eqFileInput') {
      const file = e.target.files && e.target.files[0];
      if (file) handlePhotoFile(file);
      e.target.value = '';
    }
    if (e.target.name === 'type' && e.target.closest('[data-form-role="proj-form"]')) {
      // 종류가 촬영이면 마감일 칸을 숨기고 답사 일정 칸을 보여 준다(값이 이미 들어 있는 칸은 그대로 보여 줌)
      const form = e.target.closest('form'), shoot = e.target.value === 'shoot';
      form.querySelectorAll('[data-proj-hide-shoot]').forEach(el => { el.style.display = shoot && !el.dataset.projHideShoot ? 'none' : ''; });
      form.querySelectorAll('[data-proj-show-shoot]').forEach(el => { el.style.display = shoot || el.dataset.projShowShoot ? '' : 'none'; });
    }
    if (e.target.type === 'date' && e.target.parentElement && e.target.parentElement.classList.contains('date-wrap')) e.target.parentElement.classList.toggle('has-val', !!e.target.value);
    if (e.target.dataset && e.target.dataset.role === 'sched-date-conflict') {
      const box = document.getElementById('schedConflict'); if (box) box.innerHTML = schedConflictHtml(e.target.value);
    }
    if (e.target.dataset && e.target.dataset.role === 'hisplan-url') { const u = e.target.value.trim(); if (u !== hisplan.url) hisplanSaveUrl(u); }
    if (e.target.dataset && e.target.dataset.role === 'gcal-extra') {
      const cur = new Set(gcalExtraCals());
      if (e.target.checked) cur.add(e.target.value); else cur.delete(e.target.value);
      try { localStorage.setItem(GCAL_LS.extra, JSON.stringify([...cur])); } catch (e2) {}
      if (gcalTokenValid()) { gcal.busy = false; gcalPull().then(render).catch(() => {}); }
      return;
    }
    if (e.target.dataset && e.target.dataset.role === 'confirm-toggle') {
      const shoot = shoots.find(s => s.id === S.shoot.selectedShootId);
      if (!shoot) return;
      const itemId = e.target.dataset.id;
      const cur = new Set(shoot.confirmedIds || []);
      if (e.target.checked) cur.add(itemId); else cur.delete(itemId);
      saveShoots(shoots.map(s => s.id === shoot.id ? { ...s, confirmedIds: [...cur] } : s));
      refreshShootPackList();
    }
    if (e.target.dataset && e.target.dataset.role === 'pack-toggle') {
      const shootId = e.target.dataset.shootId || S.shoot.selectedShootId;
      const shoot = shoots.find(s => s.id === shootId);
      if (!shoot) return;
      const key = S.shoot.mode === 'pack' ? 'packedIds' : 'retrievedIds';
      const itemId = e.target.dataset.id;
      const cur = new Set(shoot[key] || []);
      if (e.target.checked) cur.add(itemId); else cur.delete(itemId);
      saveShoots(shoots.map(s => s.id === shoot.id ? { ...s, [key]: [...cur] } : s));
      if (S.activeTab === 'shootprep') refreshShootPackList(); else render();
    }
    if (e.target.dataset && e.target.dataset.role === 'proj-row-select') {
      const rid = e.target.dataset.id;
      const cur = new Set(S.proj.selectedIds);
      if (e.target.checked) cur.add(rid); else cur.delete(rid);
      S.proj.selectedIds = [...cur];
      refreshProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'proj-select-all') {
      const ids = (e.target.dataset.ids || '').split(',').filter(Boolean);
      const cur = new Set(S.proj.selectedIds);
      if (e.target.checked) ids.forEach(x => cur.add(x)); else ids.forEach(x => cur.delete(x));
      S.proj.selectedIds = [...cur];
      refreshProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-row-select') {
      const rid = e.target.dataset.id;
      const cur = new Set(S.shared.selectedIds);
      if (e.target.checked) cur.add(rid); else cur.delete(rid);
      S.shared.selectedIds = [...cur];
      refreshSharedProjList();
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-select-all') {
      const ids = (e.target.dataset.ids || '').split(',').filter(Boolean);
      const cur = new Set(S.shared.selectedIds);
      if (e.target.checked) ids.forEach(x => cur.add(x)); else ids.forEach(x => cur.delete(x));
      S.shared.selectedIds = [...cur];
      refreshSharedProjList();
    }
  });

  /* 프로젝트/공유 프로젝트 목록에서 메모를 행 안에서 바로 수정(contenteditable) — 포커스 잃을 때 저장 */
  root.addEventListener('focusout', (e) => {
    if (e.target.dataset && e.target.dataset.role === 'proj-notes-inline') {
      const id = e.target.dataset.id;
      const notes = e.target.textContent.trim();
      saveProjItems(projItems.map(p => p.id === id ? { ...p, notes } : p));
    }
    if (e.target.dataset && e.target.dataset.role === 'shared-notes-inline') {
      const id = e.target.dataset.id;
      const notes = e.target.textContent.trim();
      saveSharedProjItems(sharedProjItems.map(p => p.id === id ? { ...p, notes } : p));
    }
  });

  /* form submits */
  root.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    if (form.matches('[data-form-role="eq-form"]')) {
      if (GUEST_MODE) return;
      const fd = new FormData(form);
      const name = (fd.get('name') || '').toString().trim();
      if (!name) return;
      const payload = {
        name, category: fd.get('category'), status: fd.get('status') || 'owned', quantity: parseInt(fd.get('quantity'), 10) || 1,
        weight: fd.get('weight') || '', battery: fd.get('battery') || '', cables: fd.get('cables') || '', bagId: fd.get('bagId') || '',
        parentId: fd.get('parentId') || '', companionIds: fd.getAll('companions'), notes: fd.get('notes') || '', photo: currentEqPhoto,
        updatedBy: currentEditorName(), updatedAt: Date.now(),
      };
      if (S.eq.editingId) saveEqItems(eqItems.map(it => it.id === S.eq.editingId ? { ...it, ...payload } : it));
      else saveEqItems([{ id: uid(), serial: nextSerial(eqItems), createdAt: Date.now(), ...payload }, ...eqItems]);
      S.eq.modalOpen = false; S.eq.editingId = null; S.eq.newItemParentId = null; currentEqPhoto = '';
      render();
    } else if (form.matches('[data-form-role="sched-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const allDay = fd.has('allDay');
      const endRaw = (fd.get('endDate') || '').toString();
      const payload = { title, date: fd.get('date'), endDate: endRaw && endRaw > fd.get('date') ? endRaw : '', time: allDay ? null : (parseTimeInput(fd.get('time')) || null), location: fd.get('location') || '', contact: fd.get('contact') || '', category: fd.get('category') || 'shoot', memo: fd.get('memo') || '' };
      if (!GUEST_MODE && fd.has('collabId')) { const cid = (fd.get('collabId') || '').toString(); payload.collabId = cid; }
      if (S.sched.editingId) {
        saveSchedItems(schedItems.map(it => it.id === S.sched.editingId ? { ...it, ...payload } : it));
      } else {
        const newId = uid();
        const linkProjectId = S.sched.linkProjectId;
        saveSchedItems([{ id: newId, createdAt: Date.now(), source: 'manual', projectId: linkProjectId || null, ...payload }, ...schedItems]);
        if (linkProjectId) saveProjItems(projItems.map(p => p.id === linkProjectId ? { ...p, scheduleId: newId } : p));
      }
      S.sched.modalOpen = false; S.sched.editingId = null; S.sched.linkProjectId = null; S.sched.multiDay = null;
      render();
    } else if (form.matches('[data-form-role="proj-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const payload = { title, client: fd.get('client') || '', status: fd.get('status') || 'todo', type: fd.get('type') || '', color: fd.get('color') || '', dueDate: fd.get('dueDate') || '', notes: fd.get('notes') || '' };
      /* 📅 캘린더 일정: 날짜가 있으면 연결된 스케줄을 만들거나 고치고(→ Google 캘린더/아이폰까지), 비우면 연결된 스케줄을 지운다 */
      const editingProj = S.proj.editingId ? projItems.find(p => p.id === S.proj.editingId) : null;
      const projId = editingProj ? editingProj.id : uid();
      const sDate = (fd.get('schedDate') || '').toString();
      const sTime = parseTimeInput(fd.get('schedTime')) || null;
      const sCat = (fd.get('schedCategory') || 'shoot').toString();
      const linked = editingProj && editingProj.scheduleId ? schedItems.find(s => s.id === editingProj.scheduleId) : null;
      let scheduleId = linked ? linked.id : null;
      if (sDate && linked) {
        // 일정 제목을 따로 바꿔둔 경우엔 그대로 두고, 프로젝트 이름과 같을 때만 따라 바꾼다
        const sTitle = linked.title === editingProj.title ? title : linked.title;
        if (linked.date !== sDate || (linked.time || null) !== sTime || linked.category !== sCat || linked.title !== sTitle)
          saveSchedItems(schedItems.map(s => s.id === linked.id ? { ...s, title: sTitle, date: sDate, time: sTime, category: sCat } : s));
      } else if (sDate) {
        scheduleId = uid();
        saveSchedItems([{ id: scheduleId, createdAt: Date.now(), source: 'manual', projectId: projId, title, date: sDate, time: sTime, location: '', contact: '', category: sCat, memo: '' }, ...schedItems]);
      } else if (linked) {
        saveSchedItems(schedItems.filter(s => s.id !== linked.id));
        scheduleId = null;
      }
      payload.scheduleId = scheduleId;
      /* 🔎 답사 일정: 캘린더 일정과 같은 방식, 카테고리는 항상 '답사'(→ 가족 공유 캘린더까지), 제목은 "프로젝트명 답사" */
      const cDate = (fd.get('scoutDate') || '').toString();
      const cTime = parseTimeInput(fd.get('scoutTime')) || null;
      const scoutLinked = editingProj && editingProj.scoutScheduleId ? schedItems.find(s => s.id === editingProj.scoutScheduleId) : null;
      let scoutScheduleId = scoutLinked ? scoutLinked.id : null;
      if (cDate && scoutLinked) {
        const cTitle = scoutLinked.title === editingProj.title + ' 답사' ? title + ' 답사' : scoutLinked.title;
        if (scoutLinked.date !== cDate || (scoutLinked.time || null) !== cTime || scoutLinked.title !== cTitle)
          saveSchedItems(schedItems.map(s => s.id === scoutLinked.id ? { ...s, title: cTitle, date: cDate, time: cTime } : s));
      } else if (cDate) {
        scoutScheduleId = uid();
        saveSchedItems([{ id: scoutScheduleId, createdAt: Date.now(), source: 'manual', projectId: projId, title: title + ' 답사', date: cDate, time: cTime, location: '', contact: '', category: 'scout', memo: '' }, ...schedItems]);
      } else if (scoutLinked) {
        saveSchedItems(schedItems.filter(s => s.id !== scoutLinked.id));
        scoutScheduleId = null;
      }
      payload.scoutScheduleId = scoutScheduleId;
      if (editingProj) saveProjItems(projItems.map(p => p.id === editingProj.id ? { ...p, ...payload } : p));
      else saveProjItems([{ id: projId, serial: nextProjectSerial(projItems), createdAt: Date.now(), parentId: S.proj.currentParentId || null, ...payload }, ...projItems]);
      S.proj.modalOpen = false; S.proj.editingId = null;
      render();
    } else if (form.matches('[data-form-role="proj-move-form"]')) {
      const fd = new FormData(form);
      const targetParentId = fd.get('targetParentId') || null;
      const ids = new Set(S.proj.moveIds || []);
      if (ids.size) saveProjItems(projItems.map(p => ids.has(p.id) ? { ...p, parentId: targetParentId } : p));
      S.proj.moveIds = null; S.proj.selectedIds = [];
      render();
    } else if (form.matches('[data-form-role="shared-form"]')) {
      const fd = new FormData(form);
      const title = (fd.get('title') || '').toString().trim();
      if (!title) return;
      const payload = { title, client: fd.get('client') || '', dueDate: fd.get('dueDate') || '', status: fd.get('status') || 'todo', color: fd.get('color') || '', link: fd.get('link') || '', notes: fd.get('notes') || '', updatedBy: currentEditorName(), updatedAt: Date.now() };
      const parentItem = S.shared.currentParentId ? sharedProjItems.find(p => p.id === S.shared.currentParentId) : null;
      if (!GUEST_MODE && fd.has('collabId')) payload.collabId = (fd.get('collabId') || '').toString();
      else if (!S.shared.editingId && parentItem && parentItem.collabId) payload.collabId = parentItem.collabId;
      if (S.shared.editingId) {
        const before = sharedProjItems.find(p => p.id === S.shared.editingId);
        const moveTree = !GUEST_MODE && before && 'collabId' in payload && (before.collabId || '') !== payload.collabId;
        const tree = moveTree ? new Set(collectDescendantIds(sharedProjItems, before.id)) : new Set();
        saveSharedProjItems(sharedProjItems.map(p => p.id === S.shared.editingId ? { ...p, ...payload } : tree.has(p.id) ? { ...p, collabId: payload.collabId } : p));
      }
      else saveSharedProjItems([{ id: uid(), serial: nextSharedSerial(sharedProjItems), createdAt: Date.now(), parentId: S.shared.currentParentId || null, ...payload }, ...sharedProjItems]);
      S.shared.modalOpen = false; S.shared.editingId = null;
      render();

      else saveTodayTasks([...todayTasks, { id: uid(), text, color: TASK_COLOR_PALETTE[todayTasks.length % TASK_COLOR_PALETTE.length], createdAt: Date.now() }]);

    } else if (form.matches('[data-form-role="shortcut-form"]')) {
