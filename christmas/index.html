<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>크리스마스 가족 대소동 수정안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: one script column (~46rem): cast sheet grouped by generation, then the acts with a sticky "my lines" bar. Edit mode swaps text for fields and adds a fixed save bar. */
:root {
  --bg: #f6f7f4;
  --paper: #ffffff;
  --ink: #1b2420;
  --muted: #5f6b65;
  --line: #dde2dc;
  --pine: #1e4d3f;
  --berry: #a4243b;
  --berry-soft: #f7e6e9;
  --c-grandpa: #8a5a00;
  --c-grandma: #8e3b8e;
  --c-dad: #1f5fa8;
  --c-mom: #5b4bb7;
  --c-first: #b0461c;
  --c-second: #1e7a55;
  --c-third: #0d7a86;
  --c-all: #1b2420;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --paper: #1a2220; --ink: #e5ebe7; --muted: #9aa8a1; --line: #2c3633;
    --pine: #8cc7ad; --berry: #ec8a9a; --berry-soft: #3a2228;
    --c-grandpa: #e6b55a; --c-grandma: #e09ae0; --c-dad: #7fb2f0; --c-mom: #ada3f2;
    --c-first: #f0936b; --c-second: #6fd0a2; --c-third: #62cdd8; --c-all: #e5ebe7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --paper: #1a2220; --ink: #e5ebe7; --muted: #9aa8a1; --line: #2c3633;
  --pine: #8cc7ad; --berry: #ec8a9a; --berry-soft: #3a2228;
  --c-grandpa: #e6b55a; --c-grandma: #e09ae0; --c-dad: #7fb2f0; --c-mom: #ada3f2;
  --c-first: #f0936b; --c-second: #6fd0a2; --c-third: #62cdd8; --c-all: #e5ebe7;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
.tts-opts { display: contents; }
.tts-more { display: none; }
.hint-short { display: none; }
.wrap { max-width: 46rem; margin: 0 auto; padding-block: 0 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.editing { padding-block: 0 8rem; }

.who-grandpa { color: var(--c-grandpa); } .bg-grandpa { background: var(--c-grandpa); }
.who-grandma { color: var(--c-grandma); } .bg-grandma { background: var(--c-grandma); }
.who-dad { color: var(--c-dad); } .bg-dad { background: var(--c-dad); }
.who-mom { color: var(--c-mom); } .bg-mom { background: var(--c-mom); }
.who-first { color: var(--c-first); } .bg-first { background: var(--c-first); }
.who-second { color: var(--c-second); } .bg-second { background: var(--c-second); }
.who-third { color: var(--c-third); } .bg-third { background: var(--c-third); }
.who-all { color: var(--c-all); }

button { font-family: inherit; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; font-size: .86rem; font-weight: 500; padding: .4rem .9rem; border-radius: 8px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--pine); border-color: var(--pine); color: var(--bg); }
.btn-primary:hover { border-color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn:focus-visible, .card:focus-visible, .chip:focus-visible, .tools button:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }

/* Title block */
.masthead { padding-block: 3.5rem 2rem; display: grid; gap: .6rem; }
.masthead-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.eyebrow { font-size: .8rem; letter-spacing: .14em; color: var(--berry); font-weight: 600; }
h1 { font-family: var(--f-display); font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: 1.2; margin: 0; text-wrap: balance; color: var(--pine); }
.meta { color: var(--muted); font-size: .92rem; margin: 0; font-variant-numeric: tabular-nums; }
.toc { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin-top: .8rem; font-size: .92rem; }
.toc a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.toc a:hover { border-color: var(--pine); }
.toc span { color: var(--berry); font-weight: 600; margin-right: .35rem; }
.edit-hint { margin: .4rem 0 0; font-size: .86rem; color: var(--muted); background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; padding: .6rem .8rem; }
.banner { margin-top: 1.2rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; font-size: .88rem; background: var(--berry-soft); border-radius: 8px; padding: .7rem .9rem; }
.banner p { margin: 0; flex: 1 1 16rem; }

/* Cast */
.section-title { font-family: var(--f-display); font-size: 1.5rem; margin: 0 0 .2rem; }
.section-note { color: var(--muted); font-size: .88rem; margin: 0; }
.cast { padding-block: 1rem 2.5rem; border-top: 1px solid var(--line); display: grid; gap: 1.6rem; }
.group { display: grid; gap: .6rem; }
.group-label { margin: 0; font-size: .76rem; letter-spacing: .16em; color: var(--muted); font-weight: 600; }
.cards { display: grid; gap: .8rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: .9rem; align-items: start;
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: .75rem; transition: border-color .15s, box-shadow .15s; }
button.card { cursor: pointer; }
.cards-3 .card { grid-template-columns: 1fr; }
.card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; display: block; background: var(--line); }
.cards-3 .card img { aspect-ratio: 1 / 1; }
.card-body { display: grid; gap: .15rem; min-width: 0; }
.card-role { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.3; }
.card-ref { font-size: .8rem; color: var(--muted); font-weight: 500; }
.card-desc { font-size: .88rem; line-height: 1.55; margin-top: .3rem; }
.card-count { font-size: .76rem; color: var(--muted); margin-top: .35rem; font-variant-numeric: tabular-nums; }
button.card:hover { border-color: var(--muted); }
.card[aria-pressed="true"] { border-color: var(--pine); box-shadow: 0 0 0 1px var(--pine); }

/* Sticky "my lines" bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.picker { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: .6rem; display: grid; gap: .45rem; }
.picker-row { display: flex; align-items: center; gap: .5rem; overflow-x: auto; scrollbar-width: none; }
.tts { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .9rem; font-size: .8rem; color: var(--muted); }
.tts label { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; white-space: nowrap; }
.tts label.off { opacity: .5; cursor: default; }
.tts input[type="checkbox"] { accent-color: var(--pine); margin: 0; }
.tts select.f { width: auto; padding: .15rem .3rem; font-size: .8rem; }
.btn-sm { font-size: .8rem; padding: .25rem .75rem; }
.tts-wait { color: var(--berry); font-weight: 600; display: inline-flex; align-items: center; gap: .5rem; }
.who[data-from] { cursor: pointer; }
.who[data-from]:hover { text-decoration: underline; text-underline-offset: 3px; }
.can-edit [data-edit] { cursor: text; border-radius: 4px; transition: background-color .12s; }
.can-edit [data-edit]:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.who.role-mode { outline: 2px solid var(--pine); outline-offset: 3px; border-radius: 4px; background: var(--paper); }
.who.role-mode::after { content: " ↕"; color: var(--muted); font-weight: 400; }
[data-edit][contenteditable] { outline: 2px solid var(--pine); outline-offset: 3px; background: var(--paper); color: var(--ink); font-style: normal; }
.speaking { background: color-mix(in srgb, var(--pine) 13%, transparent); border-radius: 6px; box-shadow: 0 0 0 .35rem color-mix(in srgb, var(--pine) 13%, transparent); }
.script[data-focus] .speaking { opacity: 1; }
.picker-label { font-size: .78rem; color: var(--muted); white-space: nowrap; margin-right: .2rem; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; white-space: nowrap; font-size: .85rem; padding: .25rem .7rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--paper); display: inline-flex; align-items: center; gap: .35rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: .5rem; height: .5rem; border-radius: 50%; display: inline-block; }

/* Script */
.act { padding-block: 2.6rem .5rem; }
.act-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .8rem; margin-bottom: 1.4rem; padding-bottom: .7rem; border-bottom: 2px solid var(--pine); }
.act-num { font-family: var(--f-display); font-weight: 700; color: var(--berry); font-size: 1.05rem; }
.act-head h2 { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.3; margin: 0; text-wrap: balance; }
.act-time { margin-left: auto; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.line { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: .8rem; padding-block: .32rem; transition: opacity .15s; }
.line p { margin: 0; }
.who { font-weight: 600; font-size: .92rem; padding-top: .08rem; }
.dir { color: var(--muted); font-size: .88em; font-style: italic; }
.stage { margin: .9rem 0 .9rem 5.4rem; color: var(--muted); font-style: italic; font-size: .92rem; line-height: 1.6; transition: opacity .15s; }
.cue { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: .8rem; margin: 1.1rem 0; padding: .8rem .9rem .8rem 0;
  background: var(--berry-soft); border-radius: 8px; transition: opacity .15s; }
.cue-label { font-size: .74rem; letter-spacing: .12em; font-weight: 600; color: var(--berry); text-align: right; padding-top: .2rem; }
.cue b { font-weight: 600; }
.cue p { margin: .15rem 0 0; font-size: .92rem; color: var(--muted); }

.clip { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .7rem; margin-top: .55rem; }
.play { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; font-size: .82rem; font-weight: 600;
  color: var(--bg); background: var(--berry); border-radius: 999px; padding: .28rem .8rem .28rem .65rem; }
.play:hover { filter: brightness(1.08); }
.play:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
.play svg { width: .8rem; height: .8rem; fill: currentColor; }
.bar { flex: 1 1 6rem; max-width: 14rem; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--berry) 22%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--berry); }
.clip-time { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.find { font-size: .78rem; color: var(--muted); }
.find a { color: inherit; }
.clip-edit { display: grid; gap: .45rem; margin-top: .2rem; padding: .6rem; border: 1px dashed var(--line); border-radius: 8px; background: var(--paper); }
.clip-edit audio { width: 100%; height: 2.2rem; }
.clip-row { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; font-size: .8rem; color: var(--muted); }
.clip-row .f { width: 5.2rem; font-variant-numeric: tabular-nums; }
.clip-row .btn { font-size: .78rem; padding: .25rem .6rem; }
.clip-msg { font-size: .78rem; color: var(--muted); }
.clip-msg.warn { color: var(--berry); }
.file-btn input { display: none; }

.script[data-focus] .line, .script[data-focus] .stage, .script[data-focus] .cue { opacity: .32; }
.script[data-focus] .line.on { opacity: 1; }
.script[data-focus] .line.on p { background: color-mix(in srgb, var(--pine) 9%, transparent); border-radius: 4px; box-shadow: -.4rem 0 0 color-mix(in srgb, var(--pine) 9%, transparent), .4rem 0 0 color-mix(in srgb, var(--pine) 9%, transparent); }

.fin { text-align: center; font-family: var(--f-display); color: var(--pine); font-size: 1.1rem; margin: 3rem 0 0; letter-spacing: .3em; }
.credits { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .76rem; color: var(--muted); line-height: 1.7; }
.credits a { color: inherit; }

/* Edit mode */
.f { box-sizing: border-box; width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .5rem; line-height: 1.55; }
.f:focus { outline: none; border-color: var(--pine); box-shadow: 0 0 0 1px var(--pine); }
textarea.f { resize: none; overflow: hidden; display: block; }
.f-title { font-family: var(--f-display); font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 700; color: var(--pine); line-height: 1.25; }
.f-role { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.f-small { font-size: .84rem; }
.ref-row { display: flex; align-items: center; gap: .35rem; font-size: .8rem; color: var(--muted); }
.ref-row .f { width: 7rem; }
.act-head.is-edit { display: grid; grid-template-columns: 5rem minmax(0, 1fr) 7rem auto; gap: .5rem; align-items: center; }
.act-head.is-edit .f-name { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; }
.act-head.is-edit .f-num { color: var(--berry); font-weight: 600; }

.item { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr) auto; gap: .5rem; align-items: start; padding-block: .25rem; }
.who-sel { font-weight: 600; font-size: .86rem; padding: .35rem .3rem; }
.e-tag { font-size: .74rem; letter-spacing: .12em; font-weight: 600; text-align: right; padding-top: .45rem; color: var(--muted); }
.e-cue .e-tag { color: var(--berry); }
.e-stage textarea { font-style: italic; color: var(--muted); }
.e-cue-fields { display: grid; gap: .3rem; min-width: 0; }
.e-cue-fields input { font-weight: 600; }
.tools { display: flex; gap: .15rem; padding-top: .2rem; opacity: 0; transition: opacity .12s; }
.item:hover .tools, .item:focus-within .tools { opacity: 1; }
@media (hover: none) { .tools { opacity: 1; } }
.tools button, .act-add button, .act-del { all: unset; box-sizing: border-box; cursor: pointer; font-size: .72rem; color: var(--muted); padding: .2rem .4rem; border-radius: 5px; border: 1px solid transparent; white-space: nowrap; }
.tools button:hover, .act-add button:hover, .act-del:hover { border-color: var(--line); color: var(--ink); background: var(--paper); }
.tools .del:hover, .act-del:hover { color: var(--berry); }
.act-del[data-armed] { color: var(--berry); border-color: var(--berry); }
.act-add { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0 0 5.7rem; }
.act-add button { border: 1px dashed var(--line); padding: .3rem .7rem; font-size: .8rem; }
.add-act { margin-top: 2rem; }

.editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
  padding-block: .7rem calc(.7rem + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.editbar-in { max-width: 46rem; margin: 0 auto; display: flex; align-items: center; gap: .6rem; }
.status { flex: 1; min-width: 0; font-size: .84rem; color: var(--muted); }
.status.warn { color: var(--berry); }

@media (max-width: 640px) {
  .picker { padding-block: .45rem; gap: .35rem; }
  .tts { gap: .4rem .7rem; }
  .tts-more { display: inline-block; }
  .tts-opts { display: none; }
  .tts.open .tts-opts { display: flex; flex-wrap: wrap; gap: .4rem .9rem; width: 100%; padding-top: .2rem; }
  .hint-full { display: none; }
  .hint-short { display: inline; }
  .cards, .cards-3 { grid-template-columns: minmax(0, 1fr); }
  .cards-3 .card { grid-template-columns: 5.5rem minmax(0, 1fr); }
  .cards-3 .card img { aspect-ratio: 3 / 4; }
  .line, .cue { grid-template-columns: 3.9rem minmax(0, 1fr); gap: .6rem; }
  .stage { margin-left: 4.5rem; }
  .item { grid-template-columns: 4.6rem minmax(0, 1fr); }
  .tools { grid-column: 1 / -1; justify-self: end; padding-top: 0; }
  .act-add { margin-left: 0; }
  .act-head.is-edit { grid-template-columns: 4.5rem minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .picker, .toc, .credits, #edit-btn, .banner { display: none; }
  body { background: #fff; }
  .line, .cue, .card { break-inside: avoid; }
  .act { break-before: page; }
}

{"t": "line", "who": "second", "text": "(조심스럽게) 형 혹시 합격 발표났어? 아까부터 핸드폰 계속 확인하는 것 같던데"}, {"t": "line", "who": "first", "text": "(휴대폰을 얼른 뒤집으며) 아직 안 났어. 신경 쓰지마."}, {"t": "line", "who": "third", "text": "오빠는 이미 재수 확정인거 아냐?"}, {"t": "line", "who": "first", "text": "(자리에서 벌떡) 야!! 말이 씨가 된다고! 얼른 취소해"}, {"t": "line", "who": "second", "text": "(차분하게) 형, 너무 걱정하지 마. 혹여나 결과가 좋지 않아서 재수하더라도 좋은 경험이 될 수 있어."}, {"t": "line", "who": "first", "text": "아직 결과 안 나왔다니까. 진심으로 위로하지 말라고!"}, {"t": "line", "who": "second", "text": "(미소 지으며) 미안해. 형이 너무 걱정하길래.."}, {"t": "line", "who": "third", "text": "(자제시키는 손동작을 하며) 워워~ 오늘은 크리스마스잖아! 내가 특별한 이벤트를 준비했으니까 오늘은 즐겨줘."}, {"t": "line", "who": "first", "text": "(의심스럽게) 너 또 무슨 사고 치려고?"}, {"t": "stage", "text": "막내가 런닝맨 PD처럼 미션 카드를 꺼내 한 장씩 나눠 준다."}, {"t": "line", "who": "third", "text": "지금부터 PD 막내가 미션을 드리겠습니다! 무려! 제1회 우리 가족 크리스마스 장기자랑! 그리고 우승자에게는 특별한 선물이 있습니다!"}, {"t": "line", "who": "grandpa", "text": "(카드를 읽으며) \"가족에게 감동을 줄 것\"? 이거 완전 내 전문이지!"}, {"t": "line", "who": "grandma", "text": "(단호하게) 당신 전문은 감동이 아니라 민폐지."}, {"t": "line", "who": "grandpa", "text": "(벌떡 일어나며) 선물?! 그럼 내가 나가야지! 나 아까 춤추는 거 봤지?"}, {"t": "line", "who": "grandma", "text": "봤으니까 걱정이지."}, {"t": "line", "who": "third", "text": "잠깐! 장기자랑에 앞서서 우승 상품부터 정해야지! 지금부터 각자 크리스마스에 받고 싶은 선물을 말해봐!"}, {"t": "line", "who": "dad", "text": "(신나서) 오~ 선물? 그럼 내가 먼저!"}]}, {"num": "2막", "name": "크리스마스 선물", "time": "승", "items": [{"t": "line", "who": "dad", "text": "(자신만만하게) 나는 설거지 평생 면제권! 앞으로 설거지는 단 한 번도 안 하는 거야!"}, {"t": "line", "who": "mom", "text": "(어이없다는 표정으로) 여보, 그럼 내가 당신한테 설거지 10회 이용권을 선물해 줄게요!"}, {"t": "line", "who": "dad", "text": "(당황하며) 아니! 내가 받고 싶은 건 면제권이라니까?!"}, {"t": "line", "who": "grandma", "text": "(웃으며) 아이고, 선물 받기도 전에 일이 더 늘어났네!"}, {"t": "line", "who": "third", "text": "(박수 치며) 아빠 선물은 설거지 10회 이용권으로 확정! 다음!"}, {"t": "line", "who": "grandma", "text": "그럼 우리 둘째는 뭐 받고 싶어?"}, {"t": "line", "who": "second", "text": "저는 특별히 필요한 건 없어요. 가족들이 모두 건강하고 행복하면 좋겠어요."}, {"t": "stage", "text": "모두 감탄한다."}, {"t": "line", "who": "grandma", "text": "아이고~ 우리 둘째는 어쩜 말도 이렇게 예쁘게 해!"}, {"t": "line", "who": "first", "text": "(똑같이 따라 하며) 저도 가족들이 모두 건강하고 행복하면 좋겠어요."}, {"t": "line", "who": "mom", "text": "어제 치킨 다리 두 개 다 먹은 사람이 누구더라~"}, {"t": "line", "who": "first", "text": "(억울하게) 아니!!! 똑같은 말 했는데 왜 나만!!!"}, {"t": "line", "who": "grandma", "text": "그러니까 진짜로 원하는 선물을 말해봐~"}, {"t": "line", "who": "first", "text": "사실은… 서울대 합격증이요."}, {"t": "line", "who": "mom", "text": "(두 손을 모으며) 오… 아멘!!"}, {"t": "line", "who": "first", "text": "(휴대폰을 힐끗 보며, 작게) …아니, 그냥 아무 데나 합격 문자 하나요."}, {"t": "line", "who": "grandpa", "text": "(갑자기 손을 들며) 잠깐! 나는 최신 스마트폰! 그걸로 요즘 애들처럼 춤 영상 찍어야지!"}, {"t": "line", "who": "grandma", "text": "당신은 전화도 잘 못 받으면서 무슨 최신 스마트폰이에요!"}, {"t": "line", "who": "grandpa", "text": "(억울하게) 아까 막내가 나보고 힙하다고 했잖아!"}, {"t": "line", "who": "third", "text": "인정! 할아버지 춤 영상 조회수는 내가 책임질게!"}, {"t": "line", "who": "mom", "text": "조회수보다 허리부터 책임져야 할 것 같은데…."}, {"t": "line", "who": "grandpa", "text": "(허리를 붙잡으며) 아유, 아유…."}, {"t": "line", "who": "third", "text": "자! 그럼 할머니 소원은 뭐야?"}, {"t": "line", "who": "grandma", "text": "(할아버지를 흘끗 보며) 나는 선물은 됐고, 소원이 하나 있어요. 올해 영감이 허리 안 다치고 건강한 거."}, {"t": "line", "who": "grandpa", "text": "(감동하며) 여보…."}, {"t": "line", "who": "grandma", "text": "그리고 춤은 좀 적당히 추고."}, {"t": "line", "who": "grandpa", "text": "(억울하게) 방금 감동 돌려줘!"}, {"t": "line", "who": "third", "text": "그럼 엄마는?"}, {"t": "line", "who": "mom", "text": "(무심한 듯) 나는… 올해 가족사진 한 장 제대로 찍는 거."}, {"t": "line", "who": "dad", "text": "그거야 지금 찍으면 되지!"}, {"t": "line", "who": "mom", "text": "(아빠를 쳐다보며) 단, 당신이 눈을 감지 않은 가족사진!"}, {"t": "line", "who": "dad", "text": "(눈을 부릅뜬 채로, 셀카모드의 카메라를 들이밀며) 여기 봐 봐. 하나 둘 셋!"}, {"t": "stage", "text": "가족들이 모여 가족사진 포즈를 잡는다. 아빠가 눈을 너무 부릅떠서 다들 웃음이 터진다."}, {"t": "line", "who": "third", "text": "(손뼉을 치며) 사진도 찍었으니 이제 우리 가족 크리스마스 장기자랑 시작해 볼까? 과연 누가 우승 상품을 받을 것인가! 두구두구!"}]}, {"num": "3막", "name": "우리 가족 크리스마스 장기자랑", "time": "승", "items": [{"t": "line", "who": "third", "text": "(블루투스 스피커를 꺼내며) 자! 첫 번째 무대의 주인공은 바로 우리 할아버지!"}, {"t": "line", "who": "grandpa", "text": "(자신만만하게 앞으로 나오며) 오늘 내가 요즘 젊은이들의 문화가 뭔지 제대로 보여주마!"}, {"t": "line", "who": "grandma", "text": "(의심스러운 표정으로) 아이고, 또 무슨 이상한 걸 하려고…."}, {"t": "line", "who": "grandpa", "text": "(할머니를 가리키며) 여보! 당신도 얼른 나와 봐! 오늘 우리 둘이 제대로 보여주자고!"}, {"t": "line", "who": "grandma", "text": "(당황하며) 내가 왜요? 나는 춤출 생각 없어요!"}, {"t": "line", "who": "grandpa", "text": "에이~ 왜 그래! 우리도 아직 젊다고! 자, 뮤직 큐!"}, {"t": "cue", "song": "A20 「NEON」 도입부", "text": "할아버지와 할머니가 함께 앞으로 나와 듀엣 안무를 선보인다."}, {"t": "stage", "text": "춤이 끝나고 가족들이 박수를 친다."}, {"t": "line", "who": "third", "text": "(흥분하며) 와아아! 할아버지 할머니 뭐야?! 완전 멋있어!"}, {"t": "line", "who": "grandpa", "text": "(으쓱하며) 봤지?! 내가 요즘 문화를 모를 리가 없지! 앵콜! 한 곡 더! (허리를 돌리다 멈춘다) …아이고, 허리야!"}, {"t": "line", "who": "grandma", "text": "(할아버지를 붙잡으며) 내가 그럴 줄 알았어! 올해 소원 첫날부터 깨졌네!"}, {"t": "stage", "text": "가족들이 할아버지를 소파에 눕힌다."}, {"t": "line", "who": "grandpa", "text": "(누운 채로) 그래도… 무대는 찢었지?"}, {"t": "line", "who": "grandma", "text": "(여유롭게) 아이고, 당신은 옆에서 따라 하기만 했으면서 생색은…."}, {"t": "line", "who": "grandpa", "text": "(억울하게) 아니! 내가 주인공이었잖아!"}, {"t": "line", "who": "third", "text": "자! 다음은 우리 아빠!"}, {"t": "cue", "song": "ATEEZ 「BAD」", "text": "아빠가 산이 파트에 맞춰 자신만만하게 등장하고 춤을 시작한다. 하지만 동작을 제대로 따라 하지 못한다. 본인은 끝까지 진지하고 멋있는 표정을 유지한다."}, {"t": "line", "who": "dad", "text": "(눈썹 찡긋하며) 어때?! 이 정도면 인정이지?!"}, {"t": "line", "who": "mom", "text": "(박수를 몇 번 치며) 네… 정말 대단하네요. 특히 자신감이요."}, {"t": "line", "who": "first", "text": "(고개를 끄덕이며) 인정. 표정만 보면 산이 압승이야. 춤은… 아빠가 졌고."}, {"t": "line", "who": "dad", "text": "(발끈하며) 야! 너는 얼마나 잘한다고 평가를 해?!"}, {"t": "line", "who": "first", "text": "(능청스럽게) 저는 춤보다는 전략과 지략을 담당하는 사람이죠. 몸으로 하는 건 제 전문 분야가 아니라서요."}, {"t": "line", "who": "grandma", "text": "(첫째를 바라보며) 아이고, 그럼 우리 첫째는 대학 합격 전략부터 잘 세워야겠네?"}, {"t": "line", "who": "first", "text": "(황당한 표정으로) 할머니! 아까부터 왜 자꾸 저만 공격해요!"}, {"t": "line", "who": "second", "text": "(미소 지으며) 할머니, 너무 걱정하지 마세요. 형은 분명 잘할 거예요. 필요하면 제가 공부도 도와줄게요!"}, {"t": "line", "who": "first", "text": "(둘째를 바라보며) 야… 너는 지금 나를 도와주는 거야, 약 올리는 거야?"}, {"t": "line", "who": "second", "text": "(해맑게) 당연히 도와주는 거지! 형은 충분히 잘할 수 있어!"}, {"t": "line", "who": "first", "text": "(관객을 바라보며) 여러분, 저게 더 무서운 거예요…."}, {"t": "stage", "text": "가족들 웃음"}, {"t": "line", "who": "third", "text": "자! 세 번째 무대는 우리 집 엄친아, 둘째!"}, {"t": "line", "who": "second", "text": "(수줍게) 저… 사실 춤은 처음인데요. 열심히 해 볼게요."}, {"t": "line", "who": "mom", "text": "우리 둘째는 뭘 해도 잘하지!"}, {"t": "cue", "song": "곡 미정 · 둘째의 대반전 무대", "text": "둘째가 아주 진지한 표정으로 춤을 추지만 팔다리가 따로 노는 완벽한 몸치다. 본인만 모르고 끝까지 최선을 다한다."}, {"t": "stage", "text": "음악이 끝나고 정적. 둘째가 해맑게 인사한다."}, {"t": "line", "who": "first", "text": "(벌떡 일어나 환호하며) 여러분! 드디어! 드디어 우리 집에도 공평함이 찾아왔습니다!"}, {"t": "line", "who": "grandma", "text": "(박수 치며) 아이고, 하나님은 공평하시구나!"}, {"t": "line", "who": "second", "text": "(해맑게) 저 잘했어요?"}, {"t": "line", "who": "dad", "text": "(어깨를 두드리며) 음… 아빠보다는… 아니, 아빠랑 비슷했어."}, {"t": "line", "who": "mom", "text": "그게 위로야?"}, {"t": "line", "who": "third", "text": "자, 이제 관객 여러분이 심사위원! 제일 좋았던 무대에 박수 주세요! 할아버지 할머니! 아빠! 둘째!"}, {"t": "stage", "text": "막내가 무대마다 관객의 박수를 유도한다."}, {"t": "line", "who": "third", "text": "좋아요! 그럼 마지막 참가자, 우리 오빠!"}, {"t": "line", "who": "first", "text": "나는 안 한다니까."}, {"t": "line", "who": "third", "text": "빼지 마~ 오빠 폰에 몰래 연습한 춤 영상 있는 거 다 알아! (첫째의 휴대폰을 낚아챈다)"}, {"t": "line", "who": "first", "text": "야! 그거 내놔!"}]}, {"num": "4막", "name": "보여줄 게 없는 사람", "time": "전", "items": [{"t": "stage", "text": "막내가 휴대폰 화면을 켜는 순간, 진동이 울리고 알림이 뜬다."}, {"t": "line", "who": "third", "text": "(신나게 화면을 보다가, 무심코 소리 내어 읽으며) \"○○대학교 최종 합격자 발표 결과… 아쉽게도…\" (읽다가 멈춘다)"}, {"t": "stage", "text": "음악이 뚝 끊긴다. 정적. 조명이 첫째에게만 남는다."}, {"t": "line", "who": "third", "text": "(작게) 오빠… 미안. 나 몰랐어."}, {"t": "line", "who": "first", "text": "(휴대폰을 받아 들며) …괜찮아. 어차피 알고 있었어."}, {"t": "line", "who": "mom", "text": "아들…."}, {"t": "line", "who": "first", "text": "(애써 웃으며) 재수 확정이라고 놀릴 땐 웃겼는데… 진짜 확정이네."}, {"t": "line", "who": "second", "text": "형…."}, {"t": "line", "who": "first", "text": "거봐요. 장기자랑도, 대학도. 둘째는 다 잘하고, 막내는 춤 잘 추고, 할아버지 할머니는 무대도 찢었는데. 나는 보여줄 게 하나도 없어."}, {"t": "line", "who": "first", "text": "됐어. 나 빼고 해. (무대 한쪽 구석으로 가서 등을 돌리고 앉는다.)"}, {"t": "stage", "text": "어색한 침묵. 아무도 먼저 말을 꺼내지 못한다."}]}, {"num": "5막", "name": "크리스마스의 진짜 선물", "time": "결", "items": [{"t": "stage", "text": "아빠가 머뭇거리다 일어선다. 가족들이 놀라서 아빠를 쳐다본다."}, {"t": "line", "who": "dad", "text": "(작게) 아… 나 이런 거 진짜 못 하는데…. (첫째 옆에 쭈그려 앉는다) 야. 아빠도 첫 시험 떨어졌었다."}, {"t": "line", "who": "first", "text": "…진짜요?"}, {"t": "line", "who": "dad", "text": "그럼. 그때 네 할아버지가 뭐라고 했는지 알아?"}, {"t": "line", "who": "grandpa", "text": "(소파에 누운 채로) 내가 뭐라고 했는데?"}, {"t": "line", "who": "dad", "text": "\"괜찮다, 밥 먹자.\""}, {"t": "line", "who": "grandpa", "text": "(헛기침하며) 흠… 명언이었네."}, {"t": "stage", "text": "가족들 작게 웃음"}, {"t": "line", "who": "second", "text": "(첫째에게 다가가며) 형. 나 사실 형이 부러웠어."}, {"t": "line", "who": "first", "text": "뭐? 네가? 나를?"}, {"t": "line", "who": "second", "text": "나는 틀리면 안 될 것 같아서 늘 긴장돼. 근데 형은 넘어져도 웃잖아. 우리 집이 웃는 건 거의 다 형 덕분이야."}, {"t": "line", "who": "third", "text": "맞아! 오빠 없으면 내가 누굴 놀려!"}, {"t": "line", "who": "first", "text": "그게 위로냐…."}, {"t": "line", "who": "mom", "text": "(첫째에게 무언가를 건네며) 이거."}, {"t": "line", "who": "first", "text": "…제 수능 수험표잖아요. 이걸 왜 엄마가…."}, {"t": "line", "who": "mom", "text": "버릴 수가 없더라. 결과가 어떻든, 네가 1년 동안 버틴 증거잖아. 엄마는 그게 자랑스러워."}, {"t": "stage", "text": "첫째가 고개를 숙인다. 음악이 잔잔해지고 조명이 따뜻하게 바뀐다."}, {"t": "line", "who": "grandma", "text": "(첫째의 손을 잡으며) 첫째야. 아주 오래전, 어둡고 추운 세상에 하나님께서 가장 귀한 선물을 보내주셨단다. 바로 아기 예수님이야."}, {"t": "line", "who": "mom", "text": "온 세상의 왕이 화려한 궁전이 아니라, 작은 마구간 구유에 아기로 오셨지."}, {"t": "line", "who": "third", "text": "1등 자리 말고, 제일 낮은 자리에!"}, {"t": "line", "who": "grandpa", "text": "(허리를 붙잡고 겨우 일어나, 평소와 다른 진지한 목소리로) “하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니.” 요한복음 3장 16절이지."}, {"t": "line", "who": "third", "text": "(놀라며) 할아버지, 지금 완전 멋있었어."}, {"t": "line", "who": "grandpa", "text": "(쑥스러워하며) 나는 원래 멋있었어."}, {"t": "line", "who": "grandma", "text": "하나님은 우리가 장기자랑에서 1등 해서 사랑하시는 게 아니야. 합격해서도 아니고. 네가 뭘 해서가 아니라, 네가 너라서 사랑하시는 거야. 우리도 그렇고."}, {"t": "line", "who": "first", "text": "(울컥하며) 갑자기 왜 이래요…. 분위기 이상하게."}, {"t": "line", "who": "mom", "text": "(웃으며) 너 지금 울어?"}, {"t": "line", "who": "first", "text": "아니거든요! 먼지 들어간 거예요!"}, {"t": "stage", "text": "가족들 웃음"}, {"t": "line", "who": "third", "text": "아! 그리고 우승 상품 발표! (작은 선물 상자를 꺼낸다) 오늘의 우승 상품은… 무대에 안 선 사람한테 줄 거야!"}, {"t": "line", "who": "first", "text": "뭐? 나?"}, {"t": "line", "who": "third", "text": "(상자를 건네며) 열어 봐."}, {"t": "stage", "text": "첫째가 상자를 연다. 상자는 비어 있고, 쪽지 한 장만 들어 있다."}, {"t": "line", "who": "first", "text": "(쪽지를 읽으며) \"선물은 이미 왔다.\" …야, 이거 빈 상자잖아!!!"}, {"t": "line", "who": "third", "text": "“오늘 다윗의 동네에 너희를 위하여 구주가 나셨으니.” 누가복음 2장 11절! 제일 큰 선물은 이미 받았다고!"}, {"t": "line", "who": "dad", "text": "(손을 번쩍 들며) 그리고 하나 더! 올해 설거지는… 내가 다 할게!"}, {"t": "line", "who": "mom", "text": "(깜짝 놀라며) 여보…?"}, {"t": "line", "who": "dad", "text": "면제권은 필요 없어. 첫째 몫까지 내가 한다!"}, {"t": "line", "who": "grandma", "text": "아이고, 오늘 진짜 크리스마스 기적이 일어났네!"}, {"t": "line", "who": "first", "text": "(쪽지를 꼭 쥐며) …고마워요. 진짜로."}, {"t": "line", "who": "grandpa", "text": "그래, 마지막 무대는 이 선물을 보내주신 분께 드리자꾸나."}, {"t": "line", "who": "grandma", "text": "오늘의 진짜 주인공, 예수님께요."}, {"t": "line", "who": "third", "text": "자! 오늘 센터는 오빠! 우리 가족의 마지막 무대, 시작합니다!"}, {"t": "cue", "song": "「Christmas Is All About Jesus」", "text": "첫째를 가운데 세우고 전원이 함께 안무를 선보인다. 할아버지는 허리를 붙잡은 채 상체만으로 열심히 따라 춘다."}, {"t": "stage", "text": "춤이 끝나면 전원이 관객을 향해 선다."}, {"t": "line", "who": "all", "text": "메리 크리스마스! 예수님의 탄생을 축하합니다!"}, {"t": "line", "who": "mom", "text": "잠깐! 이대로 가족사진 한 장! 오늘은 진짜 제대로!"}, {"t": "line", "who": "dad", "text": "(셀카모드 카메라를 들며) 자, 다들 웃어! 하나, 둘, 셋!"}, {"t": "stage", "text": "찰칵. 모두 모여 화면을 들여다본다."}, {"t": "line", "who": "mom", "text": "…여보. 이번엔 당신이 눈 감았잖아!!!"}, {"t": "line", "who": "dad", "text": "(억울하게) 아니, 감동받아서 그런 거라고!"}, {"t": "stage", "text": "암전"}]}]}</script>
<script id="app">
(function () {
  var SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  var STYLE_SRC = document.getElementById('app-style').textContent;
  var APP_SRC = document.getElementById('app').textContent;
  var ORIGINAL = document.getElementById('state').textContent;
  var state = JSON.parse(ORIGINAL);
  var root = document.getElementById('root');

  var localMode = !(window.claude && typeof window.claude.use === 'function');
  var onServer = /^https?:$/.test(location.protocol);
  var editKey = '';
  try { editKey = new URLSearchParams(location.search).get('key') || ''; } catch (e) {}
  var LOCAL_KEY = 'skit-local-draft';
  var editing = false, dirty = false, canWrite = localMode && (!onServer || !!editKey), art = null, focusKey = '', draft = null, statusMsg = '', statusWarn = false, saving = false;
  try { focusKey = localStorage.getItem('skit-focus') || ''; } catch (e) {}
  try {
    draft = sessionStorage.getItem('skit-draft');
    if (draft && draft === JSON.stringify(state)) { sessionStorage.removeItem('skit-draft'); draft = null; }
  } catch (e) { draft = null; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmt(s) {
    return esc(s).replace(/\(([^)]*)\)/g, '<span class="dir">($1)</span>').replace(/\n/g, '<br>');
  }
  function castBy(key) {
    for (var i = 0; i < state.cast.length; i++) if (state.cast[i].key === key) return state.cast[i];
    return null;
  }
  function roleName(key) {
    if (key === 'all') return '전원';
    var c = castBy(key);
    return c ? (c.role || '(이름 없음)') : '?';
  }
  function stats() {
    var counts = {}, lines = 0, cues = 0;
    state.cast.forEach(function (c) { counts[c.key] = 0; });
    state.acts.forEach(function (a) {
      a.items.forEach(function (it) {
        if (it.t === 'line') { lines++; if (counts[it.who] != null) counts[it.who]++; }
        else if (it.t === 'cue') cues++;
      });
    });
    return { counts: counts, lines: lines, cues: cues };
  }
  function metaText(s) {
    return '등장인물 ' + state.cast.length + '명 · ' + state.acts.length + '막 · 대사 ' + s.lines + '줄 · 삽입곡 ' + s.cues + '곡';
  }
  function tocHTML() {
    return state.acts.map(function (a, i) {
      return '<a href="#act' + (i + 1) + '"><span>' + esc(a.num) + '</span>' + esc(a.name) + '</a>';
    }).join('');
  }

  /* ---------- rendering ---------- */
  function mastheadHTML(s) {
    var title = editing

  }
  root.addEventListener('focusout', function (e) { if (inlineEl && e.target === inlineEl) commitInline(); });
  function caretOffset(el) {
    var sel = window.getSelection(); if (!sel.rangeCount) return 0;
    var r = sel.getRangeAt(0), pre = document.createRange();
    pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().length;
  }
  function caretLine(el) {
    var off = caretOffset(el), len = (el.textContent || '').length;
    var sel = window.getSelection(), rect = null;
    if (sel.rangeCount) { var r = sel.getRangeAt(0).cloneRange(); r.collapse(true); var rs = r.getClientRects(); if (rs.length) rect = rs[0]; }
    if (!rect || !len) return { first: off === 0, last: off === len, off: off };
    var box = el.getBoundingClientRect(), lh = parseFloat(getComputedStyle(el).lineHeight) || 24;
    return { first: off === 0 || rect.top < box.top + lh * 0.7, last: off === len || rect.bottom > box.bottom - lh * 0.7, off: off };
  }
  function editables() { return Array.prototype.slice.call(root.querySelectorAll('.script [data-edit]')); }
  function moveInline(dir) {
    var list = editables(), i = list.indexOf(inlineEl), next = list[i + dir];
    if (!next) return false;
    startInlineEdit(next, null, dir > 0 ? 0 : 'end');
    next.scrollIntoView({ block: 'nearest' });
    return true;
  }

  /* role mode: the speaker name becomes a picker driven by the arrow keys */
  var roleEl = null, roleOrig = null;
  function roleKeys() { return state.cast.map(function (c) { return c.key; }).concat(['all']); }
  function setRole(lineDiv, key) {
    var it = itemForEl(lineDiv); if (!it) return;
    it.who = key;
    lineDiv.setAttribute('data-who', key);
    var nm = lineDiv.querySelector('.who');
    nm.className = 'who who-' + key + ' role-mode';
    nm.textContent = roleName(key);
    markDirty(); showInlineBar(); updateDerived(); applyFocus(false);
  }
  function enterRoleMode(textEl) {
    var lineDiv = textEl.closest('.line[data-k]'); if (!lineDiv) return false;
    commitInline();
    var nm = lineDiv.querySelector('.who');
    roleEl = nm; roleOrig = itemForEl(lineDiv).who;
    nm.tabIndex = 0; nm.classList.add('role-mode');
    nm.title = '↑↓ 역할 바꾸기 · → 대사로 돌아가기 · Esc 되돌리기';
    nm.focus();
    return true;
  }
  function exitRoleMode() {
    if (!roleEl) return;
    var nm = roleEl; roleEl = null;
    nm.classList.remove('role-mode'); nm.removeAttribute('tabindex'); nm.title = '누르면 여기부터 읽어요';
  }
  function backToText(nm) {
    var lineDiv = nm.closest('.line[data-k]');
    exitRoleMode();
    var tx = lineDiv && lineDiv.querySelector('[data-edit]');
    if (tx) startInlineEdit(tx, null, 0);
  }

  root.addEventListener('keydown', function (e) {
    if (roleEl && e.target === roleEl) {
      var lineDiv = roleEl.closest('.line[data-k]'), keys = roleKeys(), cur = keys.indexOf(itemForEl(lineDiv).who);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        setRole(lineDiv, keys[(cur + (e.key === 'ArrowDown' ? 1 : -1) + keys.length) % keys.length]);
      } else if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault(); backToText(roleEl);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (roleOrig && roleOrig !== itemForEl(lineDiv).who) setRole(lineDiv, roleOrig);
        backToText(roleEl);
      }
      return;
    }
    if (!inlineEl || e.target !== inlineEl) return;
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); inlineEl.blur(); return; }
    if (e.key === 'Escape') { e.preventDefault(); commitInline(true); return; }
    if (e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
    var sel = window.getSelection();
    if (sel.rangeCount && !sel.isCollapsed) return;
    var pos;
    if (e.key === 'ArrowDown') { pos = caretLine(inlineEl); if (pos.last && moveInline(1)) e.preventDefault(); }
    else if (e.key === 'ArrowUp') { pos = caretLine(inlineEl); if (pos.first && moveInline(-1)) e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { if (caretOffset(inlineEl) === 0 && enterRoleMode(inlineEl)) e.preventDefault(); }
  });
  root.addEventListener('focusout', function (e) { if (roleEl && e.target === roleEl) exitRoleMode(); });
  root.addEventListener('paste', function (e) {
    if (!inlineEl || !inlineEl.contains(e.target)) return;
    e.preventDefault();
    var txt = (e.clipboardData || window.clipboardData).getData('text');
    document.execCommand('insertText', false, txt.replace(/\r?\n/g, ' '));
  });

  /* ---------- saving outside claude.ai: write the page back to a file ---------- */
  var fileHandle = null;
  function downloadDoc(html) {
    var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url; a.download = (state.title || '대본') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function saveLocal() {
    if (inlineEl) commitInline();
    if (!dirty) { setStatus('바뀐 내용이 없어요.', false); return; }
    saving = true;
    var sb = document.getElementById('save-btn'); if (sb) sb.disabled = true;
    setStatus('저장 중…', false);
    var html = buildDoc();
    function done(msg) {
      ORIGINAL = JSON.stringify(state); dirty = false; saving = false; statusMsg = '';
      clearLocalDraft();
      editing = false; render();
      toast(msg);
    }
    function fail(msg) { saving = false; if (sb) sb.disabled = false; setStatus(msg, true); }
    if (/^https?:$/.test(location.protocol)) {
      fetch(location.pathname === '/' ? '/index.html' : location.pathname, { method: 'PUT', headers: { 'Content-Type': 'text/html; charset=utf-8', 'X-Edit-Key': editKey }, body: html })
        .then(function (res) {
          if (res.ok) done('저장했어요. Mac에 있는 대본 파일에 바로 저장됐어요.');
          else if (res.status === 403) fail('보기 전용 링크라 저장할 수 없어요. 저장은 편집용 링크에서만 돼요.');
          else fail('저장하지 못했어요 (' + res.status + '). Mac이 켜져 있는지 확인해 주세요.');
        }, function () { fail('Mac에 연결하지 못했어요. Mac이 켜져 있고 Tailscale이 연결돼 있는지 확인해 주세요. 고친 내용은 이 브라우저에 보관돼 있어요.'); });
      return;
    }
    if (window.showSaveFilePicker) {
      var pick = fileHandle ? Promise.resolve(fileHandle) : window.showSaveFilePicker({
        suggestedName: (state.title || '대본') + '.html',
        types: [{ description: 'HTML 파일', accept: { 'text/html': ['.html'] } }]
      });
      pick.then(function (hd) {
        fileHandle = hd;
        return hd.createWritable();
      }).then(function (w) {
        return w.write(new Blob([html], { type: 'text/html' })).then(function () { return w.close(); });
      }).then(function () {
        done('저장했어요. 다음부터는 같은 파일에 바로 저장돼요.');
      }, function (err) {
        if (err && err.name === 'AbortError') { fail('저장을 취소했어요. 고친 내용은 이 브라우저에 보관돼 있어요.'); return; }
        downloadDoc(html); done('파일을 내려받았어요. 받은 파일로 기존 파일을 바꿔 주세요.');
      });
    } else {
      downloadDoc(html); done('파일을 내려받았어요. 받은 파일로 기존 파일을 바꿔 주세요.');
    }
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'editbar'; t.setAttribute('role', 'status');
    t.innerHTML = '<div class="editbar-in"><span class="status">' + esc(msg) + '</span></div>';
    root.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }

  function save() {
    if (saving) return;
    if (localMode) { saveLocal(); return; }
    if (inlineEl) commitInline();
    if (!art) { setStatus('이 화면에서는 저장할 수 없어요. claude.ai에서 페이지를 열어 주세요.', true); return; }
    if (!dirty) { setStatus('바뀐 내용이 없어요.', false); return; }
    saving = true;
    var sb = document.getElementById('save-btn'); if (sb) sb.disabled = true;
    setStatus('저장 중…', false);
    try { sessionStorage.setItem('skit-draft', JSON.stringify(state)); } catch (err) {}
    var wasDirty = dirty; dirty = false;
    art.publish(buildDoc()).then(function () {
      setStatus('저장했어요. 새 버전을 불러오는 중…', false);
    }, function (err) {
      saving = false; dirty = wasDirty;
      if (sb) sb.disabled = false;
      var c = err && err.code;
      if (c === 'conflict') {
        setStatus('다른 곳에서 먼저 저장한 버전이 있어 그 버전을 다시 불러와요. 이번 수정본은 화면 위쪽에서 다시 불러올 수 있어요.', true);
        return;
      }
      try { sessionStorage.removeItem('skit-draft'); } catch (e2) {}
      if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed' || c === 'not_declared') {
        canWrite = false; root.classList.remove('can-edit');
        setStatus('이 계정은 보기 권한만 있어서 저장할 수 없어요. 페이지 주인이나 편집 권한이 있는 사람이 저장해야 해요.', true);
      } else if (c === 'too_large') setStatus('페이지가 너무 커서 저장하지 못했어요.', true);
      else if (c === 'rate_limited') setStatus('저장을 너무 자주 했어요. 잠시 뒤 다시 눌러 주세요.', true);
      else setStatus('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.', true);
    });
  }

  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* outside claude.ai: bring back edits kept in this browser */
  if (localMode && canWrite) {
    try {
      var kept = localStorage.getItem(LOCAL_KEY);
      if (kept && kept !== ORIGINAL) { state = JSON.parse(kept); dirty = true; statusMsg = '이 브라우저에 보관된 수정본을 불러왔어요. "파일로 저장"을 눌러야 파일에 저장돼요.'; }
    } catch (e) {}
    root.classList.add('can-edit');
  }

  render();

  if (!localMode) {
    window.claude.use('artifact').then(function (a) {
      if (!a) return false;
      art = a;
      return window.claude.use('user').then(function (u) { return u ? u.canEdit() : true; }).catch(function () { return true; });
    }).then(function (can) {
      if (!art || !can) return;
      canWrite = true;
      root.classList.add('can-edit');
      var b = document.getElementById('edit-btn'); if (b) b.hidden = false;
      var hint = document.getElementById('inline-hint'); if (hint) hint.hidden = false;
    }).catch(function () {});
  }
})();
</script>
</body></html>
